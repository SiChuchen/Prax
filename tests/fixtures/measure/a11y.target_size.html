<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>a11y.target_size fixture</title>
  <style>
    body { margin: 0; font-family: sans-serif; font-size: 16px; }
    .tiny { width: 16px; height: 16px; }
    .roomy { width: 32px; height: 32px; }
    .compact { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <!-- positive case: 16×16 target, below the 24×24 minimum -->
  <section id="undersized-region" aria-label="positive case">
    <button class="tiny" id="tiny-button" aria-label="Tiny">✕</button>
  </section>

  <!-- negative case: 32×32 target meets the minimum -->
  <section id="sized-region" aria-label="negative case">
    <button class="roomy" id="roomy-button" aria-label="Roomy">OK</button>
  </section>

  <!-- negative case: inline link inside a sentence is exempt -->
  <section id="inline-region" aria-label="inline link exemption">
    <p>This sentence contains an <a href="#details" id="inline-link">inline link</a> that flows with the text.</p>
  </section>

  <!-- negative case: tabindex="-1" programmatic focus anchor -->
  <h2 tabindex="-1" id="focus-anchor" style="font-size:18px;margin:0">Step heading focus anchor</h2>

  <!-- negative case: compact control with a declared equivalent alternative -->
  <section id="alternative-region" aria-label="alternative control exemption">
    <button class="compact" id="compact-button" data-target-alternative="#roomy-button" aria-label="Compact">+</button>
  </section>
</body>
</html>
