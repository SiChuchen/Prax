needs:
  - id: n1-data-surface
    product_action: 会话表排序/过滤/选中 + KPI/柱图/日志渲染
    required_experience:
      - 一屏扫读
      - 两次点击下钻
    capabilities:
      - static html/css
      - bundled json fixture
      - fetch simulation
    status: supported
    resolution:
      type: frontend_composition
      notes: 打包 fixture 驱动，前端内存排序/过滤；?forceError=1 走模拟失败路径
  - id: n2-honest-states
    product_action: 四态真实可达（loading/empty/error/selected）
    required_experience:
      - 状态诚实
    capabilities:
      - css skeleton
      - empty state
      - error banner
      - row selection
