primary_structure:
  pattern: PAT-CANVAS-WORKSPACE
  rationale:
    - The task is spatial relationship understanding on a dominant canvas; the inspector and reading key stay subordinate
    - Multi-selection impact must live in the canvas emphasis grammar itself so the operator reads union and shared impact without leaving the workspace
