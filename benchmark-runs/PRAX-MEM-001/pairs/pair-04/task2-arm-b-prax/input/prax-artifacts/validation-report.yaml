  items:
    - check_id: delta_conformance
      outcome: pass
      source: prax design_sdir apply_delta gate
      notes: sdir apply_delta gate passed referential and render-leak validation; implementation touches only the interaction read model, canvas selection wiring, primitives, Inspector, legend, CSS, tests and review doc
      artifact_refs:
