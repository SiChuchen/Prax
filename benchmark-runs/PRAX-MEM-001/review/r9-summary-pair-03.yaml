## Three-pair attribution (H4)

| pair | router | formal retrieval | bare arm | prax arm |
|---|---|---|---|---|
| 01 | exact string | failed | recurrence (amber) | recurrence (rainbow edges + violet) |
| 02 | token tiers | failed (zero-overlap vocabulary) | recurrence (amber) | **no_recurrence** (raw-file self-retrieval) |
| 03 | + purpose tier | **succeeded end-to-end** | recurrence (amber) | recurrence (lilac variant, self-passed regression) |

1. Delivery (H4's literal question): correction memory now survives session
   close, routes across vocabulary divergence, reaches the fresh session's
   compiled context and validation plan, and shapes recorded design
   decisions. Answer: YES — after two router fixes; the fixes were the
   enabling condition (pairs 01/02 prove it was not automatic).
2. Compliance (the question H4 actually cared about): retrieval alone does
   NOT guarantee rule compliance. The retrieved obligation was self-judged
   as satisfied by the violating agent. Across all three pairs, every arm
   EXPOSED to the correction produced less severe violations than its bare
   counterpart, but only pair-02 B (raw-file + no regression plan) fully
   avoided hue.
3. Open weak link: enforcement quality. The regression check is
   self-attested; its evidence evaluation accepted a screenshot the
   rubric scores as hue-coded. Next mechanism step: independent
   adjudication of correction-regression evidence (deterministic color/
   glow analysis of the submitted screenshot) before any further pairs.

decision: >-
  Close the benchmark cycle at L1_three_pair_diagnostic. H4: keep_provisional
  → partially supported (delivery confirmed; compliance partial; N=3,
  directional language only). The persistent finding across all pairs is
  enforcement, not memory. Recommended next: adversarial evidence
  adjudication for correction regressions; re-run one pair to validate.
