## Four-pair attribution (H4)

| pair | router | formal retrieval | enforcement | bare arm | prax arm |
|---|---|---|---|---|---|
| 01 | exact string | failed | self-attested | recurrence (amber) | recurrence (rainbow edges + violet) |
| 02 | token tiers | failed (zero-overlap) | self-attested | recurrence (amber) | no_recurrence (raw-file self-retrieval) |
| 03 | + purpose tier | succeeded end-to-end | self-passed misjudgment | recurrence (amber) | recurrence (lilac variant) |
| 04 | + adjudicator | succeeded (mixed, designed-first) | **adjudicated pass** | recurrence (golden) | **no_recurrence** |

1. Delivery: confirmed in every pair since the purpose tier (03, 04). The
   designed channel is now the initiating delivery path even when the agent
   also consults the raw memory file afterwards.
2. Compliance: retrieval alone never guaranteed it (pair-03); with
   deterministic evidence adjudication the treated arm produced its first
   no_recurrence through the designed channel — and removed inherited
   violations (task-1 hue bait) as a side effect of having the rule.
3. Enforcement: pair-04 is the first pair where the regression obligation
   was closed by machine-screened screenshot evidence rather than
   self-attestation. Canary-validated rules; known limitation: per-class
   coding that reuses the established palette (bare-arm golden/amber) is
   below deterministic detection by construction (compliant pair-02 shared
   LARGER amber shares than violating pair-03 A) — that half stays with
   blinded human review.

h4_final: >-
  H4 upgrades from partially supported to supported_at_L1_with_enforcement
  (N=4 pairs, single reviewer, directional language only): correction memory
  delivered through the designed channel changes fresh-session behavior
  (avoidance + inherited-violation cleanup), and with adversarial evidence
  adjudication the compliance outcome is machine-checked rather than
  self-attested. Promotion past keep_provisional and any push remain the
  user's decision.

decision: >-
  Benchmark cycle closed at four pairs. Enforcement layer merged (01f3ee1)
  and validated by canaries + one live pair. Next candidates (user decision):
  correction-memory promotion review; a second enforcement pair on a
  different surface; hardening the raw-file side channel (e.g. serving
  scoped corrections via the designed channel only).
