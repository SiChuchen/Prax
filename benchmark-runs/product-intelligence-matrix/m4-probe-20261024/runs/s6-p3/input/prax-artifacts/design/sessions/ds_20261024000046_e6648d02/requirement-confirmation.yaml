version: "0.1"
user_quote:
  - 动词：explore；对象：多维数据；成功标准：维度切换不重置认知
  - 判别：维度是主要认知负担（从单概念到无界数据），切换维度不重置认知
  - 验收种子：过滤/投影状态有归属且可回退
  - 应用在页面加载完成时即处于可用状态（初始数据随首屏就绪，不得以加载态作为可测状态）
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）
restatement: 构建一个单页 Web 应用，让用户探索（explore）一个多维数据集（dataset 为主对象）。维度是主要认知负担：用户在维度间切换（换 x/y 轴、换分面、换聚合维度）时，其认知上下文——已选中的记录、已设的过滤、已做的投影/聚焦、阅读位置——必须保持归属且不被重置。过滤/投影状态要有明确归属（可见的状态芯片/面板，指明谁在过滤什么）且可回退（可单独撤销/恢复到默认）。信息形状为 dimensional-space：无界基数、高密度、高维度、中等关系与层级、低时间性、无比较需求、无空间性。交付为可静态打开的单页应用（index.html 或 dist/），初始数据随首屏内联就绪，无加载态作为可测状态；无后端、无账号、无部署。
boundaries:
  in_scope:
    - 单页应用主屏 1 个：多维数据探索界面（维度切换 + 记录/聚合视图）
    - 维度切换机制：切换维度保留选中、过滤、投影等认知上下文
    - 过滤/投影状态有归属：可见的状态指示（哪些过滤器活跃、作用于什么范围）且可单独移除/整体回退
    - 初始数据集内联于首屏，页面加载即处于可用状态
    - 静态可打开交付物（根路径 index.html 或 dist/），本地可运行
  out_of_scope:
    - 后端服务、账号体系、持久化服务
    - 部署到任何外部服务
    - 多屏/多路由
    - 修改冻结简报中的验收标准
  scope_complete: true
