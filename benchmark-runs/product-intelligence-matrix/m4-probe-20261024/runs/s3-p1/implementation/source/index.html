<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星巡台 ASTRA · 系外行星多维探索</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <span class="brand-name">星巡台 <i>ASTRA</i></span>
      <span class="brand-sub">系外行星多维探索 · 600 条 × 10 维</span>
    </div>
    <div id="anchorBar" class="anchor-bar" role="status" aria-label="认知锁点条"></div>
  </header>

  <div id="toast" class="toast" hidden></div>

  <main id="canvas" class="canvas" aria-label="投影画布"></main>

  <aside id="dimRail" class="dim-rail" aria-label="维度轨"></aside>

  <aside class="rightcol">
    <section id="inspector" class="panel" aria-label="聚焦检查器"></section>
    <section id="records" class="panel grow" aria-label="匹配记录"></section>
    <section id="trail" class="panel trail" aria-label="状态轨迹"></section>
  </aside>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
