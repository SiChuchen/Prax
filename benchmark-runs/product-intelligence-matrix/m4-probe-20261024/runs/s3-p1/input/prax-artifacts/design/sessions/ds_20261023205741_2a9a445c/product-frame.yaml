version: "0.2"
jtbd:
  verb: explore
  target: 多维数据集
  success: 在已设定过滤与聚焦的情况下切换投影维度后，所有认知状态（过滤/聚焦/度量/轨迹）保留且可见，无静默重置
primary_object:
  type: dataset
  label: 数据集
task_model:
  frequency: high
  reversibility: reversible
  consequence: low
  expertise: mixed
user:
  primary_role: 数据分析师 / 科研人员（探索型数据使用者）
  expertise: mixed
  familiarity: high
goal:
  primary: 让用户在无界多维数据中自由切换投影维度进行探索，且每次切换不丢失既有认知：过滤、聚焦与状态轨迹跨维度切换持续有效。
tasks:
  primary: 通过切换投影维度与设定过滤条件，探索多维数据集的结构与分布
  secondary:
    - 聚焦单条记录并在维度切换中保持聚焦
    - 查看状态轨迹并回退到任一历史状态
    - 浏览/定位满足当前过滤条件的记录子集
product_objects:
  - id: dataset
    user_name: 数据集
    purpose: 被探索的多维数据总体（只读），首屏内联就绪
  - id: dimension
    user_name: 维度
    purpose: 数据集的观测轴；用户从中选取投影维度
  - id: projection
    user_name: 投影
    purpose: 当前选定的 1–2 个维度构成的切面视图（交叉分布）
  - id: filter
    user_name: 过滤器
    purpose: 裁剪数据范围的约束；有归属且可回退
  - id: record
    user_name: 记录
    purpose: 数据集内单条数据，可被聚焦并在维度切换中保持锚定
  - id: state_trail
    user_name: 状态轨迹
    purpose: 过滤/投影状态变化的时序轨迹，带归属，可回退到任一点
relationships:
  - id: rel-dim-ds
    source: dataset
    target: dimension
    type: described_by
    direction: forward
    meaning: 维度是数据集的观测轴
    condition: 始终
    importance: primary
  - id: rel-proj-dim
    source: projection
    target: dimension
    type: composed_of
    direction: forward
    meaning: 投影由选中的维度构成切面
    condition: 用户选择 1–2 个维度时
    importance: primary
  - id: rel-filt-ds
    source: filter
    target: dataset
    type: constrains
    direction: forward
    meaning: 过滤器裁剪参与投影与记录列表的数据范围
    condition: 过滤器存在时
    importance: primary
  - id: rel-proj-filt
    source: projection
    target: filter
    type: independent_of
    direction: none
    meaning: 切换投影不得影响过滤器（认知保持契约）
    condition: 切换投影维度时
    importance: primary
  - id: rel-trail-filt
    source: state_trail
    target: filter
    type: records_history_of
    direction: forward
    meaning: 每次过滤/投影变化作为轨迹条目记录，可回退
    condition: 过滤/投影变化时
    importance: primary
  - id: rel-rec-proj
    source: record
    target: projection
    type: located_in
    direction: forward
    meaning: 聚焦记录在投影中高亮定位（若落点可见）
    condition: 用户聚焦记录时
    importance: supporting
mental_model_hypothesis:
  summary: 用户把数据集理解为由多个维度定义的一个『空间』：通过选择投影维度在空间中取切面，通过过滤裁剪范围，通过聚焦锚定单条记录。工具应像一台可调焦的观测台——换镜头（切维度）不等于清空样本（过滤）或更换目标（聚焦）。
  confidence: high
  evidence:
    - user_requirement
    - domain_convention
primary_success_definition: 用户在已设定过滤与聚焦的状态下切换投影维度后：过滤条件、聚焦记录、度量选择与状态轨迹全部保留且可见（无任何静默重置）；且每次过滤/投影状态变化均记录归属（设定来源）并可一键回退。
open_questions: []
existing_product:
  stable_user_concepts: []
  stable_patterns: []
  current_user_pain_points: []
  current_constraints: []
  legacy_debt: []
