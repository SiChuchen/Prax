version: "0.1"
user_quote:
  - 动词：explore；对象：多维数据
  - 成功标准：维度切换不重置认知
  - 过滤/投影状态有归属且可回退
  - 应用在页面加载完成时即处于可用状态（初始数据随首屏就绪，不得以加载态作为可测状态）
restatement: 从零构建一个单页多维数据探索应用：以 dataset 为主对象，用户在高维数据上切换投影维度与过滤条件进行探索；切换维度时必须保留既有过滤、聚焦记录与状态轨迹（不重置认知）；每个过滤/投影状态都记录归属（由哪个操作设定）且可回退（撤销/回到轨迹点）。交付为根路径 index.html 可静态直接打开的单页应用，首屏即含内联数据、无加载态；本地运行、无后端/账号/持久化服务、不部署。
boundaries:
  in_scope:
    - 单页 Web 应用，根路径 index.html 静态直接打开
    - 多维数据集探索：投影（选维度分组/交叉）、过滤、聚焦单条记录
    - 维度切换保持过滤、聚焦、度量与状态轨迹（不重置认知）
    - 过滤与投影状态的归属标记（记录设定来源操作）与可回退（撤销/回退到轨迹点）
    - 首屏内联初始数据、页面加载完成即可用、无加载态
    - 本地运行、无外部服务依赖
  out_of_scope:
    - 后端服务、账号体系、持久化存储
    - 部署到任何外部服务
    - 多屏/多页面导航（主屏仅 1 个）
    - 移动端适配
    - 数据编辑/写入（只读探索）
  scope_complete: true
