  pattern_ref: PAT-DATA-EXPLORER
  checks:
    - id: semantic_conformance
      label: Semantic conformance
      kind: deterministic
      profile: semantic_integrity
      facet: semantic
      requirement: SDIR is valid, semantic, and aligned to the approved pattern.
      evidence_required: false
    - id: state_completeness
      label: State completeness
      kind: deterministic
      profile: state_coverage
      facet: behavioral
      requirement: Required loading, empty, ready, and error states exist.
      evidence_required: false
    - id: product_model_alignment
      label: Product model alignment
      kind: assistive
      profile: semantic_integrity
      facet: semantic
      requirement: User-facing structure and language preserve the Product Frame.
      evidence_required: true
    - id: keyboard
      label: Keyboard operability
      kind: empirical
      profile: keyboard_accessibility
      facet: behavioral
      requirement: Primary work and selection are operable with keyboard and visible focus.
      evidence_required: true
    - id: hierarchy_review
      label: Hierarchy review
      kind: assistive
      profile: semantic_integrity
      facet: visual_hierarchy
      requirement: Visual prominence follows SDIR importance rather than implementation convenience.
      evidence_required: true
    - id: representation_decided
      label: Representation decided
      kind: deterministic
      profile: semantic_integrity
      facet: semantic
      requirement: SDIR 0.2 declares representation.primary with a non-empty reason.
      evidence_required: false
    - id: state_ownership_declared
      label: State ownership declared
      kind: deterministic
      profile: semantic_integrity
      facet: semantic
      requirement: Selection and preview states both have declared owners.
      evidence_required: false
    - id: acceptance_contract_present
      label: Acceptance contract present
      kind: deterministic
      profile: semantic_integrity
      facet: semantic
      requirement: SDIR 0.2 carries at least one acceptance criterion.
      evidence_required: false
    - id: complexity_budget_declared
      label: Complexity budget declared
      kind: deterministic
      profile: semantic_integrity
      facet: semantic
      requirement: SDIR 0.2 declares a complexity_budget block (values are not judged).
      evidence_required: false
    - id: filter_state
      label: Filter state
      kind: deterministic
      profile: state_coverage
      facet: behavioral
      requirement: Active filters and result state are represented explicitly.
      evidence_required: true
    - id: comparison_scan
      label: Comparison scan
      kind: empirical
      profile: state_coverage
      facet: behavioral
      requirement: Comparable values can be scanned without opening every item.
      evidence_required: true
    - id: requirement_alignment
      label: Requirement alignment
      kind: assistive
      profile: semantic_integrity
      facet: semantic
      requirement: The delivered result matches the confirmed restatement, scope, and success definition.
      evidence_required: true
