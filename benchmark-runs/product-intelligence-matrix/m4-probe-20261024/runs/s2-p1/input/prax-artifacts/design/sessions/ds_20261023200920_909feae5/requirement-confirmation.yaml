version: "0.1"
user_quote:
  - 动词：explore；对象：多维数据；成功标准：维度切换不重置认知
  - 验收种子：过滤/投影状态有归属且可回退
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）；应用在页面加载完成时即处于可用状态（初始数据随首屏就绪）
restatement: 构建一个静态可开、首屏即用的单页 Web 应用：以 dataset 为主对象，支持对多维数据（维度性=高、基数=unbounded 的探索空间）做 explore。核心验收是『维度切换不重置认知』——用户在维度间切换投影（换轴、换聚焦维度）时，已建立的选中集、过滤条件、视图焦点等认知状态必须跨维度切换保留；且所有过滤/投影状态都有明确归属（可看见由哪次操作产生、作用于哪个维度）并可回退（单条移除 + 整体撤销/复位）。单屏交付，本地静态运行，无后端。
boundaries:
  in_scope:
    - 单屏桌面 Web 应用：多维数据集探索工作台
    - 数据集以 JS 常量内联（≥300 行 × ≥9 维：数值/类别/布尔/序数混合），首屏即就绪无加载态
    - 多投影视图共享同一状态：散点投影（任意两维为 X/Y + 颜色维）、维度画像（分箱直方图）、明细表
    - 维度切换保持认知状态：选中集、过滤、排序、聚焦对象在换维/换投影后均保留
    - 过滤/投影状态条：每条状态有归属标签（来源动作）且可单独移除，整链可撤销/重做/复位
    - 键盘可达：核心操作有快捷键
  out_of_scope:
    - 后端、账号体系、持久化服务、部署
    - 数据编辑/写回（只读探索）
    - 多主屏、移动端适配
  scope_complete: true
