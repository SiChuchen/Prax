version: "0.1"
screen:
  id: data_explorer_screen
  intent:
    primary_task: 在投影视图间切换维度（换 X/Y 轴、换画像维度、换排序维），同时保持选中/过滤/焦点不丢失
    secondary_tasks:
      - 对某维度做过滤（区间或类别子集）并从状态条移除
      - 点选记录进入选中集并在任何视图下保持高亮
      - 通过状态轨迹撤销/重做/复位状态链
  archetype:
    pattern_ref: PAT-DATA-EXPLORER
  density_intent: compact
  regions:
    - id: data
      role: collection
      importance: dominant
      visibility:
        condition: always
      behavior_intent:
        - comparison_group
        - filter_then_inspect
    - id: collection
      role: experimental:collection
      importance: primary
      visibility:
        condition: always
      behavior_intent: []
    - id: state bar
      role: experimental:state bar
      importance: primary
      visibility:
        condition: always
      behavior_intent: []
    - id: inspector
      role: experimental:inspector
      importance: primary
      visibility:
        condition: always
      behavior_intent: []
    - id: data = 投影舞台（dominant，scatter canvas，数据集行集的二维投影，探索主任务在此发生）
      role: experimental:data = 投影舞台（dominant，scatter canvas，数据集行集的二维投影，探索主任务在此发生）
      importance: supporting
      visibility:
        condition: always
      behavior_intent: []
    - id: collection = 维度轨（维度列表 + 迷你分布，把 dimensionality=high 的主要认知负担显性化）
      role: experimental:collection = 维度轨（维度列表 + 迷你分布，把 dimensionality=high 的主要认知负担显性化）
      importance: supporting
      visibility:
        condition: always
      behavior_intent: []
    - id: state bar = 状态条（过滤/投影 chips + 撤销/重做/复位，高密度常驻）
      role: experimental:state bar = 状态条（过滤/投影 chips + 撤销/重做/复位，高密度常驻）
      importance: supporting
      visibility:
        condition: always
      behavior_intent: []
    - id: inspector = 检查器（选中明细 + 状态轨迹）
      role: experimental:inspector = 检查器（选中明细 + 状态轨迹）
      importance: supporting
      visibility:
        condition: always
      behavior_intent: []
    - id: detail
      role: contextual_inspector
      importance: contextual
      visibility:
        condition: selection_driven
      behavior_intent:
        - selection_driven
  relationships:
    - id: region_rel_data_detail
      source: data
      target: detail
      type: selection_drives_contextual_detail
  interaction_intents:
    - preserve_context
    - keyboard_equivalent
  required_states:
    - loading
    - empty
    - ready
    - selected
    - error
  decision_points:
    - id: region_realization
      question: How should the platform adapter realize the semantic regions while preserving hierarchy?
      adapter_may_choose:
        - native landmarks
        - accessible composite widgets
        - responsive region arrangement
  unresolved:
    - id: dataset-theme-unspecified
      question: dataset-theme-unspecified
      impact: low
      affects:
        - dataset 主题命名与量纲
    - id: view-mix-unspecified
      question: view-mix-unspecified
      impact: low
      affects:
        - 默认投影配置
  rejected_alternatives:
    - option: React/Vite 构建产物
      reason: 引入构建链与 node_modules；根路径直开静态文件的交付约束用 vanilla 更稳
    - option: 外部图表库（D3/Plotly/Chart.js）
      reason: 自绘 canvas 即可满足散点/直方图；换维重投影逻辑简单，库反而增加静态打开与许可面
    - option: 过滤条件用模态对话框编辑
      reason: 状态归属必须常驻可见，对话框隐藏状态违背验收种子
    - option: 每视图独立过滤状态
      reason: 会造成换维重置认知，直接违背成功标准；行级共享状态是判别式要求的
