  collected_at: 2026-10-23T23:58:00Z
  items:
    - check_id: semantic_conformance
      outcome: pass
      source: prax design_sdir validate 门（本会话机检）
      notes: SDIR 0.2 在 sdir 门以 validate 模式机检 PASS（schema+语义词表+渲染级泄漏检查均通过）；archetype=PAT-DATA-EXPLORER 与 decide 一致。
      artifact_refs:
        - .prax/design/sessions/ds_20261023230931_f2258719/
        - index.html
    - check_id: state_completeness
      outcome: pass
      source: 静态源码引用（app.js 行号）
      notes: ready=加载完成即就绪（同步初始化 app.js:843-846，数据解析期构建无网络请求，无 loading 出现在可测路径）；empty=检查器空态(app.js:733-738)+零可见记录空态(app.js:534-542)；selected=选中环/芯片/画像。loading/error 为不可达态：静态本地应用无异步流程；loading 缺席正是冻结简报的硬约束（不得以加载态作为可测状态）。
      artifact_refs:
        - app.js:843
        - app.js:534
        - app.js:733
    - check_id: product_model_alignment
      outcome: pass
      source: 源码引用 + 语言映射表
      notes: Frame 的四个产品对象一一对应 UI 语言：数据集→顶栏『城市观测集』(index.html)；记录→『记录画像』面板(app.js:730-794)；维度→『维度目录』5 组 15 维(app.js:281-323)；投影→『投影轨迹』命名快照(app.js:796-813)；状态归属芯片标注所属维度(app.js:639)。
      artifact_refs:
        - index.html
        - app.js:88
        - app.js:796
    - check_id: keyboard
      outcome: inconclusive
      source: 静态源码 + 环境受阻记录（两次子代理派发失败档案）
      notes: 静态分析：全部控件为原生 button/input（可聚焦、Enter/Space 原生生效）、:focus-visible 2px 可见焦点(styles.css:43)、图表方向键+回车+Esc+Ctrl+Z/Y 已实现(app.js:571-583,825-836)。真实浏览器按键与焦点实测在本 harness 无法执行（无任何进程执行工具；browser-user 子代理无 use_browser、codex-rescue 子代理因无 Bash 拒启、hooks 快照机制不加载中途配置）——判 inconclusive，解锁后运行 node .evidence/cdp-probe.mjs 的 e/f 步即可补证。
      artifact_refs:
        - .evidence/cdp-probe.mjs
        - .evidence/README.md
        - app.js:571
    - check_id: hierarchy_review
      outcome: inconclusive
      source: styles.css 布局模板静态引用
      notes: 静态证据：dominant data 面占中栏最大区域（grid 296px/1fr/316px，chartwrap flex:1），维度目录与状态条为 primary 左右辅翼，检查器/轨迹为 supporting 右栏下部，图例 contextual。视觉 prominence 的最终确认需渲染截图——inconclusive。
      artifact_refs:
        - styles.css:98
        - styles.css:150
    - check_id: representation_decided
      outcome: pass
      source: prax design_sdir validate 门
      notes: SDIR 0.2 representation.primary=chart，reason 非空（重投影是维度性高的核心交互），sdir 门机检已核。
      artifact_refs:
        - .prax/design/sessions/ds_20261023230931_f2258719/
    - check_id: state_ownership_declared
      outcome: pass
      source: prax design_sdir validate 门 + app.js 引用
      notes: SDIR 0.2 state_ownership：selection→data、query→dimension_catalog、viewport→trail、inspector→inspector；与实现一致（app.js:169-236 单一状态树）。
      artifact_refs:
        - .prax/design/sessions/ds_20261023230931_f2258719/
    - check_id: acceptance_contract_present
      outcome: pass
      source: prax design_sdir validate 门
      notes: SDIR 0.2 携带 5 条 acceptance（维度切换上下文保持 / 过滤归属 / 首屏就绪 / AA 底线 / 静态可开），与冻结简报逐条对齐。
      artifact_refs:
        - index.html
    - check_id: complexity_budget_declared
      outcome: pass
      source: prax design_sdir validate 门
      notes: SDIR 0.2 complexity_budget 已声明：3 常驻面板/4 主操作/0 模式/4 状态属主/1 导航层级/15 持久过滤器/3 新概念/2 键盘契约/0 移动冲突/4 常驻表面。
      artifact_refs:
        - .prax/design/sessions/ds_20261023230931_f2258719/
    - check_id: filter_state
      outcome: pass
      source: 静态源码引用（app.js 行号）
      notes: 活动过滤器显式呈现：状态条逐条芯片且 owner 标注所属维度(app.js:639)，条件值实时更新；维度行过滤指示点+高亮(app.js:370-371)；图例含各类保留计数(app.js:686-699)；结果状态以『可见 n / 240』显式表达(app.js:661)。
      artifact_refs:
        - app.js:631
        - app.js:639
        - app.js:366
    - check_id: comparison_scan
      outcome: inconclusive
      source: 静态源码引用 + 环境受阻记录
      notes: 扫描能力静态存在：『可见记录表』平铺全部可见记录的 X/Y/颜色值(app.js:707-729)、维度目录行内展示各维全量范围(app.js:315-320)、悬停 tooltip。无需打开每条记录即可扫值；但『可扫读』的最终判定属经验性的视觉/交互行为，真实浏览器核验受阻——inconclusive，探针 c/d 步解锁后可补证。
      artifact_refs:
        - app.js:707
        - app.js:315
    - check_id: destructive_recovery
      outcome: pass
      source: 静态源码引用（app.js 行号）
      notes: 所有破坏性操作（移除过滤/清除选择/取消选中/重置视图）全部先入快照栈且可撤销：reset 本身也 push『重置视图』快照(app.js:820-824)；撤销/重做/轨迹点击三级恢复(app.js:204-212)；芯片 × 标注『可撤销』(app.js:645)。错误成本=low 匹配。
      artifact_refs:
        - app.js:188
        - app.js:820
    - check_id: requirement_alignment
      outcome: pass
      source: 交付物与冻结简报逐条比对
      notes: 对照确认的 restatement：单页静态应用（根路径 index.html，零构建零依赖，file:// 直开）✓；explore×dimensional-space 主屏 1 个 ✓；首屏内联数据同步就绪（确定性种子生成器，无加载流程）✓；维度切换不重置认知（selection/filters/轨迹跨投影保持，choice-preserve-context）✓；过滤/投影状态有归属且可回退（owner 芯片+命名快照栈+轨迹回退）✓；无后端/账号/持久化/部署 ✓。
      artifact_refs:
        - index.html
        - styles.css
        - app.js
        - README.md
