version: "0.1"
user_quote:
  - 动词：explore；对象：多维数据；成功标准：维度切换不重置认知
  - 验收种子：过滤/投影状态有归属且可回退
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）；页面加载完成时即处于可用状态（初始数据随首屏就绪）
  - 规模上限：单页应用，主屏 1 个；不要求后端、账号体系或持久化服务
restatement: 从零构建一个单页多维数据探索应用：用户在同一个界面上对高维数据集做投影探索（切换 X/Y/颜色编码维度）、筛选，核心成功标准是维度切换时不重置用户的认知（选择、过滤、轨迹等上下文跨维度切换保持）；过滤/投影状态必须显式归属到维度并可回退（撤销/回到之前的投影）。数据在首屏内联就绪、无加载态；纯静态、本地可运行、单主屏。
boundaries:
  in_scope:
    - 单页 Web 应用（静态打开，根路径 index.html）
    - 多维数据集探索主屏 1 个：投影（轴/编码维度切换）、过滤、对象详情
    - 过滤/投影状态归属展示与回退（撤销/历史轨迹）
    - 首屏内联数据、无加载态、无外部服务
    - WCAG 2.2 AA 可达性底线（H-23）
  out_of_scope:
    - 后端、账号体系、持久化服务
    - 部署到外部服务
    - 多屏/移动端适配
    - 真实在线数据源接入
  scope_complete: true
