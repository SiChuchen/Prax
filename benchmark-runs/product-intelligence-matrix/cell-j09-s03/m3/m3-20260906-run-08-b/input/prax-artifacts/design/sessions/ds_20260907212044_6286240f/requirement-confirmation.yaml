version: "0.1"
user_quote:
  - 动词：decide / 对象：位置敏感的选项 / 成功标准：决策输入同屏可得
  - 少量高密度条目并排比较，比较本身是任务、比较状态必须驻留同屏
  - 地理语境与决策项同屏
restatement: 构建一个单页静态 Web 应用：用户需在 3–4 个位置敏感的候选选项（如候选门店/场地/居所地点）之间做出决策。界面以高密度并排比较面板为主对象，每个候选地点的地理语境（相对位置、通勤/交通要素）与决策项数据同屏驻留；比较本身即任务，支持按权重评估并得出选择。初始数据内联、加载即用、无外部服务。
boundaries:
  in_scope:
    - 单页静态 Web 应用（根路径 index.html，可直接打开）
    - 少量（3–4 个）位置敏感候选地的并排高密度比较面板
    - 地理语境（示意地图：候选点、通勤锚点、地铁/道路参照物）与决策项同屏驻留
    - 多准则加权评分支持 decide（权重可调，实时重算各候选契合分）
    - 比较状态（选中列、逐行最优高亮、最终结论）驻留同屏
    - 首屏加载即含内联数据、无加载态
  out_of_scope:
    - 后端、账号体系、持久化服务
    - 外部地图/数据服务调用（须本地静态可运行）
    - 多屏导航（主屏 1 个）
    - 部署到外部服务
  scope_complete: true
