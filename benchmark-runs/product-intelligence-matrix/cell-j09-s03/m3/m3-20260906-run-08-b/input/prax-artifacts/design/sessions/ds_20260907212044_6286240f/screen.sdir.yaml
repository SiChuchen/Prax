version: "0.2"
screen:
  id: data_explorer_screen
  intent:
    primary_task: 在 3 个候选铺位间并排比较全部指标，结合地理语境确定最优选址
    secondary_tasks:
      - 调整决策权重观察契合分与排名变化
      - 对比各候选相对通勤锚点与竞品分布的位置关系
      - 锁定最终选择并读出结论摘要
  archetype:
    pattern_ref: PAT-DATA-EXPLORER
  density_intent: compact
  regions:
    - id: data
      role: collection
      importance: dominant
      visibility:
        condition: always
      behavior_intent:
        - comparison_group
        - filter_then_inspect
    - id: "data comparison matrix main surface: one column per candidate × one row per criterion side-by-side comparison (best-in-row highlight)"
      role: "experimental:data comparison matrix main surface: one column per candidate × one row per criterion side-by-side comparison (best-in-row highlight)"
      importance: primary
      visibility:
        condition: always
      behavior_intent: []
    - id: map business district geographic context schematic (co-resident on screen with the main surface)
      role: experimental:map business district geographic context schematic (co-resident on screen with the main surface)
      importance: primary
      visibility:
        condition: always
      behavior_intent: []
    - id: form decision weight control column
      role: experimental:form decision weight control column
      importance: supporting
      visibility:
        condition: always
      behavior_intent: []
    - id: verdict decision conclusion bar (persistent)
      role: experimental:verdict decision conclusion bar (persistent)
      importance: supporting
      visibility:
        condition: always
      behavior_intent: []
    - id: candidate basic profile and one-sentence commentary
      role: experimental:candidate basic profile and one-sentence commentary
      importance: supporting
      visibility:
        condition: always
      behavior_intent: []
    - id: detail
      role: contextual_inspector
      importance: contextual
      visibility:
        condition: selection_driven
      behavior_intent:
        - selection_driven
  relationships:
    - id: region_rel_data_detail
      source: data
      target: detail
      type: selection_drives_contextual_detail
  interaction_intents:
    - preserve_context
    - keyboard_equivalent
  required_states:
    - loading
    - empty
    - ready
    - selected
    - error
  decision_points:
    - id: region_realization
      question: How should the platform adapter realize the semantic regions while preserving hierarchy?
      adapter_may_choose:
        - native landmarks
        - accessible composite widgets
        - responsive region arrangement
  unresolved: []
  rejected_alternatives:
    - option: PAT-CANVAS-WORKSPACE
      reason: 适用于关系网络主导（spatiality 高）的场景；本格比较以行列对齐为主，画布会稀释 required 的并排比较
    - option: PAT-LIST-DETAIL
      reason: 选中即聚焦单项，遮蔽其余候选列，破坏「比较状态必须驻留同屏」
    - option: 卡片网格（cards）
      reason: 命中 PAT-DATA-EXPLORER 反模式 card-grid-for-dense-comparison：字段不对齐，逐项比较需记忆
  user_job:
    verb: decide
    target: 位置敏感的选项（候选铺位）
    success: 决策输入同屏可得
  primary_object:
    type: location
    label: 候选铺位（location）
  information_shape:
    cardinality: few
    relationality: medium
    hierarchy: low
    temporality: low
    density: high
    dimensionality: medium
    spatiality: none
    volatility: medium
    uncertainty: low
    comparison_need: required
  representation:
    primary:
      type: table
      reason: few 条目高密度、字段共享、逐项最优需一眼可辨：表格列对齐让比较零记忆负担
    supporting:
      - type: map
        reason: 验收种子「地理语境与决策项同屏」：自绘 SVG 示意商圈图常驻，候选点/通勤锚点/地铁/竞品同屏参照（product_object geo_context）
      - type: form
        reason: 决策权重滑杆（product_object criteria_weights）是 decide 的操作面，实时驱动契合分
  priority:
    primary:
      - data
      - "data comparison matrix main surface: one column per candidate × one row per criterion side-by-side comparison (best-in-row highlight)"
      - map business district geographic context schematic (co-resident on screen with the main surface)
    contextual:
      - form decision weight control column
      - verdict decision conclusion bar (persistent)
      - candidate basic profile and one-sentence commentary
      - detail
  interaction:
    preview: none
    inspect: select
    navigate: none
    locate: none
  state_ownership:
    - state: selection
      owner: data
    - state: preview
      owner: session
  complexity_budget:
    permanent_panels: 3
    permanent_primary_actions: 2
    modes: 0
    state_owners: 2
    navigation_levels: 1
    persistent_filters: 0
    new_semantic_concepts: 2
    keyboard_contracts: 1
    mobile_conflicts: 0
    permanent_surfaces: 1
  acceptance:
    - 页面加载完成即同屏呈现 3 个候选铺位的完整指标列、商圈地理语境图与加权契合分；决策者不离开主屏即可调整权重、锁定选择并读出结论。
