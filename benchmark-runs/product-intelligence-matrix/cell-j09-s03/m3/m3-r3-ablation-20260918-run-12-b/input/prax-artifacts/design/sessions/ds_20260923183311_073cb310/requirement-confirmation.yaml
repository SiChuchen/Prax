version: "0.1"
user_quote:
  - 动词：decide；对象：位置敏感的选项；成功标准：决策输入同屏可得
  - 验收种子：地理语境与决策项同屏
  - 少量高密度条目并排比较，比较本身是任务、比较状态必须驻留同屏
  - 应用在页面加载完成时即处于可用状态（初始数据随首屏就绪，不得以加载态作为可测状态）
restatement: 构建一个单页静态 Web 应用：用户要在少数（few，3–5 个）位置敏感的候选地点之间做一次性选择决策（decide）。应用必须在同一屏内同时呈现地理语境（各候选的空间位置关系）与高密度比较面板（少量候选 × 多维度属性并排对齐比较），比较本身就是任务，比较状态与决策输入必须驻留同屏；支持调整偏好权重并落定最终选择。初始数据随首屏内联就绪，加载完成即可用，纯本地静态运行，不部署。
boundaries:
  in_scope:
    - 单一主屏：3–5 个位置敏感候选（地点）并排高密度比较面板
    - 内联自绘 SVG 地图作为地理语境，与比较面板同屏驻留（验收种子：地理语境与决策项同屏）
    - 决策辅助：可调权重评分、逐行优劣高亮、最终选择（decide）状态驻留同屏
    - 候选条目高密度属性（价格/通勤/噪音/配套等）对齐行比较
    - 初始数据内联于首屏，页面加载完成即可用，无加载态
    - 纯静态本地交付：根路径 index.html 可直接打开，无后端、无外部服务、不部署
  out_of_scope:
    - 后端服务、账号体系、持久化存储
    - 外部地图瓦片/地理编码 API（网络依赖）
    - 多页面导航、移动端适配
    - 真实地理数据接入与实时数据更新
    - 修改冻结验收标准
  scope_complete: true
