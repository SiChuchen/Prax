version: "0.1"
user_quote:
  - 动词：monitor；对象：易变指标；成功标准：异常在扫视内发现
  - 判别：高时间性高密度的易变数据流，异常要在扫视内可见且变化可追溯。
  - 验收种子：指标变化可追溯，无闪烁噪声
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）；应用在页面加载完成时即处于可用状态
restatement: 构建一个单页 Web 应用：监控大量高易变性的指标流。首屏即以高密度展示众多指标（含当前值、近期走势、状态），异常指标在扫视（一眼）内即可被察觉；每一次指标变化都可追溯（可查看变化历史/事件序列）；数据更新采用原位、低噪声方式呈现，无闪烁与布局跳动。页面加载完成即处于可用状态（初始数据内联于首屏），纯静态、本地运行、无后端。
boundaries:
  in_scope:
    - 单屏高密度指标监控墙：众多指标（many）各自展示当前值、变化量、近期迷你走势与正常/警告/严重状态
    - 本地模拟的易变指标流：页面加载后持续推送更新，时间性显性呈现
    - 异常在扫视内可见：状态色彩编码 + 异常榜单/置顶，无需逐格扫描
    - 变化可追溯：每个指标可下钻查看带时间戳的取值/状态变化历史，全屏亦有事件流
    - 无闪烁噪声：原位更新数值、固定网格位置、变化仅短暂高亮，不整屏重绘、不重排
    - 静态交付：根路径 index.html 直接打开，初始数据内联，无外部服务依赖
  out_of_scope:
    - 后端服务、账号体系、持久化存储
    - 部署到任何外部服务
    - 多屏/多页面信息架构
    - 对外告警通道（邮件/IM 推送等）
    - 历史数据的长期存储与跨会话恢复
  scope_complete: true
