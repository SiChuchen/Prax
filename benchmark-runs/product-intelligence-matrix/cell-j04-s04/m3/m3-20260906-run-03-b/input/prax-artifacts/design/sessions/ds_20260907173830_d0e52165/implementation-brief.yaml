version: "0.1"
platform_profile: WEB-DESKTOP
framework: react
measurement_target:
  app_root: .
  entry: /index.html
  scenario: 打开页面即见 48 指标状态瓷片墙（含已有历史与预置异常）→ 数秒内某指标越阈变为 warn/crit，瓷片置顶并持续显示异常色（扫视内发现）→ 点击该瓷片，检查器显示完整历史折线、阈值线与越阈事件的精确时刻和前后值（变化可追溯）→ 全程布局零位移、数字无跳动（无闪烁噪声）
sdir_ref: screen.sdir.yaml
decision_ref: design-decisions.yaml
approved_patterns:
  - PAT-LIST-DETAIL-INSPECTOR
approved_component_contracts:
  - WORKSPACE
  - STATE-FEEDBACK
states_required:
  - loading
  - empty
  - ready
  - selected
  - error
capability_gaps:
  - id: N6
    product_action: 刷新/重开后保留历史与事件
    required_experience:
      - 跨会话持久化
    capabilities: []
    status: gap
    resolution:
      type: explicit_compromise
      notes: 简报明确不要求持久化服务；流为本地模拟，历史仅存于会话内存，属显式妥协并如实记录
validation_plan_ref:
  artifact: validation-plan.yaml
  revision: 1
validation_requirements:
  - semantic_conformance
  - state_completeness
  - product_model_alignment
  - keyboard
  - hierarchy_review
  - representation_decided
  - state_ownership_declared
  - acceptance_contract_present
  - complexity_budget_declared
  - requirement_alignment
realization:
  mode: direct_code
