version: "0.1"
user_quote:
  - 动词：explore；对象：多维数据；成功标准：维度切换不重置认知
  - 验收种子：过滤/投影状态有归属且可回退
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）
restatement: 构建一个单页 Web 应用：用户面对一个无界/高维的数据集，主任务是 explore——通过切换投影维度（按哪个维度聚合、下钻层级）来理解数据。核心成功标准是『维度切换不重置认知』：换维度时保留过滤器、度量选择、排序、选中/锚定等上下文。验收种子要求『过滤/投影状态有归属且可回退』：每个过滤/投影状态可追溯到来源（哪个维度面板/操作产生），且可逐条撤销或整体回退。交付为静态可开的单页应用，初始数据内联首屏即用。
boundaries:
  in_scope:
    - 单页 Web 应用：多维数据集的探索/投影/过滤工作台（单主屏）
    - 维度切换（换行维度/列维度/下钻层级）时保留过滤、度量、排序、锚定选择等认知上下文，并可视化提示保留了什么
    - 过滤与投影操作全部记入带来源归属（origin）的状态轨迹，支持单条撤销（点击轨迹回滚）与全局重置
    - 确定性种子生成的内置多维数据集（约 2000+ 事实行），随首屏内联就绪，无加载态
    - 静态可开：根路径 index.html，无外部服务、无网络依赖
  out_of_scope:
    - 后端服务、账号体系、持久化存储、多用户协作
    - 地图/地理空间编码（shape 束 spatiality=none）
    - 图表对比视图（comparison_need=none）
    - 数据编辑/写入、导入导出
    - 移动端布局（web desktop 单形态）
  scope_complete: true
