    holds: true
    basis: Spacious low-density styling (type scale, spacing rhythm, danger-state treatment for irreversible steps) is straightforwardly expressed in hand-authored CSS with design tokens; no visual exploration uncertainty warranting a design-tool round-trip
  - id: small_modification
    holds: true
    basis: One main screen, five regions, one flow; scope is a single static page, well under small-modification thresholds
  - id: mature_design_system
    holds: true
    basis: Single-screen product needs no external design system; a small self-contained token set (color, spacing, type) authored in CSS custom properties provides the system maturity the screen requires
