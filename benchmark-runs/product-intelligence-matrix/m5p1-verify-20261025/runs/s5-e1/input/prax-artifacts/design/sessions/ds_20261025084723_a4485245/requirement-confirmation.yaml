version: "0.1"
user_quote:
  - 动词：explore；对象：多维数据；成功标准：维度切换不重置认知
  - 判别：维度是主要认知负担（从单概念到无界数据），切换维度不重置认知。
  - 验收种子（acceptance seed）：过滤/投影状态有归属且可回退
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）；应用在页面加载完成时即处于可用状态
restatement: 构建一个单页 Web 应用，让用户对一份多维数据集（dataset）做 explore：用户可以沿多个维度（facet/属性）切换视角、筛选与投影（选择显示哪些维度/切片），且切换维度或调整过滤时，用户的既有认知上下文（已选集合、过滤状态、标注位置）不丢失、不重置；所有过滤/投影状态必须可见可归属（谁在起作用、作用在哪），并且可回退（逐步撤销/恢复到先前状态）。首屏随页面加载即带完整初始数据可用，纯前端静态交付，无后端。
boundaries:
  in_scope:
    - 单页应用，主屏 1 个（多维数据集探索主屏）
    - 多维度切换（维度作为一等公民，切换不重置其余状态）
    - 过滤/投影状态有显式归属展示（当前生效的过滤/投影条目可见）
    - 过滤/投影状态可回退（撤销/历史回退）
    - 初始数据内联于首屏，页面加载即可用，无 loading 态作为可测状态
    - 纯静态本地运行（index.html 或 dist/），不部署
  out_of_scope:
    - 后端服务、账号体系、持久化服务
    - 多屏/多路由应用
    - 外部服务调用或在线部署
    - 真实外部数据接入（使用内联合成数据集）
  scope_complete: true
