plan_revision: 1
evidence:
  submitted_by: Claude（实现臂，SiChuchen 代理执行）
  collected_at: 2026-10-25T09:28:00Z
  items:
    - check_id: keyboard
      outcome: pass
      source: prax-measure run 9cd4a405 实测 receipt + 实现 app.js
      notes: prax-measure run 9cd4a405 实测 a11y.focus_order 双视口 pass：21 个键盘焦点停靠点顺序遍历、0 倒置、0 缺失可见焦点指示。键盘契约实现于 app.js：Ctrl+Z 撤销、Ctrl+Shift+Z / Ctrl+Y 重做、Esc 取消选中、『/』聚焦搜索。
      artifact_refs:
        - validation-evidence/9cd4a405-c04c-465a-a688-8ec30f12d308/viewport-0/a11y.focus_order/focus-order-1280x860.png
        - validation-evidence/9cd4a405-c04c-465a-a688-8ec30f12d308/viewport-1/a11y.focus_order/focus-order-1440x900.png
        - app.js
      measurement_receipt: validation-evidence/receipt-2026-10-25T09-17-42-802Z-5e7abe25-b88e-4387-86c1-156258bafe97.json
    - check_id: product_model_alignment
      outcome: pass
      source: prax-measure 浏览器截图 + 实现文件
      notes: 真实浏览器截图（prax-measure run 9cd4a405，双视口）显示 UI 逐一保留 Product Frame 对象与语言：dataset（数据集名 + 『作用于 · 产品发布运营数据集』归属徽标）、dimension（左栏『维度 14』面板 + 观察轴）、record（数据表行 + 条目详情检查器）、lens（『生效视角』chips，单一状态所有者）、revision（『变更轨迹』时间线，含操作/目标/时间）。四条 primary 关系（described_by/contains/applies_to/trails）均有着落。
      artifact_refs:
        - validation-evidence/9cd4a405-c04c-465a-a688-8ec30f12d308/viewport-0/type.min_projected_size/min-projected-size-1280x860.png
        - app.js
        - index.html
    - check_id: hierarchy_review
      outcome: pass
      source: prax-measure 截图 + layout 实测
      notes: 视觉位阶与 SDIR importance 一致：data 区域 dominant（中央 flex:1 最大面积，480 行表格首屏可见）；lens-bar 顶部常驻；dimension-panel/inspector/trail 次级侧栏；overview contextual 于头部统计。layout.overflow 与 responsive_collision 实测 0（两视口），无实现便利压倒层级。
      artifact_refs:
        - validation-evidence/9cd4a405-c04c-465a-a688-8ec30f12d308/viewport-0/type.min_projected_size/min-projected-size-1280x860.png
        - styles.css
        - app.js
    - check_id: filter_state
      outcome: pass
      source: 实现 + 浏览器初始态截图
      notes: 生效过滤/结果状态显式呈现：lens-bar chips（类型着色，每条含作用对象与 × 逐条移除）；双重匹配计数（overview + lens-bar 『匹配 n/480』+ data-matched 属性）；维度面板 per-dim 徽标 + 分面计数条；零匹配 empty 态（清除全部过滤按钮）。归属可溯源：chip tooltip 由 revisions 反查引入步骤（#序号 + 时间）。
      artifact_refs:
        - app.js
        - validation-evidence/9cd4a405-c04c-465a-a688-8ec30f12d308/viewport-0/type.min_projected_size/min-projected-size-1280x860.png
    - check_id: comparison_scan
      outcome: pass
      source: prax-measure 截图 + 实现
      notes: 无需打开条目即可扫描比较值：投影表格列对齐（条目/产品线/平台/状态/优先级/MRR/健康分），表头点击循环排序（升→降→无，记入轨迹），数值列右对齐 tabular-nums，状态/优先级/健康分色彩编码，480 行整屏滚动可扫描；观察轴维度值分布迷你条形提供聚合比较。
      artifact_refs:
        - validation-evidence/9cd4a405-c04c-465a-a688-8ec30f12d308/viewport-0/type.min_projected_size/min-projected-size-1280x860.png
        - app.js
    - check_id: requirement_alignment
      outcome: pass
      source: 实现 + prax-measure 实测
      notes: 对照确认重述逐项：(1) explore 多维数据——14 维度 × 480 条内联 dataset；(2) 维度切换不重置认知——focus 切换仅提交 focus 变更（mc-dimension-switch-is-lens），selection 归 data 区域跨切换/撤销持久，chips 与轨迹不受影响；(3) 过滤/投影状态有归属且可回退——『作用于·数据集』归属 + 单一 lens 所有者 + revision 时间旅行（undo/redo/轨迹任意步跳转/chip 逐条移除/reset，均记入轨迹且可再撤销）；(4) 首屏 ready——boot() 同步渲染，loading 按设计不可达，prax-measure 于 http://127.0.0.1:8451/ 实测两视口初始即完整可用。已知非阻塞项：type.min_projected_size warning（次级文本 10-11.5px），SDIR 已声明 density_intent=compact，符合 suggested_fixes 密度意图豁免路径。
      artifact_refs:
        - app.js
        - index.html
        - data.js
        - validation-evidence/receipt-2026-10-25T09-17-42-802Z-5e7abe25-b88e-4387-86c1-156258bafe97.json
