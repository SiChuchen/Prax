version: "0.1"
platform_profile: WEB-DESKTOP
framework: react
measurement_target:
  app_root: .
  entry: /index.html
  scenario: 零失误走完生产发布流程：按序完成 10 步；不可逆步骤经三重确认关卡执行，并在恢复窗口内可撤销；越序操作被顺序守卫拦截并计数
sdir_ref: screen.sdir.yaml
decision_ref: design-decisions.yaml
approved_patterns:
  - PAT-LIST-DETAIL
approved_component_contracts:
  - WORKSPACE
  - STATE-FEEDBACK
states_required:
  - loading
  - empty
  - ready
  - selected
  - error
capability_gaps:
  - id: n-cross-session-persistence
    product_action: 审计记录跨会话持久化
    required_experience:
      - 关闭页面后仍可回查历史发布审计
    capabilities: []
    status: gap
    resolution:
      type: explicit_compromise
      notes: 交付约束明确不要求持久化服务：审计为会话内留痕，跨会话持久超出本格范围；如需可由后续后端能力补齐
  - id: n-real-execution
    product_action: 真实触发构建流水线 / 切换生产流量
    required_experience:
      - 操作产生真实线上效果
    capabilities: []
    status: gap
    resolution:
      type: explicit_compromise
      notes: 对接真实生产系统在简报 out_of_scope：构建/切流以模拟执行（短延时+结果固定）呈现，界面语义与真实流程一致
validation_plan_ref:
  artifact: validation-plan.yaml
  revision: 1
validation_requirements:
  - semantic_conformance
  - state_completeness
  - product_model_alignment
  - keyboard
  - hierarchy_review
  - representation_decided
  - state_ownership_declared
  - acceptance_contract_present
  - complexity_budget_declared
  - destructive_recovery
  - requirement_alignment
representation_portfolio_ref: compiled-context.yaml#representation_portfolio
state_ownership_ref: compiled-context.yaml#state_ownership
acceptance_ref: compiled-context.yaml#acceptance
realization:
  mode: direct_code
