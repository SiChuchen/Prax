representation:
  primary:
    type: list
    reason: 严格有序的步骤集合，顺序即信息主干；列表天然承载顺序守卫与状态芯片
  supporting:
    - type: form
      reason: 核对类步骤内嵌勾选/输入确认，是步骤卡的就地形态而非独立屏
    - type: feed
      reason: 审计事件按时间倒序追加，支撑零失误核验与事后回查
  rejected:
    - option: wizard
      reason: 一次一步遮蔽全程结构，与零失误全程可见冲突
    - option: graph/diagram
      reason: 空间性 none，流程为纯线性，无拓扑可画
  justification_vs_shape: 基数 one + 层级高 → 阶段分组的单一有序列表最直接映射流程结构；密度低 → 每步一张 spacious 卡片；易变性/不确定性中 → 步骤状态机（锁定/就绪/执行中/恢复窗口/已完成）由列表行内状态芯片表达；比较 none → 不设任何对照视图
primary_structure:
  pattern: PAT-LIST-DETAIL
  rationale:
    - 路由返回且已检视至 L2：契约 explicitly applies_when collection order matters——发布步骤严格有序，列表即主对象；当前可执行步骤即选中项，其详情与主控制在同屏相邻区域展开
    - 采用顺序守卫变体：列表行状态机（锁定/就绪/执行中/恢复窗口/已完成）由守卫驱动，与『collection order matters』的列表语义一致
    - 应用外壳只保留稳定页头（流程元信息+总进度+重置），不建多区导航：PAT-APPLICATION-SHELL 契约 does_not_apply_when the product is a single workspace，故仅取其『稳定全局结构』之轻量子集
    - 审计日志以上下文检视器形态常驻右栏（对齐 PAT-LIST-DETAIL-INSPECTOR 的检视器子结构）：满足高后果流程留痕诉求，又不打断按序执行主线
    - 确认关卡以模态承载而非常驻区域：低密度要求下避免永久面板膨胀，模态形成『强制停留』的确认仪式感
  confidence: high
information_hierarchy:
  primary:
    - 当前可执行步骤卡及其唯一主控制
    - 不可逆步骤的警示、确认关卡与恢复窗口状态
  secondary:
    - 阶段进度导航（左栏）
    - 审计日志与零失误拦截计数（右栏）
    - 总进度与流程元信息（页头）
density:
  intent: spacious
  strategy:
    - 每屏只呈现一张流程的步骤卡，留白充分，控制目标大而明确
    - 不可逆步骤用色与图标双通道警示（琥珀/红 + ⚠），不靠文字密度堆叠
    - 审计日志右栏窄栏呈现，倒序追加，不与主任务争宽度
  avoid:
    - 表格化密集陈列步骤参数
    - 为模拟数据增加时间轴/日历类时间性表达
    - 装饰性动效分散对确认关卡的注意力
major_choices:
  - id: mc-scenario
    choice: 具体场景取『生产环境发布（订单服务 v2.7.0）』：4 阶段 10 步，其中 3 步为不可逆操作
    rationale: 发布是开发者受众最熟悉的高后果流程，天然具备『冻结写入/切流量/解除冻结』这类不可逆步骤与回滚预案，直接满足验收种子（不可逆步骤有恢复/确认路径）
    confidence: medium
    references:
      - release_flow
      - step
  - id: mc-confirm-gate
    choice: 不可逆步骤确认关卡 = 后果说明 + 必勾理解项×2 + 输入变更单号（type-to-confirm）三重门，确认按钮在前两项未满足时禁用
    rationale: 验收种子要求不可逆步骤有确认路径；输入式确认把『知道在操作什么』变为显式动作，而非顺手点掉；同时保证状态可见性
    confidence: medium
    references:
      - step
  - id: mc-recovery
    choice: 双层恢复路径：执行后恢复窗口（倒计时内一键撤销，恢复到执行前）+ 终态后回滚预案（在确认弹窗与步骤详情中始终可查）
    rationale: 『恢复』必须在误操作刚发生时（可逆窗口）与落定后（预案）都存在，才算完整的恢复路径
    confidence: medium
    references:
      - step
  - id: mc-zero-mistake
    choice: 零失误计量：顺序违规尝试被守卫拦截并计数，完成态按拦截数给出『零失误』或『N 次风险操作被拦截』结论
    rationale: 用户任务 success = 零失误走完全程；只有把『失误』定义为可观察事件（守卫拦截）才能在界面上兑现这一成功标准
    confidence: medium
    references:
      - audit_entry
      - release_flow
  - id: mc-all-visible
    choice: 全部步骤单屏可见、当前步骤高亮（而非一次只显示一步）
    rationale: 基数 one、层级高：整体阶段结构与剩余风险应始终在视野内；顺序守卫（锁定后续步骤）已防止误操作，无需靠隐藏步骤
    confidence: medium
    references:
      - release_flow
      - step
rejected:
  - option: wizard（一次只显示一步）
    reason: 隐藏整体进度与剩余风险，与『零失误全程可控』冲突；且基数 one、步骤仅 10 步，单屏可全部呈现
  - option: PAT-CANVAS-WORKSPACE 流程图画布
    reason: 空间性 none、关系性 low，画布把注意力引向拓扑而非顺序执行；已被路由排除
  - option: PAT-RESOURCE-MANAGEMENT 多流程管理台
    reason: 基数 one，不管理流程集合；已被路由排除
  - option: 深色控制台主题
    reason: 高后果流程以可读性与警示对比为先，浅色高对比更稳；预留足够对比度满足 WCAG AA（H-23）
