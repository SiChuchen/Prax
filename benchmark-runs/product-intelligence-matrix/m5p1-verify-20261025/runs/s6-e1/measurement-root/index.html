<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发布指挥台 · 生产发布零失误护航</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
      <path d="M12 2l8 3.2v5.6c0 5-3.4 9.4-8 11.2-4.6-1.8-8-6.2-8-11.2V5.2L12 2z"
            fill="#2b5fd9"/>
      <path d="M8.2 12.1l2.6 2.6 5-5.2" stroke="#fff" stroke-width="2.1"
            fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="brand-text">
      <h1>发布指挥台</h1>
      <p>高后果流程 · 零失误护航</p>
    </div>
  </div>

  <div class="flow-meta">
    <div class="flow-title">
      <span class="flow-name">生产环境发布 · 订单服务 v2.7.0</span>
      <span class="ticket">CHG-2417</span>
    </div>
    <div class="progress-row">
      <span class="progress-text" id="progress-text">0 / 10 步</span>
      <div class="progress-bar" role="progressbar" aria-label="流程总进度"
           aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="elapsed" id="elapsed">00:00</span>
    </div>
  </div>
</header>

<main class="layout">

  <section class="step-area" aria-label="发布步骤">
    <nav class="phase-rail" aria-label="阶段进度导航">
      <div id="phase-nav" class="phase-nav"></div>
    </nav>
    <div id="summary-slot"></div>
    <ol id="step-list" class="step-list"></ol>
  </section>

  <aside class="side-rail" aria-label="零失误状态与审计日志">
    <div class="zero-panel" id="zero-panel">
      <div class="zero-num" id="intercept-count">0</div>
      <div class="zero-label">风险操作拦截</div>
      <div class="zero-hint" id="zero-hint">顺序守卫与确认关卡运行中</div>
    </div>
    <div class="audit-panel">
      <h2>审计日志</h2>
      <ul id="audit-feed" class="audit-feed" aria-live="polite"></ul>
    </div>
    <button type="button" id="reset-btn" class="btn ghost reset-btn">重置演练</button>
  </aside>

</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="app.js"></script>
</body>
</html>
