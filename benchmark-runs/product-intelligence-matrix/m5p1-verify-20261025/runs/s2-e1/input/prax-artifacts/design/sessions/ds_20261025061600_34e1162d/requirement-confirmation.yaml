version: "0.1"
user_quote:
  - 动词：explore / 对象：多维数据 / 成功标准：维度切换不重置认知
  - 验收种子：过滤/投影状态有归属且可回退
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）
restatement: "Build a single-page web app for exploring multidimensional datasets: the user projects/filters a high-dimensional dataset along chosen dimensions, and switching between dimensions (projections) must preserve the user's cognitive context — active filters, selection, and projection state must be visible, attributed (owned/labeled), and revertible (undoable), never silently reset."
boundaries:
  in_scope:
    - Single static SPA (index.html at root or dist/) that loads ready-to-use with inlined initial data
    - One main screen for exploring a high-dimensional dataset
    - Dimension (projection) switching that preserves filter/selection cognition across switches
    - Filter/projection state visibly attributed per dimension and individually revertible (undo/remove chips, history)
    - Local, no backend, no accounts, no persistence service, no external deployment
  out_of_scope:
    - Backend services, accounts, persistence, deployment
    - Comparison tooling (comparison_need = none)
    - Temporal/timeline views (temporality low)
    - Mobile layout (web desktop only)
  scope_complete: true
