version: "0.1"
realization_mode: direct_code
conditions:
  - id: defect_fix_fit
    holds: true
    basis: Session is greenfield product construction, not a defect fix; direct code carries no defect-fix risk here.
  - id: visual_polish_fit
    holds: true
    basis: The surface is a compact professional data workbench (table + SVG chart + chips); its visual targets are achievable deterministically in CSS without a design-tool round-trip.
  - id: small_modification
    holds: true
    basis: Single screen, ~3 static files plus a generated data file; the smallest possible modification surface — direct code is the cheapest faithful realization.
  - id: mature_design_system
    holds: true
    basis: Design tokens are defined as CSS custom properties inside the deliverable itself (self-contained token set for one screen); no external design system dependency is needed, so direct code stays fit.
