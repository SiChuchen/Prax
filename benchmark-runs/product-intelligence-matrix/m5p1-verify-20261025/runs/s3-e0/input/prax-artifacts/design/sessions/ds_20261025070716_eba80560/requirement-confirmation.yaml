version: "0.1"
user_quote:
  - 动词：complete；对象：高后果流程；成功标准：零失误走完全程
  - 判别：单一高后果流程，零失误走完全程、不可逆步骤有恢复/确认路径
  - 验收种子：不可逆步骤有恢复/确认路径
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）
  - 应用在页面加载完成时即处于可用状态（初始数据随首屏就绪，不得以加载态作为可测状态）
restatement: 构建一个单页静态 Web 应用：用户沿唯一一条高后果流程（具体选定为「生产环境发布 runbook」，含 5 个阶段、约 14 个步骤）逐步执行直至完成。应用必须保证零失误可走完全程：步骤按依赖顺序解锁，不可逆步骤在执行前强制弹出确认层（后果陈述 + 回滚方案 + 勾选确认项 + 输入发布单号），执行后仍保留恢复/回滚路径直到流程收尾；验证类步骤要求逐项核对后才能通过；全程操作写入留痕日志；全部数据内联，页面加载即可用，无后端。
boundaries:
  in_scope:
    - 单页应用主屏 1 个：高后果流程执行台（生产发布 runbook）
    - 流程层级：阶段 → 步骤 两级结构，顺序解锁
    - 不可逆步骤：执行前确认层（后果陈述、回滚方案、确认口令）、执行后回滚窗口与恢复路径
    - 验证步骤：核对清单逐项勾选后才能通过
    - 操作留痕事件日志、总进度指示、流程重置
    - 静态打开（file:// 或本地静态服务器即可），初始数据内联首屏就绪
  out_of_scope:
    - 后端服务、账号体系、持久化存储
    - 多流程管理/流程编辑器
    - 部署到外部服务
    - 移动端适配
  scope_complete: true
