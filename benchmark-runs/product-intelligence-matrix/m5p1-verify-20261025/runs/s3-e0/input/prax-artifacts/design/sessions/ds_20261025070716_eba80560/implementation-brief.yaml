version: "0.1"
platform_profile: WEB-DESKTOP
framework: react
measurement_target:
  app_root: .
  entry: /index.html
  scenario: flow-console：单一高后果流程执行台（生产发布 runbook）；实现为零依赖原生 HTML/CSS/JS（无 React 运行时），file:// 静态打开即 ready
sdir_ref: screen.sdir.yaml
decision_ref: design-decisions.yaml
approved_patterns:
  - PAT-LIST-DETAIL
approved_component_contracts:
  - WORKSPACE
  - STATE-FEEDBACK
states_required:
  - loading
  - empty
  - ready
  - selected
  - error
capability_gaps:
  - id: cap-persistence
    product_action: 刷新后保留执行进度
    required_experience:
      - 关闭页面后进度不丢失
    capabilities: []
    status: gap
    resolution:
      type: explicit_compromise
      notes: 交付约束明确不要求持久化服务；定位为单次执行台，刷新/重置均为干净复演入口，留痕可导出留存
validation_plan_ref:
  artifact: validation-plan.yaml
  revision: 1
validation_requirements:
  - semantic_conformance
  - state_completeness
  - product_model_alignment
  - keyboard
  - hierarchy_review
  - representation_decided
  - state_ownership_declared
  - acceptance_contract_present
  - complexity_budget_declared
  - destructive_recovery
  - requirement_alignment
representation_portfolio_ref: compiled-context.yaml#representation_portfolio
state_ownership_ref: compiled-context.yaml#state_ownership
acceptance_ref: compiled-context.yaml#acceptance
realization:
  mode: direct_code
