        - app.js
        - data.js
    - check_id: hierarchy_review
      outcome: pass
      source: real-browser screenshots (1280/1440) vs SDIR region importance
      notes: 截图核对：dominant=中部当前步骤工作区（占主宽，单步骤聚焦），primary=左栏阶段→步骤进度（窄列、状态图标、当前步高亮），supporting=顶部全局状态与右栏留痕（空态虚线框弱化）；任务驱动区（确认关卡/完成卡片）条件出现。密度 regular，与 SDIR importance 分配一致。
      artifact_refs:
        - .prax/design/sessions/ds_20261025070716_eba80560/validation-evidence/fcf70bff-c7cf-44a1-b8cd-267a30e99e88/viewport-0/type.min_projected_size/min-projected-size-1280x860.png
        - .prax/design/sessions/ds_20261025070716_eba80560/screen.sdir.yaml
        - styles.css
    - check_id: destructive_recovery
      outcome: pass
      source: implementation (data.js/app.js) + prax state_completeness/semantic receipts + scripted journey harness
      notes: 3 个不可逆步骤（s08/s11/s13）在 data.js 均声明 consequence/impact/acks/rollback；app.js 强制：执行仅经确认关卡（全部确认项勾选 + 发布单号精确匹配，错误输入显示 role=alert 错误且零状态变更——对应实测通过的 error 状态覆盖）、执行后回滚入口在收尾步骤完成前始终可达、回滚级联复位后续步骤并写入留痕；收尾后窗口关闭（完成页统计）。驱动页 evidence/drive.html 覆盖 gate/gate-error/executed/rolled-back/completed 场景供复核。
      artifact_refs:
        - data.js
        - app.js
        - evidence/drive.html
    - check_id: requirement_alignment
      outcome: pass
      source: requirement-confirmation + real-browser screenshot + implementation
      notes: 与确认的 restatement 逐条对齐：单一高后果流程（生产发布 runbook，5 阶段 14 步）顺序解锁零失误执行；不可逆步骤执行前确认层、执行后恢复/回滚路径直至收尾；验证步骤逐项核对；留痕时间线+复制/导出；数据内联首屏即 ready（实测 state_completeness 通过，无 fetch、零外部请求，file:// 可开）。范围外项未实现，与 out_of_scope 一致；唯一能力 gap（刷新持久化）按显式妥协记录。
      artifact_refs:
        - .prax/design/sessions/ds_20261025070716_eba80560/requirement-confirmation.yaml
        - .prax/design/sessions/ds_20261025070716_eba80560/validation-evidence/fcf70bff-c7cf-44a1-b8cd-267a30e99e88/viewport-1/type.min_projected_size/min-projected-size-1440x900.png
        - index.html
    - check_id: keyboard
      outcome: pass
      source: prax browser measurement receipt + implementation
      notes: 实测回执（Prax 验证器 Chrome，run fcf70bff，1280x860 与 1440x900 双视口，entry /index.html）：a11y.focus_order=pass——7 个 Tab 停留点（跳转链接 a → 重置按钮 → 当前步骤按钮 → 4 个核对项 input），inversions=0，missing_indicators=0；a11y.target_size=pass（0 个小于 24px 命中区）。配套实现：左栏 roving tabindex（仅选中步 tabbable，↑/↓/Home/End 移动焦点）；核对项原生 checkbox 24px；Esc/遮罩取消确认关卡；:focus-visible 3px 焦点环。
      artifact_refs:
        - .prax/design/sessions/ds_20261025070716_eba80560/validation-evidence/fcf70bff-c7cf-44a1-b8cd-267a30e99e88/viewport-0/a11y.focus_order/focus-order-1280x860.png
        - app.js
        - styles.css
      measurement_receipt: validation-evidence/receipt-2026-10-25T07-40-24-696Z-4bab9308-1f27-4d29-85b1-f12b535d130a.json
