      reason: 操作留痕：按时间倒序事件流，支撑可回溯
  rejected:
    - option: PAT-CANVAS-WORKSPACE
      reason: spatiality=none、relationality=low，无空间关系需表达
    - option: table
      reason: density=low、comparison_need=none，表格浪费于单流程执行
    - option: kanban/board
      reason: 弱化顺序性，与零失误单行道冲突
    - option: document
      reason: 无状态与门控，无法承载确认/回滚交互
state_ownership:
