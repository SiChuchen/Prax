version: "0.1"
user_quote:
  - 动词：understand；对象：随时间演化的状态；成功标准：变更因果可读
  - 判别：随时间演化的多元素序列，变更因果与时间结构必须互相一致。
  - 验收种子：时间结构与变更语义一致
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）；应用在页面加载完成时即处于可用状态
restatement: 从零构建一个单页 Web 应用：主对象为 change_set（随时间演化的状态变更集）。用户任务是 understand——理解一个随时间演化、由多个 change_set 组成的序列，能读出每次变更的内容（改了什么、怎么改的）及其因果（为何发生、引发了什么），且时间结构（先后顺序）与变更语义（因在前果在后、状态由按时间回放而得）保持一致。单屏交付，初始数据内联首屏即用，纯静态可打开。
boundaries:
  in_scope:
    - 单屏时间线主视图：按时间排序的 change_set 序列
    - 每个 change_set 内的多元素变更明细（增/改/删等，含前后值）
    - 跨 change_set 的因果链接（cause/effect 的可视化与跳转）
    - 任一时间点的状态回放视图（state as-of 选中 change_set）
    - 内联示例数据集（首屏即用，无加载态）
    - 纯静态单页：index.html 可直接打开，无后端无部署
  out_of_scope:
    - 后端服务、账号体系、持久化存储
    - 实时数据接入或数据编辑/写入功能
    - 多页面/多主屏、移动端适配
    - 部署到任何外部服务
    - 既有业务系统代码复用
  scope_complete: true
open_questions: []
