task:
  surfaces: []
  primary: 在时间轴上浏览并选中一个变更事件，理解它改变了哪些组件的哪些字段、由哪个事件引起、又导致了哪些后续事件
product_relationships:
  - id: rel_causal_chain_change_event
    source: causal_chain
    target: change_event
    type: links
    direction: forward
    meaning: 因果链按『导致』语义串联变更事件；每个环的因在时间上游、果在时间下游
    importance: primary
  - id: rel_change_event_component
    source: change_event
    target: component
    type: affects
    direction: forward
    meaning: 事件通过字段级变更明细（前值→后值）作用于组件状态
    importance: primary
  - id: rel_change_event_state_snapshot
    source: change_event
    target: state_snapshot
    type: composes
    direction: forward
    meaning: 游标之前的全部事件按时间序折叠出该时刻快照
    importance: supporting
region_relationships: []
decisions:
