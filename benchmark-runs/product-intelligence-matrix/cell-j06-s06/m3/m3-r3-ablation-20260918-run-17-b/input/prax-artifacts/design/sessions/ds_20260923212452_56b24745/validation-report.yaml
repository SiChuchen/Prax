      measurement_receipt: validation-evidence/receipt-2026-09-23T22-25-23-443Z-57949d35-916c-49e6-bfe0-9aaf6316d2df.json
    - check_id: hierarchy_review
      outcome: pass
      source: 四态全屏截图比对 SDIR priority
      notes: 视觉显著度与 SDIR importance 一致：timeline dominant（视觉最宽左列）、inspector primary、snapshot+游标 supporting、toolbar/meta 弱化为上下文（P-22）；regular 密度，行条目紧凑可扫读。grid-areas 保证视觉层级不受 DOM 源序（无障碍 Tab 序）影响。
      artifact_refs:
        - evidence/01-initial.png
        - evidence/02-cursor-incident.png
        - evidence/03-filter.png
        - evidence/04-window-start.png
    - check_id: requirement_alignment
      outcome: pass
      source: 运行时自检 + headless-chrome 截图 + CDP 交互日志
      notes: 验收种子『时间结构与变更语义一致』落实并可验证：渲染前自检断言 11 条因果边全部 source.ts<target.ts、22 处变更前值等于折叠值（头部常驻『自检 ✓』）；因果连线恒指时间下游；游标快照=折叠投影（02 图：游标 e09 时支付仍 degraded、订单未降级；04 图：窗口起点为初始状态）；单页静态 index.html、数据内联首屏即用（loadingElements=0）、无后端、未部署。
      artifact_refs:
        - evidence/01-initial.png
        - evidence/02-cursor-incident.png
        - evidence/03-filter.png
        - evidence/04-window-start.png
        - evidence/05-keyboard-selection.png
        - evidence/06-chip-navigation.png
        - evidence/interaction-log.json
    - check_id: state_completeness
      outcome: pass
      source: DOM 取证 + 代码路径审查
      notes: ready：首屏同步渲染 18 行（DOM 取证 evCount=18、loadingElements=0）；selected：默认选中 e06、aria-pressed 同步；empty：过滤空集显示『当前过滤条件下没有变更事件』、Esc 后检查器引导态；error：数据自检失败时显示错误横幅（当前数据通过）。loading 按交付约束刻意不存在为可见状态——数据内联、同步渲染，『加载态』不作为可测状态。
      artifact_refs:
        - evidence/interaction-log.json
