version: "0.1"
user_quote:
  - 动词：explore；对象：多维数据；成功标准：维度切换不重置认知
  - 判别：维度是主要认知负担（从单概念到无界数据），切换维度不重置认知
  - 过滤/投影状态有归属且可回退
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）；应用在页面加载完成时即处于可用状态
restatement: "Build a greenfield single-page web app for exploring high-dimensional data. The user explores an unbounded-ish, high-density dataset across many dimensions; the core success criterion is that switching dimensions/projections must not reset the user's cognitive context (selection, filters, and reading position persist across dimension changes). The acceptance seed requires every filter/projection state to have a clear owner and be reversible/undoable. Deliverable: one static page (root index.html), initial data inlined and fully usable at load, no backend, no persistence service, runs locally."
boundaries:
  in_scope:
    - "Single main screen: dimensional data explorer (dataset object)"
    - Dimension switching (assign dimensions to axes/encodings) that preserves selection + filter state
    - Filter/projection state with visible ownership (what is active, where it applies) and reversible rollback (undo/clear per state)
    - Initial dataset inlined in first payload, first screen usable immediately at load
    - "Static delivery: root index.html opens directly, no external services"
  out_of_scope:
    - Backend, accounts, persistence services, deployment
    - Multi-screen apps, mobile layout
    - Comparison tooling (comparison_need=none)
    - Real-time/streaming data (volatility low-medium, single inline dataset)
  scope_complete: true
open_questions: []
confirmation:
  status: requirement_is_sufficient
  evidence:
