version: "0.1"
user_quote:
  - 动词：explore；对象：多维数据；成功标准：维度切换不重置认知
  - 验收种子：过滤/投影状态有归属且可回退
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）
  - 应用在页面加载完成时即处于可用状态（初始数据随首屏就绪，不得以加载态作为可测状态）
restatement: 构建一个单页多维数据集探索应用：用户面对一个高维、高密度、无界规模的数据集，核心操作是在维度之间切换投影（换一组轴/切片）来探索数据。验收种子要求过滤与投影状态有明确归属（可见、可辨识的状态清单）且可回退（单条撤销、重置），并且切换维度不重置既有过滤/选中认知——维度切换是投影变化而非上下文清空。单屏交付，数据首屏内联可用，无后端、无账号、无持久化服务，可本地静态打开。
boundaries:
  in_scope:
    - 单页 Web 应用，静态打开即可用（index.html / dist 构建产物）
    - 多维数据集的探索主屏：维度（投影）选择、维度值过滤、记录明细
    - 维度切换时保持过滤与投影状态（认知连续性）
    - 过滤/投影状态有归属（可见的活跃状态清单，标注来源维度）且可回退（每条可单独移除，支持撤销/重置）
    - 初始数据内联首屏，无加载态
  out_of_scope:
    - 后端服务、账号体系、持久化存储
    - 多页面/多主屏
    - 部署到外部服务
    - 数据编辑/写入（只读探索）
    - 移动端适配
  scope_complete: true
