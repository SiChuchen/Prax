version: "0.1"
corrections:
  - id: sdir-validate-does-not-persist
    scope:
      project: cell-j02-s02-b
      surfaces:
        - list_detail_screen
    finding:
      type: tooling-defect
      observed: "design_sdir mode=validate returns PASS for an authored SDIR 0.2 (with
        representation, state_ownership, acceptance, complexity_budget under
        screen and at root) but does not persist it: the session artifact
        screen.sdir.yaml remains the auto-generated 0.1. At the VALIDATE gate,
        mode=apply_delta is rejected as illegal, so no sanctioned tool call can
        persist an authored SDIR once the session reaches validation;
        design_validate evaluate then deterministically fails
        representation_decided / state_ownership_declared /
        acceptance_contract_present against the stale 0.1 artifact."
    intended:
      statement: A design_sdir validate PASS should persist the authored SDIR (or
        expose an explicit persist action legal at the validate gate), so that
        design_validate evaluate measures the same artifact the linter
        validated.
    evidence_refs:
      - .prax/design/sessions/ds_20260923191201_1b62cf32/screen.sdir.yaml
      - design_sdir mode=validate → status PASS (3 calls, payloads included
        representation/state_ownership/acceptance/complexity_budget)
      - design_sdir mode=apply_delta → BLOCK GATE_NOT_SATISFIED ('not legal
        while session is at the validate gate')
      - design_validate mode=evaluate → deterministic fails on
        representation_decided / state_ownership_declared /
        acceptance_contract_present while the same blocks passed the linter
    regression:
      check_id: semantic_conformance
      requirement: design_validate evaluate must measure the persisted session SDIR;
        after persistence of the lint-passed 0.2 payload,
        representation_decided, state_ownership_declared,
        acceptance_contract_present, and complexity_budget_declared must pass
        deterministically.
    supersedes: []
    promotion:
      candidate: false
    created_at: 2026-09-23T19:39:21.641Z
