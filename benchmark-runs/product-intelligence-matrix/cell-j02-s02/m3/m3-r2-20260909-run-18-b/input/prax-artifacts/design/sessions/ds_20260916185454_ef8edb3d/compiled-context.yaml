    - incremental-render
must_preserve: []
regression_points: []
unresolved: []
corrections: []
representation_portfolio:
  primary:
    type: list
    reason: Locate over an unbounded weakly-related collection is a narrowing task; a count-labeled, grouped searchable list is the fastest scannable surface
  supporting:
    - type: form
      reason: Filter rail is a small bounded form region composing with search
    - type: cards
      reason: Item detail panel is a compact card document for the selected item
  rejected:
    - option: graph
      reason: relationality is low — no relationship structure to render
    - option: tree
      reason: hierarchy is medium (sections only); a tree would add a navigation level to the locate path
    - option: table
      reason: comparison_need is none; a table wastes width needed for the adjacent detail panel
    - option: grid (cards)
      reason: optimizes visual browsing, not 3-interaction target lookup
state_ownership:
  - state: selection
    owner: Search entry (task-first, top of work region)
  - state: preview
    owner: session
acceptance:
  - A user can locate and open any target item within three interactions, via a path that always has search/filter support and never loses the results context.
validation:
