version: "0.1"
user_quote:
  - 动词：locate / 对象：大型集合中的目标 / 成功标准：三次交互内定位
  - 判别：无界弱关系的大集合，主要认知负担是定位路径而非结构呈现。
  - 定位路径有搜索/过滤支撑且不丢上下文
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）
  - 应用在页面加载完成时即处于可用状态（初始数据随首屏就绪，不得以加载态作为可测状态）
restatement: 构建一个单页 Web 应用：用户需要在一个无界、弱关系的大型集合（item 为主对象）中定位目标。核心认知负担是定位路径而非结构呈现，因此产品必须提供搜索/过滤支撑，且定位过程不丢失上下文；成功标准是三次交互内定位到目标。交付物为全新代码、可静态直接打开（根 index.html 或 dist/）、首屏数据内联即用、本地运行、单主屏、无后端/账号/持久化。
boundaries:
  in_scope:
    - 单页 Web 应用，1 个主屏
    - 大型集合的搜索 + 过滤定位路径
    - 定位过程保持上下文（筛选/浏览位置可见可恢复）
    - 初始数据随首屏内联，加载完成即可用
    - 静态可打开：根路径 index.html 或 dist/ 构建产物
    - 本地可运行、可构建，不部署外部服务
  out_of_scope:
    - 后端服务、账号体系、持久化存储
    - 多屏/多页面导航
    - 外部网络依赖（CDN、API）
    - 修改冻结简报中的验收标准
  scope_complete: true
open_questions: []
