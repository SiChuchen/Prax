version: "0.1"
user_quote:
  - 动词：create；对象：空间对象；成功标准：落位即意图
  - 判别：物理空间排布即意图，空间操作必须有键盘等价物
  - 验收种子：空间操作有键盘等价物
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）
  - 应用在页面加载完成时即处于可用状态（初始数据随首屏就绪，不得以加载态作为可测状态）
restatement: 构建一个从零开始的单页 Web 应用：用户在物理感画布工作区中创建空间对象（canvas_object），空间排布本身承载意图（位置=含义）。每个空间操作（移动、对齐、创建、选择、分布等）都必须有键盘等价物。应用在页面加载完成时即处于可用状态，初始数据随首屏内联，无加载态、无后端、无账号、无持久化服务，可静态打开。
boundaries:
  in_scope:
    - 单主屏：物理感空间画布工作区（canvas_object 为主要对象）
    - 创建空间对象：新建/落位即意图（位置与排布承载语义）
    - 空间操作全量键盘等价物：移动、缩放、选择、对齐、分布、创建、删除、层级等均可键盘完成
    - 指针操作同时支持（拖拽移动、点选、框选）
    - 初始数据内联首屏，页面加载完成即可用，无加载态
    - 静态可打开（根 index.html 或 dist/），本地运行，不部署外部服务
  out_of_scope:
    - 后端、账号体系、持久化服务/多用户协作
    - 多屏/多页导航
    - 外部部署
    - 修改冻结简报中的验收标准
    - 复用既有业务系统代码
  scope_complete: true
