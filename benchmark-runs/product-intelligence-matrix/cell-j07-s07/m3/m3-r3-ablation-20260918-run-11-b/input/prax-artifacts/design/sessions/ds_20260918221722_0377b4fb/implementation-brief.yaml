version: "0.1"
platform_profile: WEB-DESKTOP
framework: react
measurement_target:
  app_root: .
  entry: /index.html
  scenario: "keyboard create-and-place journey: load shows populated floor with 4 zones + 13 tiles at first paint (no loading state); press N → ghost appears → arrow keys position it into Main Gallery (status landing hint names the zone) → Enter commits → tile inherits zone tint via containment; select a tile, press 2 to send-to-zone; arrows nudge; ? opens keyboard map. Note: adapter realization is framework-free vanilla ES2017 in three static files to guarantee file:// static open with zero build — schema-level framework field is filled with the only permitted constant; see validation evidence for the deviation record."
