representation_portfolio:
  primary:
    type: canvas
    reason: Spatial continuity on a physical floor is the product object itself; canvas is the only representation where position carries meaning natively
  supporting:
    - type: list
      reason: Zone rail listing zones with occupancy counts and send-to hotkeys keeps the many-object population legible
    - type: cards
      reason: Inspector presents the selection's derived facts as one compact fact card
  rejected:
    - option: table
      reason: Position would live in sortable cells, destroying placement-is-intent
    - option: map
      reason: Georeferenced basemap is irrelevant to an abstract physical floor
    - option: tree
      reason: Hierarchy is explicitly low; nesting would over-structure flat zones
state_ownership:
  - state: selection
    owner: architecture
  - state: preview
