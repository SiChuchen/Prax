acceptance:
  - A user can create a new object and land it in the intended zone using only the keyboard (N → arrows → Enter, or select + 1..n send-to-zone), and the board's derived state (zone membership, nearest neighbor, zone counts) updates immediately to match the landing position; every spatial operation has a documented keyboard equivalent.
