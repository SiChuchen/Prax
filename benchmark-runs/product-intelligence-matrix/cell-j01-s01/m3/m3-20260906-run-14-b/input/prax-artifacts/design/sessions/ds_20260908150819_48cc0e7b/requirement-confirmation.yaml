version: "0.1"
user_quote:
  - 动词：manage；对象：结构化实体集合；成功标准：批量操作无误完成
  - 判别：大量有层级归属的结构化实体集合，成败在批量操作零误伤与状态归属显式
  - 批量选择与操作零误伤，状态归属显式
restatement: 构建一个单页 Web 应用，用于管理一个大量、高层级归属的结构化实体集合。用户在层级目录中浏览与筛选实体，执行显式范围的多选与批量操作（改状态、移动、删除、打标签等）。成败标准：批量选择与操作零误伤（操作只且恰好作用于显式确认的目标集，含级联子项也必须显式列出并可选择），以及状态归属显式（每个实体与每个层级节点的状态及其变化始终可见、可追溯）。
boundaries:
  in_scope:
    - 层级树导航（域→类别→实体），节点计数与状态分布
    - 高密度实体表格：多选、筛选、排序、关键字搜索
    - 显式范围的多选（当前视图/当前节点子树）与选择摘要（含被筛选隐藏项警示）
    - 批量操作：批量改状态、批量移动、批量删除、批量打标签，均带受影响实体预览（含级联子项显式列出与 opt-in）
    - 批量操作确认模态：逐项列出受影响实体与状态迁移明细
    - 操作历史与撤销（单步撤销最近一次批量操作）
    - 初始数据随首屏内联就绪，无加载态；纯静态本地运行
  out_of_scope:
    - 后端服务、账号体系、持久化服务
    - 多用户协作/权限
    - 实体间比较视图
    - 空间/地图类可视化
    - 移动端适配
    - 部署到外部服务
  scope_complete: true
