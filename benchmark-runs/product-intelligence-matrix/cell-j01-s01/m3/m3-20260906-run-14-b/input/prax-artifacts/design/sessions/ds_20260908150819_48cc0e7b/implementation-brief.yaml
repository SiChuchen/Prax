version: "0.1"
platform_profile: WEB-DESKTOP
framework: react
measurement_target:
  app_root: .
  entry: /index.html
  scenario: cell-j01-s01 主屏：层级实体目录批量管理（选择→预览→提交→回执/撤销）
sdir_ref: screen.sdir.yaml
decision_ref: design-decisions.yaml
approved_patterns:
  - PAT-DATA-EXPLORER
approved_component_contracts:
  - DATA-SURFACE
  - FILTER-CONTROLS
  - CONTEXTUAL-DETAIL
states_required:
  - loading
  - empty
  - ready
  - selected
  - error
capability_gaps:
  - id: n-persist
    product_action: 数据变更跨会话持久化
    required_experience:
      - 刷新后仍保留批量操作结果
    capabilities:
      - localStorage/IndexedDB
      - 后端存储服务
    status: gap
    resolution:
      type: explicit_compromise
      notes: 简报交付约束明确『不要求持久化服务』且不得部署外部服务；本实现为会话内存态，刷新重置为种子数据，在界面注明。此为对简报边界的显式取舍而非功能缺失
validation_plan_ref:
  artifact: validation-plan.yaml
  revision: 1
validation_requirements:
  - semantic_conformance
  - state_completeness
  - product_model_alignment
  - keyboard
  - hierarchy_review
  - representation_decided
  - state_ownership_declared
  - acceptance_contract_present
  - complexity_budget_declared
  - filter_state
  - comparison_scan
  - destructive_recovery
  - requirement_alignment
realization:
  mode: direct_code
