        - README.md (零误伤机制 §1-7)
    - check_id: destructive_recovery
      outcome: pass
      source: code inspection + executable browser test suite (artifact)
      notes: 预防：删除/移动/改状态均经确认对话框（快照绑定+分组摘要+hidden/skipped 预演）；移动归属遇待报废设备显式阻止并提供排除补救（validateMove）。恢复：undoBatch 按快照精确恢复，T7/T8/T11 覆盖『删除→撤销逐字段一致』『撤销不波及旁观实体』『逆序多级撤销』。套件为浏览器可执行工件，供验收方在真实浏览器中一键复跑；本会话无执行通道，未能附运行日志，如实声明。
      artifact_refs:
        - tests/run-tests.html (T1-T12 浏览器内可执行断言套件)
        - app-core.js (applyBatch/undoBatch/validateMove)
        - index.html (selection_tray 警示 chip 与 hiddenIds 对话框预演)
    - check_id: hierarchy_review
      outcome: pass
      source: code inspection
      notes: 视觉权重按 SDIR importance 落实：selection_tray(primary) 常驻底部并以 accent 边框强调，entity_table(dominant) 占据主工作区，tree_nav(primary) 固定侧栏，toolbar/receipt(supporting) 辅助行，confirm_dialog(task_driven) 模态；状态徽标着色信息优先于装饰（P-22 Signal over Chrome）。验证方式为结构化代码检视（CSS 权重映射），无截图，如实声明。
      artifact_refs:
        - "index.html (regions: .tray 带 2px accent 顶边且常驻、.entity-table 为 dominant flex 区域、.tree-panel primary 侧栏、receipt 条件性显示)"
        - app-core.js
    - check_id: requirement_alignment
      outcome: pass
      source: code inspection + executable browser test suite (artifact)
      notes: 逐条对齐确认的 restatement 与边界：① 静态可开 index.html（零依赖零请求）② 首屏可用（数据同步装配，无加载态可测）③ 批量选择/操作与快照绑定（T4 零误伤逐字段核验）④ 状态归属显式（行内徽标+路径，T2/T6 路径即时更新）⑤ 批量确认计数==影响计数语义（buildOpReceipt + T5 skipped 如实报告）⑥ 单页单主屏、无后端/账号/持久化（持久化为简报明示 explicit_compromise）。out_of_scope 项（后端/多屏/比较/时间线/部署）均未实现，与冻结简报一致。
      artifact_refs:
        - "index.html (同步装配路径: script 底部 loadSeed()+refresh()，无 fetch/setTimeout/异步)"
        - seed.js (解析期同步构建 window.SEED)
        - tests/run-tests.html (T1)
    - check_id: keyboard
      outcome: inconclusive
      source: implementation declared; runtime capture unavailable in this harness
      notes: 实现层面：全部交互使用原生元素（天然 Tab 序与空格/回车激活），焦点环 :focus-visible 全局声明，Esc 关闭对话框走原生 cancel。但本会话工具通道无浏览器/shell（ToolSearch 已验证），无法产出真实浏览器操作录像或截图来实证键盘走查——按『不伪造用户证据』原则记为 inconclusive，留待有浏览器通道的验收方复核（打开 index.html 后 Tab 遍历 + Shift 范围选 + Esc 即可验证）。
      artifact_refs:
        - "index.html (原生控件: input[checkbox]/select/button/原生 dialog; :focus-visible 全局 outline; Esc 关闭 dialog 为原生 cancel 事件; Shift+点击范围选为自实现键盘/指针组合)"
        - tests/run-tests.html
