version: "0.1"
platform_profile: WEB-DESKTOP
framework: react
measurement_target:
  app_root: .
  entry: /index.html
  scenario: 批量选择与批量操作零误伤：跨节点多选 → 确认对话框分组摘要 → 批量状态变更/移动归属/删除 → 回执『影响 N = 确认 N』→ 整体撤销；交付为静态可开 index.html，首屏内联数据即用
sdir_ref: screen.sdir.yaml
decision_ref: design-decisions.yaml
approved_patterns:
  - PAT-WORKSPACE
approved_component_contracts:
  - WORKSPACE
  - STATE-FEEDBACK
states_required:
  - loading
  - empty
  - ready
  - selected
  - error
capability_gaps:
  - id: cross_session_persistence
    product_action: 跨会话持久化（刷新后保留变更）
    required_experience:
      - 刷新/重开后数据保留
    capabilities: []
    status: gap
    resolution:
      type: explicit_compromise
      notes: 简报交付约束明确『不要求后端、账号体系或持久化服务』；刷新回到种子数据为约束内行为，非能力缺口
validation_plan_ref:
  artifact: validation-plan.yaml
  revision: 1
validation_requirements:
  - semantic_conformance
  - state_completeness
  - product_model_alignment
  - keyboard
  - hierarchy_review
  - representation_decided
  - state_ownership_declared
  - acceptance_contract_present
  - complexity_budget_declared
  - destructive_recovery
  - requirement_alignment
realization:
  mode: direct_code
