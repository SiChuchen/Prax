<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支付核心库主库割接 · 高后果流程执行台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-badge mono">RB-PAY-0915</div>
    <div class="brand-text">
      <h1>支付核心库主库割接</h1>
      <p class="sub">高后果流程执行台 · 目标：零失误走完全程</p>
    </div>
  </div>
  <div class="top-mid">
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label mono" id="progressLabel">0 / 9 步</div>
  </div>
  <div class="top-right">
    <span class="chip" id="chipIrr">不可逆 0/2</span>
    <span class="chip" id="chipMistake">失误 0</span>
    <span class="chip" id="chipDeviation">偏差 0</span>
    <span class="chip mono" id="chipTimer">00:00</span>
    <button class="btn ghost" id="btnRestart" type="button">重新开始</button>
  </div>
</header>

<main>
  <aside class="map" id="map" aria-label="流程地图"></aside>
  <section class="stage" id="stage" aria-live="polite"></section>
  <aside class="logside">
    <div class="log-head">
      <h2>审计日志</h2>
      <span class="mono run-chip" id="runChip">—</span>
    </div>
    <div class="log" id="log" aria-label="审计日志"></div>
  </aside>
</main>

<div class="modal-backdrop hidden" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">重新开始本次执行？</h3>
    <p>当前执行记录与审计日志将被清空，并以新的执行编号重新开始。此操作用于演练重置，不影响任何真实系统。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel" type="button">取消</button>
      <button class="btn danger" id="modalOk" type="button">清空并重新开始</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
