      kind: deterministic
      profile: semantic_integrity
      facet: semantic
      requirement: SDIR 0.2 declares representation.primary with a non-empty reason.
      evidence_required: false
    - id: state_ownership_declared
      label: State ownership declared
      kind: deterministic
      profile: semantic_integrity
      facet: semantic
      requirement: Selection and preview states both have declared owners.
      evidence_required: false
    - id: acceptance_contract_present
      label: Acceptance contract present
      kind: deterministic
      profile: semantic_integrity
      facet: semantic
      requirement: SDIR 0.2 carries at least one acceptance criterion.
      evidence_required: false
    - id: complexity_budget_declared
      label: Complexity budget declared
      kind: deterministic
      profile: semantic_integrity
      facet: semantic
      requirement: SDIR 0.2 declares a complexity_budget block (values are not judged).
      evidence_required: false
    - id: destructive_recovery
      label: Destructive recovery
      kind: deterministic
      profile: runtime_degradation
      facet: behavioral
      requirement: Destructive actions match error cost with prevention or recovery.
      evidence_required: true
    - id: requirement_alignment
      label: Requirement alignment
      kind: assistive
      profile: semantic_integrity
      facet: semantic
      requirement: The delivered result matches the confirmed restatement, scope, and success definition.
      evidence_required: true
