  relationship_complexity: low
  change_rate: medium
  comparison_need: low
platform:
  family: web
  form_factor: desktop
  input:
    - pointer
    - keyboard
  viewport: large
risk:
  destructive_actions: high
  error_cost: high
priorities:
  - 零失误走完全程（门禁校验阻止跳步/带错推进）
  - 不可逆步骤的确认路径（后果可见+显式确认）
  - 不可逆步骤的恢复路径（冷静期撤销/恢复点/回滚指引）
  - 偏差可追溯（执行记录/审计摘要）
  - 首屏即用、无加载态
density_intent: spacious
confidence:
  overall: high
