user:
  expertise: mixed
  familiarity: low
task:
  primary: 零失误走完一个高后果流程：按阶段执行步骤，通过门禁，对不可逆动作先确认后执行并保留恢复路径
  modes:
    - 引导执行
    - 确认不可逆动作
    - 撤销/恢复
    - 查看执行记录
  frequency: low
domain:
  type: 生产变更/高危运维操作（runbook 驱动的变更执行）
