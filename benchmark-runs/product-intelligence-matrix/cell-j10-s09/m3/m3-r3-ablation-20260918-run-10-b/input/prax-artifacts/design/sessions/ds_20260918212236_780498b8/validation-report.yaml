plan_revision: 2
evidence:
  submitted_by: implementation-arm
  collected_at: 2026-09-19T06:40:00Z
  items:
    - check_id: state_completeness
      outcome: pass
      source: headless-chrome（真实浏览器）截图 + DOM 文本复核
      notes: ready=首屏同步渲染即步骤 1 可执行（shotA，无加载指示）；error=门禁未过内联错误块+偏差+1（shotB）；empty=执行记录抽屉空态（shotL）；selected=旅程图点选只读回看。loading：应用无任何异步路径（数据内联、无构建链），加载态结构性不存在；冻结简报明文禁止以加载态作为可测状态，SDIR 0.2 按词汇契约保留 loading 声明并在 unresolved u3 记录该立场。
      artifact_refs:
        - evidence/shotA-firstscreen.png
        - evidence/shotL-empty-drawer.png
        - evidence/shotB-gate-error.png
        - evidence/shotK-keyboard-focus.png
    - check_id: product_model_alignment
      outcome: pass
      source: headless-chrome 截图
      notes: Product Frame 六对象全部以用户语言呈现：高后果流程（变更单 CHG-20260919-0417）、阶段（旅程图阶段 1-4 分组+进度 n/m）、步骤（12 步编号+状态灯）、确认门（不可逆动作·确认门模态）、恢复路径（后果/恢复双块+撤销横条+审计表恢复路径列）、执行记录（抽屉时间线+凭证审计摘要）。contains/gated_by/backed_by/appends_to 关系均可在交互中观察。
      artifact_refs:
        - evidence/shotA-firstscreen.png
        - evidence/shotC-confirm-modal.png
        - evidence/shotD-undo-strip.png
        - evidence/shotG-certificate-dev1.png
    - check_id: keyboard
      outcome: pass
      source: headless-chrome 截图 + 键盘语义实现
      notes: 全部交互件为原生 button/checkbox（Tab 可达、Enter/Space 可操作）；:focus-visible 2px 描边在截图中可见；Esc 关闭确认门与抽屉；确认门内 Tab 焦点圈定；确认按钮需知晓勾选后才可用。测量回执 validation-evidence/keyboard-receipt.json（0.2 绑定版）覆盖 a11y.focus_order。
      artifact_refs:
        - evidence/shotK-keyboard-focus.png
      measurement_receipt: validation-evidence/keyboard-receipt.json
    - check_id: hierarchy_review
      outcome: pass
      source: headless-chrome 截图比对 SDIR regions importance
      notes: SDIR 重要性映射到视觉权重：step-focus dominant（最大版式、唯一主按钮）；journey-map primary 常驻（状态灯+不可逆 ⚠ 预警）；safety-gate 任务驱动时升为 dominant（确认门遮罩全屏，shotC）；zero-mistake-status 与 record-drawer supporting/contextual；completion-certificate 终态 dominant（shotI）。未见实现便利凌驾语义重要性的反例。
      artifact_refs:
        - evidence/shotA-firstscreen.png
        - evidence/shotC-confirm-modal.png
        - evidence/shotI-certificate-zero.png
    - check_id: destructive_recovery
      outcome: pass
      source: headless-chrome 截图 + DOM 文本复核
      notes: 4 个不可逆动作三层防护：执行前后果+恢复路径常驻预览；确认门模态（后果陈述+恢复路径+知晓勾选解锁确认）；执行后恢复路径双形态——可撤销类 30s/45s 倒计时一键撤销+级联回退（撤销后回执行前且偏差不增），最终类常驻恢复点/回滚指引（审计表『不可撤销（恢复点已留档）』）。门禁未过尝试执行被拦截并记偏差（shotB）。错误成本 high 与防护/恢复等级匹配。
      artifact_refs:
        - evidence/shotC-confirm-modal.png
        - evidence/shotD-undo-strip.png
        - evidence/shotE-after-undo.png
        - evidence/shotF-final-confirm.png
        - evidence/shotH-record-drawer.png
    - check_id: requirement_alignment
      outcome: pass
      source: headless-chrome 截图 + 交付物检查
      notes: 交付物本体 index.html 以 file:// 静态直开、首屏即就绪（shotM，无加载态）；单一主屏，无后端/账号/持久化，未部署；零失误可测（偏差账本+凭证判定，shotI 零失误达成）；验收种子由确认门+撤销窗口+恢复点三机制落实。
      artifact_refs:
        - evidence/shotM-index-real.png
        - evidence/shotI-certificate-zero.png
        - README.md
    - check_id: semantic_conformance
      outcome: pass
      source: SDIR 0.2（screen.sdir.yaml）+ 实现走查
      notes: SDIR 0.2 已持久化至 screen.sdir.yaml 且此前经 design_sdir validate PASS（schema/semantic 零错误）；实现按 archetype PAT-LIST-DETAIL 组织：旅程图列表侧+相邻详情执行区，与 design-decisions 一致。
      artifact_refs: []
    - check_id: representation_decided
      outcome: pass
      source: SDIR 0.2（screen.sdir.yaml）
      notes: SDIR 0.2 representation.primary=wizard（reason 非空：顺序门禁执行本质，卡片网格默认壳反证已正面论证）；supporting=list/document。
      artifact_refs: []
    - check_id: state_ownership_declared
      outcome: pass
      source: SDIR 0.2（screen.sdir.yaml）
      notes: SDIR 0.2 state_ownership：selection=journey-map、inspector=record-drawer、preview/query/viewport/mode=session，均有归属。
      artifact_refs: []
    - check_id: acceptance_contract_present
      outcome: pass
      source: SDIR 0.2（screen.sdir.yaml）
      notes: SDIR 0.2 acceptance 含 4 条，首条即验收种子（不可逆步骤有恢复/确认路径）的可操作化表述。
      artifact_refs: []
    - check_id: complexity_budget_declared
      outcome: pass
      source: SDIR 0.2（screen.sdir.yaml）
      notes: SDIR 0.2 complexity_budget 已声明（panels=2, primary_actions=2, modes=1, state_owners=3, navigation_levels=1, filters=0, new_concepts=3, keyboard=1, mobile_conflicts=0, surfaces=1）。
      artifact_refs: []
