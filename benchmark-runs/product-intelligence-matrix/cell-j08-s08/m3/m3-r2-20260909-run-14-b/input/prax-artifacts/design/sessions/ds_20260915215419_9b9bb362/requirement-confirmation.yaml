version: "0.1"
user_quote:
  - 动词：edit / 对象：文档 / 成功标准：编辑不破坏结构
  - 结构化编辑与预览一致
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）；应用在页面加载完成时即处于可用状态（初始数据随首屏就绪）
restatement: 构建一个单页 Web 应用：对单一文档进行结构化编辑。用户以结构化方式（分区/块级结构）编辑一份文档，编辑操作不得破坏文档结构（标题层级、分区完整性），且结构化编辑器与实时预览呈现必须始终一致。首屏即含初始文档数据、加载完成即可用；纯前端静态交付（index.html），无后端、无账号、无外部服务，不部署。
boundaries:
  in_scope:
    - 单一文档的结构化编辑（块级结构：标题/段落/列表等）
    - 编辑操作保持文档结构完整（层级连续、结构校验与修复）
    - 结构化编辑器与实时预览双向一致
    - 撤销/重做等中等时间性支持
    - 初始文档数据随首屏内联就绪
    - 静态交付：根路径 index.html 可直接打开，本地可运行
  out_of_scope:
    - 多文档管理/文档列表
    - 后端、账号体系、持久化服务
    - 协同编辑
    - 部署到外部服务
    - 对比/地图/空间类视图
  scope_complete: true
