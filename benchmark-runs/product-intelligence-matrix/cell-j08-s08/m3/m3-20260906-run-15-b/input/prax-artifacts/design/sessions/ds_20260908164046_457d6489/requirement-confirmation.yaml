version: "0.1"
user_quote:
  - 动词：edit；对象：文档；成功标准：编辑不破坏结构
  - 验收种子：结构化编辑与预览一致
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）；应用在页面加载完成时即处于可用状态
restatement: 构建一个单页 Web 应用：对单一文档进行结构化编辑（节/子节的层级大纲 + 结构化字段编辑 + 实时预览），编辑操作受结构完整性约束保护（不会破坏文档结构），且结构化编辑器与渲染预览始终一致。首屏即含完整初始文档数据，可直接静态打开，无后端、无账号、无持久化服务。
boundaries:
  in_scope:
    - 单一文档（one）的结构化编辑器主屏（1 个）
    - 层级大纲（中等层级性）：选择、重排、升降级、增删节
    - 节级结构化字段编辑（标题、正文等）
    - 与结构化编辑实时一致的渲染预览
    - 结构完整性约束与校验反馈（编辑不破坏结构）
    - 撤销/重做（中等时间性）
    - 初始文档数据随首屏内联就绪
    - 静态可打开（根路径 index.html），本地运行，无外部服务
  out_of_scope:
    - 后端服务、账号体系、持久化服务
    - 多文档管理（基数 one）
    - 部署到外部服务
    - 协同编辑、评论
    - 比较/对照视图（比较需求 none）
    - 空间化/画布式布局（空间性 none）
  scope_complete: true
