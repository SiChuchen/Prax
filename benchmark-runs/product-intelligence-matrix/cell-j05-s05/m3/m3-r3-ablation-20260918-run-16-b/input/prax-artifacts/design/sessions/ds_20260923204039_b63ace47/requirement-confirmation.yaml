version: "0.1"
user_quote:
  - 动词：understand；对象：关系结构；成功标准：依赖与影响可跟随
  - 判别：关系本身是内容，跟随依赖与影响不能丢失全局上下文
  - 验收种子：关系跟随不丢失全局上下文
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）；应用在页面加载完成时即处于可用状态
restatement: 从零构建一个单页静态 Web 应用，帮助用户理解一个关系结构（依赖/影响网络）：节点与有向关系构成关系网；用户可从任意节点出发逐步跟随其上游依赖与下游影响，且在跟随过程中全图始终可见、位置可辨（小地图+路径面包屑+距离着色），不丢失全局上下文。初始数据内联随首屏就绪，无加载态；无后端、无持久化、无外部服务；根路径 index.html 静态可开。
boundaries:
  in_scope:
    - 单屏应用：全图关系画布（SVG，分层布局）+ 检查器面板 + 小地图 + 路径面包屑
    - 内联数据集：一个虚构系统的节点与有向依赖关系（many 节点 / 高关系性 / 中密度）
    - 节点选中与检查器（直接上游/下游、属性）
    - 上游依赖追踪与下游影响追踪（BFS 距离着色、逐步扩展）
    - 小地图（全局位置 + 视口框 + 追踪高亮）
    - 节点搜索定位、画布平移缩放、图例
    - 纯静态交付：index.html 直接打开即用
  out_of_scope:
    - 后端服务、账号体系、持久化
    - 图数据的编辑/新增/删除
    - 多屏/多页面导航
    - 实时数据更新
    - 部署到外部服务
  scope_complete: true
open_questions: []
