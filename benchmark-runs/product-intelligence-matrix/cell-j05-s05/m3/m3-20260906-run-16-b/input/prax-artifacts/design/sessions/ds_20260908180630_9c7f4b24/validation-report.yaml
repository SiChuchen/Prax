    - check_id: state_completeness
      outcome: pass
      source: headless Edge screenshots + --dump-dom of live page and invalid-data probe
      notes: "ready: 01-initial.png (24-node graph at first paint, context bar 全部可见). selected: 02/03/04 (trail active, impact closure, deps closure). empty: inspector empty-state at load (01) and search 无匹配 branch in app.js. error: 06-error-state.png — styled 数据错误 panel from invalid-data probe. loading: defined in the model but unreachable by design — data inlined in data.js, synchronous render, zero runtime fetches; fresh dump shows body.state-ready at parse."
      artifact_refs:
        - evidence/01-initial.png
        - evidence/02-follow-trail.png
        - evidence/03-impact.png
        - evidence/04-deps-closure.png
        - evidence/06-error-state.png
