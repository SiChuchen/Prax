    - check_id: product_model_alignment
      outcome: pass
      source: --dump-dom aria-labels + screenshot 02
      notes: "UI objects/language match the Product Frame objects verbatim: 服务节点 service_node (24 g[role=button] aria-label '<id> <中文名>，<团队>，直接依赖 N 项，被依赖 M 项'), 依赖关系 dependency_edge as first-class selectable content (40 edge hit-areas aria-label '依赖关系：<from> 依赖 <to>'), 跟随路径 follow_trail as ordered chips with per-hop direction (→依赖 / ←被依赖), 全局地图 system_map persistent with dim-to-focus."
      artifact_refs:
        - evidence/02-follow-trail.png
        - .prax/design/sessions/ds_20260908180630_9c7f4b24/validation-evidence/run-dom-follow.html
    - check_id: keyboard
      outcome: pass
      source: regex measurement over fresh --dump-dom + app.js/styles.css source; bound measurement receipt (a11y.focus_order)
      notes: "Measured on fresh --dump-dom: 64 focusable role=button objects (24 nodes + 40 edge hit-areas), 0 positive tabindex, all labelled; Enter/Space activate, Esc returns to whole web, / focuses search; visible :focus-visible rings in styles.css."
      artifact_refs:
        - .prax/design/sessions/ds_20260908180630_9c7f4b24/validation-evidence/run-dom-follow.html
        - app.js
        - styles.css
      measurement_receipt: validation-evidence/measurement-receipt.json
    - check_id: hierarchy_review
      outcome: pass
      source: headless Edge screenshots 01-04
      notes: "Prominence follows SDIR importance: map dominant (~75% width), inspector subordinate fixed 344px, trailbar/topbar quiet strips; during follow the trail layer is highest-contrast (accent cyan 3px) while the dimmed whole remains readable in place."
      artifact_refs:
        - evidence/01-initial.png
        - evidence/02-follow-trail.png
        - evidence/03-impact.png
        - evidence/04-deps-closure.png
    - check_id: representation_decided
      outcome: pass
      source: committed SDIR 0.2 + screenshot 01
      notes: Committed SDIR 0.2 declares screen.representation.primary = graph with non-empty reason; delivered artifact is the SVG node-link map (24 nodes, 40 directed typed edges, tiered layout).
      artifact_refs:
        - evidence/01-initial.png
    - check_id: state_ownership_declared
      outcome: pass
      source: committed SDIR 0.2 + app.js source
      notes: "Committed SDIR 0.2 declares state_ownership with both selection (owner = primary region) and preview (owner = session). Implementation consistent: selection/focus in one app-store state object; hover preview owned by the map tooltip; search input owns query."
      artifact_refs:
        - .prax/design/sessions/ds_20260908180630_9c7f4b24/validation-evidence/run-dom-follow.html
    - check_id: acceptance_contract_present
      outcome: pass
      source: committed SDIR 0.2
      notes: Committed SDIR 0.2 carries screen.acceptance = [primary_success_definition] ending 关系跟随不丢失全局上下文.
      artifact_refs: []
    - check_id: complexity_budget_declared
      outcome: pass
      source: committed SDIR 0.2
      notes: Committed SDIR 0.2 declares screen.complexity_budget (permanent_panels 3, permanent_primary_actions 3, modes 1, state_owners 3, navigation_levels 1, persistent_filters 1, new_semantic_concepts 2, keyboard_contracts 1, mobile_conflicts 0, permanent_surfaces 1); delivered page matches.
      artifact_refs: []
    - check_id: requirement_alignment
      outcome: pass
      source: headless Edge evidence suite over file:// URLs
      notes: "Static open proven (all captures over file://, no server/build/CDN); usable at load (first paint is the ready graph; body.state-ready at parse; loading unreachable by design); multi-hop dependency and influence following with global context preserved (02: 4-hop trail, whole web dimmed in place, '路径 4 节点清晰 / 全图 24 服务 · 保持原位可见'; 03: 影响面 4 dependents; 04: 依赖闭包 14/24); single screen; greenfield vanilla JS; no backend/deployment. Two defects found and fixed during evidence capture in this workspace, re-verified after fix (closure direction; hidden-attribute override)."
      artifact_refs:
        - evidence/01-initial.png
        - evidence/02-follow-trail.png
        - evidence/03-impact.png
        - evidence/04-deps-closure.png
        - evidence/06-error-state.png
