representation_portfolio:
  primary:
    type: graph
    reason: "Relationships ARE the content: a node-link map renders every dependency as directional, typed content and lets the user follow chains spatially while the whole stays in view — the only representation where multi-hop follow cannot lose global context"
  supporting:
    - type: architecture
      reason: tiered left→right layout doubles as an architecture diagram, giving the medium hierarchy a stable, conventional backbone
    - type: search_results
      reason: search box locates a service among many and selects it on the map without navigating away
  rejected:
    - option: table/list of edges
      reason: "high relationality: pairwise rows destroy the web structure; following multi-hop chains requires re-query per hop with no global anchor"
    - option: tree
      reason: medium hierarchy is a facet, not the content; a tree forces single-parent structure onto a graph with fan-out and fan-in
state_ownership:
  - state: selection
    owner: The whole web — every service and every dependency edge always visible (global-context anchor)
  - state: preview
    owner: session
acceptance:
  - From any service, the user can follow multi-hop dependency and influence chains, reading each relationship along the way, while the complete system map stays visible with their current position and trail marked in it — 关系跟随不丢失全局上下文.
