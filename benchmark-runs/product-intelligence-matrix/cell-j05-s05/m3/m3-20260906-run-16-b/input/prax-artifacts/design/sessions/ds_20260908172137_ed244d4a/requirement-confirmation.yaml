restatement: "Build a single-page web app whose core job is understanding a relational structure: the user must be able to follow dependencies and influence (multi-hop, traversing relationships) without ever losing global context of the whole web. Relationships themselves are first-class content. Deliverable: a static, locally-openable single-screen SPA (root index.html or dist/), initial data inlined so the first screen is immediately usable with no loading state; no backend, accounts, persistence, or deployment. Scale cap: one main screen. Budget: ≤90 min wall-clock, ≤1.2M tokens."
boundaries:
  in_scope:
    - Single-page web app, one main screen, greenfield code in this empty workspace
    - Interactive relational-web view where relationships are first-class content
    - Following dependencies and influence (multi-hop traversal) while preserving global context of the full web
    - Initial dataset inlined at page load; page usable immediately, no loading state
    - Static open via root index.html or dist/ build; runs locally, no external services or deployment
  out_of_scope:
    - Backend, account system, persistence services, deployment to external services
    - Multiple screens/pages beyond the single main screen
    - Editing/mutating the relational data (understand-only job)
    - Comparison features, time/history views
