<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Open Collection — Natural History Index</title>
  <meta name="description" content="Locate any record in the open natural history collection within three interactions — search and facet filters that never lose your context.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%231e6f5c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f6f4ee'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header" id="collection-header">
    <h1 class="brand">The Open Collection<span class="accent-dot">.</span></h1>
    <span class="subtitle">Natural History Index</span>
    <span class="totals" id="header-totals"></span>
  </header>

  <main class="shell" id="workspace">
    <!-- Filter rail: facet filters with live per-option counts -->
    <nav class="filter-rail" id="filter-rail" aria-label="Filters"></nav>

    <!-- Center: task-first search, active-constraint bar, grouped results -->
    <section class="center" aria-label="Search and results">
      <div class="workbar">
        <div class="search-row">
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>
            <input id="search-input" type="search" autocomplete="off" spellcheck="false"
                   placeholder="Search records by name, catalog number, tag, locality…"
                   aria-label="Search the collection">
          </div>
          <span class="kbd-hint" id="kbd-hint" aria-hidden="true">/</span>
        </div>
        <div class="context-row" id="context-row">
          <!-- constraint chips + live total rendered here -->
        </div>
      </div>

      <div class="results" id="results" role="region" aria-label="Results">
        <!-- grouped, count-labeled results render here -->
      </div>
    </section>

    <!-- Detail: selection-bound contextual inspector -->
    <aside class="detail-panel" id="detail-panel" aria-label="Item detail" hidden>
      <!-- selected record renders here -->
    </aside>
  </main>

  <noscript>
    <p style="padding:24px;font-family:sans-serif">The index needs JavaScript to search the inlined collection. No network connection is used.</p>
  </noscript>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
