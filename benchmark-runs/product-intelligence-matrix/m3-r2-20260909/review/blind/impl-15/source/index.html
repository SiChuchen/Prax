<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structura · 结构文档工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234a5fc7'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='serif'%3E构%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="split">

  <!-- ============ 顶栏（Application Shell：稳定身份 + 工具 + 结构健康度） ============ -->
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">构</span>
      <div class="brand-text">
        <div class="brand-name">Structura</div>
        <div class="brand-sub">结构文档工作台</div>
      </div>
    </div>

    <input id="docTitle" class="doc-title" spellcheck="false" aria-label="文档标题" placeholder="未命名文档">

    <button id="healthPill" class="pill ok" type="button" title="结构检查结果，点击定位到「结构检查」面板">结构完好</button>

    <div class="seg" role="group" aria-label="视图切换">
      <button type="button" data-v="edit" id="viewEdit">编辑</button>
      <button type="button" data-v="split" id="viewSplit" class="on">分屏</button>
      <button type="button" data-v="preview" id="viewPreview">预览</button>
    </div>

    <div class="toolbar">
      <button id="undoBtn" class="btn iconbtn" type="button" title="撤销 (Ctrl+Z)" aria-label="撤销">↶</button>
      <button id="redoBtn" class="btn iconbtn" type="button" title="重做 (Ctrl+Shift+Z)" aria-label="重做">↷</button>
      <details class="menu" id="exportMenu">
        <summary class="btn" aria-label="导出文档">导出 ▾</summary>
        <div class="menu-pop">
          <button type="button" id="exportMd">Markdown（.md）</button>
          <button type="button" id="exportHtml">网页（.html）</button>
        </div>
      </details>
      <button id="resetBtn" class="btn" type="button" title="恢复为内置示例（可撤销）">重置示例</button>
    </div>
  </header>

  <!-- ============ 工作区（大纲 · 结构化编辑 · 实时预览） ============ -->
  <main class="workspace">

    <aside class="pane pane-side" aria-label="大纲与结构检查">
      <section class="side-sec">
        <h2 class="side-title">大纲</h2>
        <nav id="outline" aria-label="文档大纲"></nav>
      </section>
      <section class="side-sec side-diags" id="diagSection">
        <h2 class="side-title">结构检查 <span id="diagCount" class="count"></span></h2>
        <div id="diags"></div>
      </section>
    </aside>

    <section class="pane pane-editor" aria-label="结构化编辑">
      <div class="pane-head">
        <span>结构化编辑</span>
        <span class="pane-hint">Enter 新建块 · Tab 调层级 · Alt+↑↓ 移动</span>
      </div>
      <div id="editor" class="editor" role="list"></div>
    </section>

    <section class="pane pane-preview" aria-label="实时预览">
      <div class="pane-head pane-head-paper">
        <span>实时预览</span>
        <span id="syncChip" class="sync-chip"><span class="pulse-dot"></span>与编辑实时同步</span>
      </div>
      <article id="preview" class="preview"></article>
    </section>

  </main>

  <!-- ============ 状态条 ============ -->
  <footer class="statusbar">
    <span id="stats">—</span>
    <span class="keys">Ctrl+Z 撤销 · Ctrl+Shift+Z 重做 · Alt+↑↓ 移动块</span>
    <span id="saveTime" class="save-time"></span>
  </footer>

  <!-- 块类型插入菜单 / 提示条 -->
  <div id="typeMenu" class="type-menu" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
