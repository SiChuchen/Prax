<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataAtlas · Open Dataset Registry</title>
<meta name="description" content="Locate any dataset in a large open collection — instant search, live facet counts, and context-preserving navigation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='8' height='8' rx='2' fill='%233b5bdb'/%3E%3Crect x='13' y='3' width='8' height='8' rx='2' fill='%239aa8e8'/%3E%3Crect x='3' y='13' width='8' height='8' rx='2' fill='%239aa8e8'/%3E%3Crect x='13' y='13' width='8' height='8' rx='2' fill='%233b5bdb'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2" opacity=".5"/><rect x="3" y="13" width="8" height="8" rx="2" opacity=".5"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
    <span class="brand-name">DataAtlas</span>
    <span class="brand-sub">Open Dataset Registry</span>
  </div>
  <div class="searchwrap">
    <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Zm5.8 9.9 4.4 4.4-1.4 1.4-4.4-4.4 1.4-1.4Z"/></svg>
    <input id="search" type="search" placeholder="Search datasets — name, publisher, tag…" autocomplete="off" spellcheck="false" aria-label="Search datasets">
    <kbd title="Press / to search">/</kbd>
  </div>
  <div class="topstats" id="topstats"></div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Collections and filters"></aside>

  <main class="main" id="main">
    <div class="contextbar">
      <nav class="crumb" id="crumb" aria-label="Location in catalog"></nav>
      <div class="context-right">
        <span class="count" id="count" role="status"></span>
        <label class="sortlab" for="sort">Sort</label>
        <select id="sort">
          <option value="relevance">Relevance</option>
          <option value="downloads">Most accessed</option>
          <option value="updated">Recently updated</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
    </div>

    <div class="chips" id="chips" hidden></div>

    <div class="grid" id="grid" role="list" aria-label="Datasets"></div>

    <div class="empty" id="empty" hidden>
      <p class="empty-title">No datasets match</p>
      <p class="empty-hint">Try fewer or different words, or clear the active filters.</p>
      <button class="btn" id="emptyReset">Clear search &amp; filters</button>
    </div>
  </main>
</div>

<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
