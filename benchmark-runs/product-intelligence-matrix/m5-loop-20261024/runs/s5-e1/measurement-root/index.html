<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ExoLens — 系外行星多维探索台：维度切换不重置认知的多维数据探索工作台（cell-j13-s10 explore × dimensional-space）">
<title>ExoLens · 系外行星多维探索台</title>
<style>
/* ---------- tokens（dataviz 参考色板 · dark 表面 #1a1a19） ---------- */
:root {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --raise: #242423;
  --raise-hover: #2e2e2c;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #9a988f;
  --grid: #2c2c2a;
  --axis: #383835;
  --hairline: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-ink: #9ec5f4;
  --accent-tint: rgba(57, 135, 229, 0.16);
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--page);
  color: var(--ink);
  font: 12px/1.45 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
}
button, select, input { font: inherit; color: var(--ink-2); }
button {
  background: var(--raise);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 3px 10px;
  min-height: 24px;
  cursor: pointer;
}
button:hover:not(:disabled) { background: var(--raise-hover); color: var(--ink); }
button:disabled { background: #1f1f1e; color: #93928c; border-color: rgba(255, 255, 255, 0.07); cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num, .val-count, .legend-count, .mini-n, td, .kv .v { font-variant-numeric: tabular-nums; }

/* ---------- 顶栏 ---------- */
#dataset-bar {
  display: flex; align-items: center; gap: 16px;
  padding: 6px 12px;
  border-bottom: 1px solid var(--hairline);
  background: var(--surface);
}
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand h1 { font-size: 14.5px; margin: 0; letter-spacing: 0.2px; }
.brand .sub { font-size: 11px; color: var(--muted); font-weight: 400; }
.bar-stats { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; }
.stat { font-size: 11.5px; color: var(--ink-2); }
.stat strong { color: var(--ink); }
.stat.ctx {
  border: 1px solid rgba(57, 135, 229, 0.55);
  background: #203a5e;
  color: #ffffff;
  border-radius: 999px;
  padding: 2px 10px;
}
#ctx-flash {
  font-size: 11px; color: #0ca30c; font-weight: 600;
  border: 1px solid rgba(12, 163, 12, 0.4); border-radius: 4px; padding: 1px 8px;
}
.bar-actions { display: flex; gap: 6px; align-items: center; }
.hint-kbd { font-size: 10.5px; color: var(--muted); margin-right: 4px; }
#err-banner {
  background: #d03b3b; color: #fff; font-weight: 600; font-size: 12px;
  padding: 6px 12px;
}

/* ---------- 主区 ---------- */
main {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: 246px minmax(0, 1fr) 270px;
  background: var(--page);
}
aside, section { background: var(--surface); min-height: 0; }

/* 维度架 */
#dimension-shelf { overflow-y: auto; padding: 6px; border-right: 1px solid var(--hairline); }
.shelf-title {
  font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px;
  margin: 8px 4px 4px;
}
.dim-head {
  display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 6px;
  padding: 5px 8px; margin: 1px 0; border-color: transparent; background: transparent; text-align: left;
  min-height: 26px;
}
.dim-head:hover { background: var(--raise); }
.dim-name { font-size: 12px; color: var(--ink); }
.dim-meta { display: inline-flex; gap: 4px; }
.badge {
  font-size: 10px; border-radius: 999px; padding: 0 6px; line-height: 14px;
  border: 1px solid var(--hairline); color: var(--muted); white-space: nowrap;
}
.filter-badge { background: var(--accent-tint); border-color: transparent; color: var(--accent-ink); }
.dim-body { margin: 0 4px 6px 10px; padding: 4px 0 6px 8px; border-left: 2px solid var(--grid); }
.dim-tools { display: flex; gap: 4px; margin-bottom: 6px; }
.dim-tools button { padding: 1px 8px; font-size: 11px; min-height: 24px; }
.dim-tools button.on { background: var(--accent-tint); color: var(--accent-ink); border-color: rgba(57, 135, 229, 0.5); }
.val-list { display: flex; flex-direction: column; gap: 1px; }
.val-btn {
  display: flex; align-items: center; gap: 6px; width: 100%;
  background: transparent; border: none; border-radius: 3px;
  padding: 2px 4px; min-height: 24px; font-size: 11.5px; text-align: left; color: var(--ink-2);
}
.val-btn:hover { background: var(--raise); }
.val-btn .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.val-btn .val-count { margin-left: auto; color: var(--muted); font-size: 10.5px; }
.val-btn.off { color: var(--muted); }
.val-btn.off .name { text-decoration: line-through; }
.range-ctrl { display: flex; flex-direction: column; gap: 4px; }
.range-nums { display: flex; align-items: center; gap: 6px; }
.range-nums input { width: 78px; min-height: 24px; background: var(--raise); border: 1px solid var(--hairline); border-radius: 4px; padding: 2px 6px; font-size: 11.5px; }
.range-sep { color: var(--muted); }
.range-ctrl .rg { accent-color: var(--accent); height: 24px; margin: 0; }

/* 投影通道条：全宽一行，位于画布与维度架之上（图例同行内联） */
#channel-strip {
  display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap;
  padding: 5px 12px; border-bottom: 1px solid var(--hairline);
  background: var(--surface);
}
#channel-strip label { font-size: 11px; color: var(--muted); }
#channel-strip select {
  background: var(--raise); border: 1px solid var(--hairline); border-radius: 4px;
  padding: 3px 6px; min-height: 24px; font-size: 12px; max-width: 150px;
}
#legend { display: flex; align-items: center; gap: 2px 10px; flex-wrap: wrap; min-width: 0; }
#legend .legend-title { font-size: 10.5px; color: var(--muted); }
#legend .legend-ramp { width: 110px; height: 8px; border-radius: 2px; background: linear-gradient(90deg, #184f95, #cde2fb); }
#legend .legend-range { display: flex; gap: 6px; font-size: 10px; color: var(--muted); }
.spacer { flex: 1; }
/* 空态条：流内反馈，不遮画布 */
#empty-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 7px 12px; background: #20221f; border-bottom: 1px solid var(--hairline);
}
#empty-bar .empty-title { font-size: 12.5px; font-weight: 600; color: var(--ink); }
#empty-bar p { margin: 0; font-size: 11.5px; color: var(--ink-2); }
#empty-bar .empty-actions { margin-left: auto; display: flex; gap: 8px; }
/* 画布区 */
#data { min-width: 0; border-right: 1px solid var(--hairline); display: flex; flex-direction: column; }
#canvas-wrap { position: relative; flex: 1; min-height: 0; }
#canvas-wrap.tv-open #plot { display: none; }
#plot { position: absolute; inset: 0; touch-action: none; }
#plot:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#legend .legend-row {
  display: flex; align-items: center; gap: 6px;
  background: transparent; border: none; border-radius: 3px; padding: 1px 3px;
  min-height: 24px; font-size: 11.5px; text-align: left;
}
.legend-row:hover { background: var(--raise); }
.legend-row .legend-name { color: var(--ink-2); }
.legend-row .legend-count { margin-left: auto; color: var(--muted); font-size: 10.5px; }
.legend-row.off .legend-name { color: var(--muted); text-decoration: line-through; }
.legend-ramp { height: 10px; border-radius: 2px; background: linear-gradient(90deg, #184f95, #cde2fb); }
.legend-range { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
#tooltip {
  position: absolute; z-index: 30; pointer-events: none;
  background: rgba(36, 36, 35, 0.96); border: 1px solid var(--hairline); border-radius: 4px;
  padding: 5px 8px; font-size: 11px; color: var(--ink-2);
  display: grid; gap: 1px; max-width: 250px;
}
#tooltip strong { color: var(--ink); font-size: 11.5px; }
#table-view { position: absolute; inset: 0; z-index: 25; background: var(--surface); display: flex; flex-direction: column; }
.tv-head { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--hairline); font-size: 11.5px; color: var(--ink-2); }
.tv-head strong { color: var(--ink); }
.tv-head button { margin-left: auto; padding: 1px 8px; font-size: 11px; }
.tv-scroll { overflow: auto; flex: 1; }
.tv-scroll table { border-collapse: collapse; font-size: 11px; }
.tv-scroll th {
  position: sticky; top: 0; background: var(--raise); color: var(--ink-2);
  padding: 3px 8px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--axis);
}
.tv-scroll td { padding: 2px 8px; border-bottom: 1px solid var(--grid); color: var(--ink-2); white-space: nowrap; }
.tv-scroll td.tc { color: var(--accent-ink); }
.tv-scroll .tn { color: var(--ink); }

/* 检查器 */
#detail { overflow-y: auto; padding: 10px 12px; }
.detail-empty { margin-top: 42px; text-align: center; color: var(--muted); font-size: 11.5px; }
.detail-empty-title { font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-bottom: 8px; }
.detail-hint { color: var(--muted); font-size: 10.5px; }
.detail-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.detail-name { font-size: 14px; font-weight: 700; }
.detail-host { font-size: 11px; color: var(--muted); }
.detail-tags { display: flex; gap: 4px; margin: 4px 0 8px; flex-wrap: wrap; }
.tag { font-size: 10.5px; border: 1px solid var(--hairline); border-radius: 999px; padding: 0 7px; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 8px; padding: 3.5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 11.5px; }
.kv .k { color: var(--muted); }
.kv .v { color: var(--ink); text-align: right; }
.detail-sub { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 12px 0 4px; }
.sib {
  display: block; width: 100%; text-align: left; margin-bottom: 3px;
  background: transparent; font-size: 11.5px; padding: 3px 8px; min-height: 24px; color: var(--accent-ink);
}
.mini-row { display: grid; grid-template-columns: 64px 1fr 26px; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 11px; }
.mini-label { color: var(--ink-2); }
.mini-bar { background: var(--grid); border-radius: 2px; height: 10px; overflow: hidden; display: block; }
.mini-bar span { display: block; height: 100%; }
.mini-n { color: var(--muted); text-align: right; }
.detail-names { font-size: 11.5px; color: var(--ink-2); line-height: 1.6; }

/* 状态轨迹 */
#state-trail {
  background: var(--surface);
  border-top: 1px solid var(--hairline);
  display: flex; flex-direction: column;
  height: 78px; flex: none;
}
.trail-head { display: flex; align-items: baseline; gap: 10px; padding: 5px 12px 0; font-size: 11px; color: var(--muted); }
.trail-head strong { color: var(--ink-2); font-size: 11.5px; }
.trail-hint { margin-left: auto; font-size: 10.5px; color: var(--muted); }
#trail-chips { display: flex; gap: 6px; align-items: flex-start; overflow-x: auto; padding: 6px 12px 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  background: #1f1f1e; border: 1px solid var(--hairline); border-radius: 999px;
  padding: 2px 10px 2px 8px; min-height: 24px; font-size: 11px;
}
.chip:hover { background: var(--raise); }
.chip-kind { font-weight: 700; font-size: 10px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.chip-kind::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: var(--muted); }
.chip.kind-filter .chip-kind::before, .chip.kind-filterClear .chip-kind::before { background: var(--c1); }
.chip.kind-projection .chip-kind::before { background: var(--c2); }
.chip.kind-select .chip-kind::before { background: var(--c3); }
.chip-text { color: var(--ink-2); }
.chip-src { color: var(--muted); font-size: 10px; border-left: 1px solid var(--hairline); padding-left: 6px; }
.chip.future { opacity: 0.62; border-style: dashed; }
.chip.disabled .chip-text { text-decoration: line-through; }
.chip-dis { color: #fab219; font-size: 10px; }
#chip-pop {
  position: fixed; z-index: 60; width: 330px;
  background: var(--raise); border: 1px solid var(--hairline); border-radius: 6px;
  padding: 10px 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}
.pop-title { font-weight: 700; font-size: 12px; margin-bottom: 6px; color: var(--ink); }
.pop-actions { display: flex; gap: 6px; margin-top: 10px; }

/* 滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--axis); border-radius: 5px; border: 2px solid var(--surface); }
::-webkit-scrollbar-track { background: transparent; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>

<script>
/* ================= 内联数据集（确定性生成，seed=20260902，同步执行，首屏即就绪） ================= */
window.EXO_DATA = (function () {
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(20260902);
  function R() { return rnd(); }
  function ri(lo, hi) { return lo + Math.floor(rnd() * (hi - lo + 1)); }
  function rf(lo, hi) { return lo + rnd() * (hi - lo); }
  function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
  function r2(v) { return Math.round(v * 100) / 100; }
  var METHODS = ['凌星法', '视向速度法', '凌星时间变幅法', '微引力透镜法', '直接成像法', '天体测量法'];
  var METHOD_W = [0.44, 0.24, 0.08, 0.06, 0.10, 0.08];
  var STARS = ['M型', 'K型', 'G型', 'F型', 'A型'];
  var STAR_W = [0.40, 0.22, 0.21, 0.12, 0.05];
  var MISSIONS = [
    { name: 'Kepler', y0: 2009, y1: 2013, dist: [200, 1600] },
    { name: 'K2', y0: 2014, y1: 2018, dist: [40, 900] },
    { name: 'TESS', y0: 2018, y1: 2025, dist: [20, 640] },
    { name: 'CoRoT', y0: 2007, y1: 2012, dist: [150, 1200] },
    { name: '地基巡天', y0: 2004, y1: 2025, dist: [10, 2600] }
  ];
  var MISSION_W = [0.34, 0.12, 0.28, 0.05, 0.21];
  var CLASSES = ['类地', '超级地球', '海王星级', '木星级'];
  var SUFFIX = ['b', 'c', 'd', 'e', 'f', 'g'];
  function pickW(values, weights) {
    var x = rnd(), acc = 0;
    for (var i = 0; i < values.length; i++) { acc += weights[i]; if (x < acc) return values[i]; }
    return values[values.length - 1];
  }
  var usedStars = {};
  function makeStar(mission) {
    for (var tries = 0; tries < 200; tries++) {
      var name;
      if (mission === 'Kepler') name = 'Kepler-' + ri(4, 1900);
      else if (mission === 'K2') name = 'K2-' + ri(1, 400);
      else if (mission === 'TESS') name = 'TOI-' + ri(2, 860);
      else if (mission === 'CoRoT') name = 'CoRoT-' + ri(1, 36);
      else name = (R() < 0.5 ? 'HD ' + ri(2000, 220000) : 'GJ ' + ri(1, 1210));
      if (!usedStars[name]) { usedStars[name] = 1; return name; }
    }
    return mission + '-' + ri(10000, 99999);
  }
  function starTemp(type) {
    var t = { 'M型': [2500, 3800], 'K型': [3900, 5200], 'G型': [5300, 5900], 'F型': [6000, 7200], 'A型': [7500, 9800] }[type];
    return rf(t[0], t[1]);
  }
  var records = [], id = 0, N = 480;
  while (records.length < N) {
    var mission = pickW(MISSIONS, MISSION_W);
    var host = makeStar(mission.name);
    var nPlanets = R() < 0.30 ? ri(2, 3) : 1;
    var starType = pickW(STARS, STAR_W);
    var tStar = starTemp(starType);
    var metal = r2(Math.max(-0.62, Math.min(0.55, rf(-0.32, 0.26) + (rnd() < 0.18 ? rf(0.08, 0.3) : 0))));
    var year = ri(mission.y0, mission.y1);
    for (var p = 0; p < nPlanets && records.length < N; p++) {
      var pclass = pickW(CLASSES, [0.30, 0.22, 0.27, 0.21]);
      var radius = {
        '类地': rf(0.42, 1.55), '超级地球': rf(1.55, 3.1),
        '海王星级': rf(3.1, 6.9), '木星级': Math.exp(rf(Math.log(6.9), Math.log(15.5)))
      }[pclass];
      var logp = rf(Math.log(0.8), Math.log(3200));
      if (pclass === '木星级' && R() < 0.35) logp = rf(Math.log(1.2), Math.log(30));

        ctx.beginPath(); ctx.arc(kp.x, kp.y, kp.r + 7.5, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    if (UI.brush && UI.brush.active) {
      var b = UI.brush;
      var x0 = Math.min(b.x0, b.x1), y0 = Math.min(b.y0, b.y1);
      ctx.fillStyle = 'rgba(57,135,229,0.12)';
      ctx.fillRect(x0, y0, Math.abs(b.x1 - b.x0), Math.abs(b.y1 - b.y0));
      ctx.setLineDash([4, 3]);
      ctx.strokeStyle = '#3987e5'; ctx.lineWidth = 1;
      ctx.strokeRect(x0, y0, Math.abs(b.x1 - b.x0), Math.abs(b.y1 - b.y0));
      ctx.setLineDash([]);
    }
    canvas.setAttribute('aria-label', '散点投影：X=' + DIMS[ch.x].label + '，Y=' + DIMS[ch.y].label + '，颜色=' + DIMS[ch.color].label + '，尺寸=' + DIMS[ch.size].label + '；可见 ' + visible.length + ' 条，选中 ' + (selSet ? selSet.size : 0) + ' 条');
  }

  /* ---------- 区域渲染 ---------- */
  function renderChannelBar(st) {

        }).join('');

        sel.addEventListener('change', function () { opProjection(channel, sel.value, 'channel'); });
      }
      if (document.activeElement !== sel) sel.value = st.ch[channel];
    });
    var selN = (st.sel || []).length;

  function renderShelf(st) {

  function renderLegend(st, visible) {

  function swatchSvg(shape, color) {
    if (shape === 'circle') return '<circle cx="7" cy="7" r="4.4" fill="' + color + '" stroke="#1a1a19" stroke-width="1"/>';
    if (shape === 'square') return '<rect x="2.6" y="2.6" width="8.8" height="8.8" fill="' + color + '" stroke="#1a1a19" stroke-width="1"/>';
    if (shape === 'triangle') return '<path d="M7 1.8 L12.6 11.6 L1.4 11.6 Z" fill="' + color + '" stroke="#1a1a19" stroke-width="1"/>';
    if (shape === 'diamond') return '<path d="M7 1.4 L12.4 7 L7 12.6 L1.6 7 Z" fill="' + color + '" stroke="#1a1a19" stroke-width="1"/>';
    if (shape === 'cross') return '<path d="M3 3 L11 11 M11 3 L3 11" stroke="' + color + '" stroke-width="2.2" fill="none"/>';
    return '<circle cx="7" cy="7" r="4" fill="none" stroke="' + color + '" stroke-width="2.4"/>';

  function renderInspector(st) {
    var box = $('detail');

          '<span class="detail-host">' + host + '</span></div>' +
          '<div class="detail-tags"><span class="tag">' + rec.ms + '</span><span class="tag">' + instrumentOf(rec) + '</span></div>' +

        Array.prototype.forEach.call(box.querySelectorAll('button.sib'), function (btn) {
          btn.addEventListener('click', function () { opSelect([+btn.dataset.id], 'inspector', '选中'); });

      var maxC = 1;

          '<span class="mini-n">' + n + '</span></div>';

      box.innerHTML = '<div class="detail-head"><span class="detail-name">已选 ' + sel.length + ' 条</span></div>' +
        bars +

        '<div class="detail-hint">可用「框选转过滤」把选区固化为 X/Y 范围过滤。</div>';
      }

  /* 重建容器内容但保住焦点：记录活动元素的 focusKey，重建后重新聚焦同键元素 */
  function rebuildWithFocus(container, build) {
    var active = document.activeElement;
    var key = active && container.contains(active) ? active.dataset.focusKey : null;
    build();
    if (key) {
      var t = container.querySelector('[data-focus-key="' + key + '"]');
      if (t) t.focus();
    }
  }
  function renderTrail() {
    var box = $('trail-chips');

      box.textContent = '';
      state.ops.forEach(function (op, i) {
        var past = i <= state.pointer;
        var chip = el('button', 'chip kind-' + op.type + (past ? '' : ' future') + (op.disabled ? ' disabled' : ''));
        chip.dataset.opId = op.id;

        var kindTxt = { filter: '过滤', filterClear: '过滤', projection: '投影', select: '选中' }[op.type];
        chip.appendChild(el('span', 'chip-kind', kindTxt));
        chip.appendChild(el('span', 'chip-text', op.phrase));
        chip.appendChild(el('span', 'chip-src', sourceLabel(op.source)));
        if (op.disabled) chip.appendChild(el('span', 'chip-dis', '已禁用'));
        box.appendChild(chip);

    });
    $('trail-count').textContent = state.ops.length ? ('第 ' + (state.pointer + 1) + ' / ' + state.ops.length + ' 步') : '尚无操作';
    $('btn-undo').disabled = state.pointer < 0;

  function renderStats(st, visible) {

  /* ---------- 主渲染 ---------- */
  var rafPending = false;
  function render() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      var st = replay(state.pointer);
      var visible = RECORDS.filter(function (r) { return matchesFilters(r, st.filters); });
      var selSet = new Set(st.sel || []);
      drawPlot(st, visible, selSet);
      if (UI.kcursor != null && !pts.some(function (p) { return p.id === UI.kcursor; })) UI.kcursor = null;
      renderChannelBar(st);

  /* ---------- 画布交互 ---------- */
  function bindCanvas() {
    function pos(ev) {
      var rect = canvas.getBoundingClientRect();
      return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
    }
    function nearest(p, maxDist) {
      var best = null, bd = maxDist * maxDist;
      pts.forEach(function (pt) {
        var dx = pt.x - p.x, dy = pt.y - p.y, d2 = dx * dx + dy * dy;
        if (d2 <= bd) { best = pt; bd = d2; }
      });
      return best;
    }
    function tipHtml(r) {
      var st = replay(state.pointer);
      return '<strong>' + r.n + '</strong><span>' + hostOf(r.n) + ' · ' + r.ms + '</span>' +
        '<span>' + DIMS[st.ch.x].label + ' ' + withUnit(r[st.ch.x], st.ch.x) + ' · ' + DIMS[st.ch.y].label + ' ' + withUnit(r[st.ch.y], st.ch.y) + '</span>' +
        '<span>' + DIMS[st.ch.color].label + '：' + r[st.ch.color] + '</span>';
    }
    function placeTip(tip, hit) {
      var tw = tip.offsetWidth, thh = tip.offsetHeight;
      tip.style.left = Math.min(wrap.clientWidth - tw - 8, Math.max(4, hit.x + 12)) + 'px';
      tip.style.top = Math.min(wrap.clientHeight - thh - 8, Math.max(4, hit.y - thh - 10)) + 'px';
    }
    var down = null;
    canvas.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0) return;
      var p = pos(ev);
      down = { x0: p.x, y0: p.y, moved: false };
      try { canvas.setPointerCapture(ev.pointerId); } catch (e) { }
    });
    canvas.addEventListener('pointermove', function (ev) {
      var p = pos(ev);
      if (down) {
        if (Math.abs(p.x - down.x0) + Math.abs(p.y - down.y0) > 6) down.moved = true;
        if (down.moved) {
          UI.brush = { active: true, x0: down.x0, y0: down.y0, x1: p.x, y1: p.y };
          $('tooltip').hidden = true;
          render();
        }
        return;
      }
      var hit = nearest(p, 9);
      var newHover = hit ? hit.id : null;
      var tip = $('tooltip');
      if (newHover !== UI.hoverId) {
        UI.hoverId = newHover;
        canvas.style.cursor = hit ? 'pointer' : 'default';
        if (hit) { tip.innerHTML = tipHtml(hit.rec); tip.hidden = false; placeTip(tip, hit); }
        else tip.hidden = true;
        render();
      } else if (hit) {
        tip.innerHTML = tipHtml(hit.rec);
      }
    });
    canvas.addEventListener('pointerup', function (ev) {
      if (!down) return;
      var p = pos(ev);
      var wasMoved = down.moved;
      down = null;
      if (wasMoved && UI.brush && UI.brush.active) {
        var b = UI.brush;
        UI.brush = null;
        var x0 = Math.min(b.x0, b.x1), x1 = Math.max(b.x0, b.x1), y0 = Math.min(b.y0, b.y1), y1 = Math.max(b.y0, b.y1);
        var ids = pts.filter(function (pt) { return pt.x >= x0 && pt.x <= x1 && pt.y >= y0 && pt.y <= y1; })
          .map(function (pt) { return pt.id; });
        opSelect(ids, 'brush');
      } else if (!wasMoved) {
        var hit = nearest(p, 9);
        if (hit) opSelect([hit.id], 'click');
        else if ((replay(state.pointer).sel || []).length) opSelect([], 'click');
      }
      if (UI.brush) { UI.brush = null; render(); }
    });
    canvas.addEventListener('pointerleave', function () {
      $('tooltip').hidden = true;
      if (UI.hoverId != null) { UI.hoverId = null; render(); }
    });
    /* 键盘画布光标：方向键在可见点间移动，Enter 选中（主工作可键盘完成） */
    canvas.addEventListener('keydown', function (ev) {
      if (ev.key.indexOf('Arrow') === 0) {
        ev.preventDefault();
        moveCursor(ev.key);
      } else if (ev.key === 'Enter') {
        ev.preventDefault();
        if (UI.kcursor != null) opSelect([UI.kcursor], 'keyboard', '选中');
      } else if (ev.key === 'Escape') {
        if (UI.kcursor != null) { UI.kcursor = null; render(); }
      }
    });
  }
  function moveCursor(key) {
    if (!pts.length) { UI.kcursor = null; render(); return; }
    var cur = null, i;
    if (UI.kcursor != null) {
      for (i = 0; i < pts.length; i++) if (pts[i].id === UI.kcursor) { cur = pts[i]; break; }
    }
    if (!cur) { UI.kcursor = pts[Math.floor(pts.length / 2)].id; render(); return; }
    var horiz = key === 'ArrowRight' || key === 'ArrowLeft';
    var best = null, bestScore = Infinity;
    pts.forEach(function (p) {
      if (p.id === cur.id) return;
      var dx = p.x - cur.x, dy = p.y - cur.y;
      var fwd = key === 'ArrowRight' ? dx : key === 'ArrowLeft' ? -dx : key === 'ArrowDown' ? dy : -dy;
      if (fwd <= 1) return;
      var perp = horiz ? Math.abs(dy) : Math.abs(dx);
      var score = fwd + perp * 2;
      if (score < bestScore) { bestScore = score; best = p; }
    });
    if (best) { UI.kcursor = best.id; render(); }
  }

  /* ---------- 轨迹 chip 弹层：归属详情与回退 ---------- */
  var popReturnKey = null;
  function closePopover() {
    $('chip-pop').hidden = true;
    UI.popoverOpId = null;
    if (popReturnKey) {
      var t = $('trail-chips').querySelector('[data-focus-key="' + popReturnKey + '"]');
      if (t) t.focus();
      popReturnKey = null;
    }
  }
  function openPopover(opId, anchor) {
    var op = null, idx = -1;
    state.ops.forEach(function (o, i) { if (o.id === opId) { op = o; idx = i; } });
    if (!op) return;
    var pop = $('chip-pop');
    var past = idx <= state.pointer;
    var target = op.dim ? DIMS[op.dim].label + (op.channel ? '（' + channelName(op.channel) + ' 通道）' : '')
      : op.type === 'select' ? '选中集（' + op.ids.length + ' 条记录）' : '—';
    var value = '—';
    if (op.spec) value = op.spec.kind === 'values'
      ? (op.spec.values.length ? op.spec.values.join('、') : '（空集）')
      : fmtVal(op.spec.lo, op.dim) + ' – ' + fmtVal(op.spec.hi, op.dim);
    else if (op.type === 'select') value = op.ids.slice(0, 6).map(function (i) { return RECORDS[i].n; }).join('、') + (op.ids.length > 6 ? ' …' : '');
    else if (op.dim) value = DIMS[op.dim].label;
    var rows = [
      ['来源控件', sourceLabel(op.source)],
      ['操作类型', { filter: '过滤', filterClear: '清除过滤', projection: '投影通道', select: '选中集' }[op.type]],
      ['目标维度', target],
      ['取值', value],
      ['轨迹位置', '第 ' + (idx + 1) + ' 步 / 共 ' + state.ops.length + ' 步'],
      ['当前状态', op.disabled ? '已禁用（不参与过滤/选中）' : past ? '生效中' : '未来步骤（可前进到此）'],
    ];
    pop.innerHTML = '<div class="pop-title">' + op.phrase + '</div>' +
      rows.map(function (r) { return '<div class="kv"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>'; }).join('') +
      '<div class="pop-actions">' +
      (op.type === 'filter' || op.type === 'select' ? '<button data-act="toggle">' + (op.disabled ? '启用' : '禁用') + '</button>' : '') +
      (past ? '<button data-act="revert">回退到此步</button>' : '<button data-act="forward">前进到此步</button>') +
      '<button data-act="close">关闭</button></div>';
    pop.hidden = false;
    UI.popoverOpId = opId;
    popReturnKey = anchor.dataset.focusKey || null;
    var pr = pop.getBoundingClientRect();
    pop.style.left = Math.min(window.innerWidth - pr.width - 8, Math.max(8, anchor.getBoundingClientRect().left)) + 'px';
    pop.style.top = Math.max(8, anchor.getBoundingClientRect().top - pr.height - 8) + 'px';
    Array.prototype.forEach.call(pop.querySelectorAll('button'), function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var act = btn.dataset.act;
        if (act === 'toggle') { op.disabled = !op.disabled; render(); closePopover(); }
        else if (act === 'revert' || act === 'forward') { state.pointer = idx; render(); closePopover(); }
        else closePopover();
      });
    });
    var firstBtn = pop.querySelector('button');
    if (firstBtn) firstBtn.focus();
  }

  /* ---------- 全局事件 ---------- */
  function bindChrome() {
    $('btn-undo').addEventListener('click', function () { if (state.pointer >= 0) { state.pointer--; render(); } });
    $('btn-redo').addEventListener('click', function () { if (state.pointer < state.ops.length - 1) { state.pointer++; render(); } });
    $('btn-reset').addEventListener('click', function () { state.pointer = -1; render(); });
    $('btn-empty-undo').addEventListener('click', function () { if (state.pointer >= 0) { state.pointer--; render(); } });
    $('btn-empty-reset').addEventListener('click', function () { state.pointer = -1; render(); });
    $('btn-brush-filter').addEventListener('click', function () { opBrushToFilter(); });
    $('btn-clear-sel').addEventListener('click', function () { opSelect([], 'keyboard'); });
    $('btn-table').addEventListener('click', function () {
      UI.tableView = !UI.tableView;
      this.setAttribute('aria-pressed', String(UI.tableView));
      render();
    });
    $('trail-chips').addEventListener('click', function (ev) {
      var chip = ev.target.closest('.chip');
      if (!chip) return;
      if (UI.popoverOpId === chip.dataset.opId) { closePopover(); return; }
      openPopover(chip.dataset.opId, chip);
    });
    document.addEventListener('click', function (ev) {
      var pop = $('chip-pop');
      if (!pop.hidden && !pop.contains(ev.target) && !ev.target.closest('.chip')) closePopover();
    });
    document.addEventListener('keydown', function (ev) {
      var mod = ev.ctrlKey || ev.metaKey;
      if (mod && !ev.shiftKey && ev.key.toLowerCase() === 'z') {
        ev.preventDefault(); if (state.pointer >= 0) { state.pointer--; render(); }
      } else if (mod && ((ev.shiftKey && ev.key.toLowerCase() === 'z') || ev.key.toLowerCase() === 'y')) {
        ev.preventDefault(); if (state.pointer < state.ops.length - 1) { state.pointer++; render(); }
      } else if (ev.key === 'Escape') {
        if (!$('chip-pop').hidden) { closePopover(); return; }
        if (UI.brush) { UI.brush = null; render(); return; }
        if ((replay(state.pointer).sel || []).length) opSelect([], 'keyboard');
      }
    });
    window.addEventListener('resize', render);
    if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(wrap);
  }

  /* ---------- 初始化（全同步：数据内联生成于本文件，无任何加载等待） ---------- */
  try {
    document.body.dataset.appState = 'loading';
    canvas = $('plot'); ctx = canvas.getContext('2d'); wrap = $('canvas-wrap');
    if (!ctx) throw new Error('无法创建画布上下文');
    bindChrome();
    bindCanvas();
    render();
    document.body.dataset.appState = 'ready';
  } catch (err) {
    document.body.dataset.appState = 'error';
    var b = $('err-banner');
    b.hidden = false;
    b.textContent = '应用初始化失败：' + err.message;
  }
  window.addEventListener('error', function (ev) {
    document.body.dataset.appState = 'error';
    var b = $('err-banner');
    b.hidden = false;
    b.textContent = '运行时错误：' + (ev.message || '未知');
  });
})();
</script>
</body>
</html>
