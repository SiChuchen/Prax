plan_revision: 1
evidence:
  submitted_by: claude-agent (ExoLens implementer)
  collected_at: 2026-10-24T19:25:00Z
  items:
    - check_id: product_model_alignment
      outcome: pass
      source: implementation + prax browser measurement
      notes: 界面语言与结构与 Product Frame 一一对应：巡天目录（dataset，顶栏『快照 480 · 目录无界增长』）、维度架（12 维度=镜头）、投影（通道切换只写投影 owner）、过滤器、选中集、状态轨迹（归属 chips）。测量收据中的元素矩形显示画布为 dominant 区域（763×674）。
      artifact_refs:
        - validation-evidence/receipt-2026-10-24T18-59-39-498Z-49838fd2-5f47-48bc-a621-3a27de719517.json
      measurement_receipt: validation-evidence/receipt-2026-10-24T18-59-39-498Z-49838fd2-5f47-48bc-a621-3a27de719517.json
    - check_id: keyboard
      outcome: pass
      source: prax browser keyboard walk receipt + implementation
      notes: 收据为 Prax 对本应用的实测键盘走查（25 个焦点停靠点、missing_indicators 为空、双视口）。走查后仅做了两类改动：控件目标尺寸/禁用态配色（对比度与目标尺寸修复），以及把通道条+图例移出画布成为全宽条（控件平移，无焦点行为变化）。此外应用实现了：画布 tabindex=0 + 方向键键盘光标 + Enter 选中、Ctrl+Z/Ctrl+Y、Esc、焦点经 focusKey 在重渲染间保持。
      artifact_refs:
        - validation-evidence/receipt-2026-10-24T18-53-00-765Z-b79654f3-5892-4a96-93f1-cfb39c193f06.json
        - validation-evidence/receipt-2026-10-24T18-59-39-498Z-49838fd2-5f47-48bc-a621-3a27de719517.json
      measurement_receipt: validation-evidence/receipt-2026-10-24T18-59-39-498Z-49838fd2-5f47-48bc-a621-3a27de719517.json
    - check_id: hierarchy_review
      outcome: pass
      source: implementation + measured region rects
      notes: 视觉权重遵循 SDIR importance：data 画布 dominant（763×674 主区）；dimension_shelf 与 state_trail primary 常驻；dataset_bar supporting（muted 墨色顶栏）；detail contextual（选中驱动）。低 chrome、hairline 分隔。
      artifact_refs:
        - validation-evidence/receipt-2026-10-24T18-59-39-498Z-49838fd2-5f47-48bc-a621-3a27de719517.json
      measurement_receipt: validation-evidence/receipt-2026-10-24T18-59-39-498Z-49838fd2-5f47-48bc-a621-3a27de719517.json
    - check_id: filter_state
      outcome: pass
      source: implementation + prax browser run
      notes: 激活过滤显式呈现：维度行『n 值排除/范围』徽标、值按钮 aria-pressed、顶栏『可见 n/480』、上下文 pill、状态轨迹过滤 chips（来源+目标维度+取值）。收据轮次实际驱动过过滤与 0 结果空态。
      artifact_refs: []
      measurement_receipt: validation-evidence/receipt-2026-10-24T18-53-00-765Z-b79654f3-5892-4a96-93f1-cfb39c193f06.json
    - check_id: comparison_scan
      outcome: pass
      source: implementation + prax browser run
      notes: 全量散点概览 + 图例/维度架逐值计数 + 检查器类别构成小条形 + 表格视图（13 列，前 200 行）+ 悬停 tooltip，均可不打开单条记录完成扫读比较。
      artifact_refs: []
      measurement_receipt: validation-evidence/receipt-2026-10-24T18-59-39-498Z-49838fd2-5f47-48bc-a621-3a27de719517.json
    - check_id: destructive_recovery
      outcome: pass
      source: implementation + prax browser run
      notes: 无不可逆操作：单条禁用/启用、Ctrl+Z/Ctrl+Y、任意 chip 回退到此步、全部回退后仍可重做；0 结果空态提供『回退上一步/全部回退』（收据轮次实际驱动过该空态）；初始化与运行时错误有错误横幅（error 态）。
      artifact_refs: []
    - check_id: requirement_alignment
      outcome: pass
      source: implementation + prax browser measurements
      notes: 对照确认复述逐条核对：单页单屏静态直开、首屏即就绪（内联数据同步初始化）、维度切换不重置认知（投影 op 只写通道绑定 + 保留指示 + 上下文计数）、过滤/投影有归属且可回退（chips 三元组 + 三种回退粒度）。两轮测量暴露的对比度/目标尺寸/焦点序/画布碰撞失败项已全部修复，第三轮测量无失败反馈。
      artifact_refs:
        - validation-evidence/receipt-2026-10-24T18-53-00-765Z-b79654f3-5892-4a96-93f1-cfb39c193f06.json
        - validation-evidence/receipt-2026-10-24T18-59-39-498Z-49838fd2-5f47-48bc-a621-3a27de719517.json
