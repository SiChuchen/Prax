user_quote:
  - 动词：explore；对象：多维数据；成功标准：维度切换不重置认知
  - 判别：维度是主要认知负担（从单概念到无界数据），切换维度不重置认知。
  - 验收种子：过滤/投影状态有归属且可回退
restatement: 构建一个单页多维数据探索应用：用户在无界、高维、高密度数据集上探索，维度是主要认知杠杆；切换/重组维度（投影）时已有过滤、选中与上下文状态被保留并有明确归属，每一步过滤/投影可回退。首屏即用，静态打开，单屏交付。
