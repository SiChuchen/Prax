    reason: "单工作区产品，无多个持久区域；模式自述 does_not_apply_when: the product is a single workspace"
  - option: PAT-LIST-DETAIL(-INSPECTOR)
    reason: 路由已排除（task scope browse/inspect 不匹配 manage_lifecycle）；浏览检视语义无门控推进
