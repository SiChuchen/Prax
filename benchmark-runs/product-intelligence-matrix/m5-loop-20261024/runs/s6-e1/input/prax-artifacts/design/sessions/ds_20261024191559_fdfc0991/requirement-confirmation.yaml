version: "0.1"
user_quote:
  - 动词：complete；对象：高后果流程；成功标准：零失误走完全程
  - 判别：单一高后果流程，零失误走完全程、不可逆步骤有恢复/确认路径。
  - 验收种子：不可逆步骤有恢复/确认路径
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）；应用在页面加载完成时即处于可用状态（初始数据随首屏就绪，不得以加载态作为可测状态）
restatement: 构建一个单页 Web 应用：引导用户零失误走完一个高后果流程（workflow 对象）。流程为单一对象（one）、高层级结构（阶段/步骤两级）、低密度、无空间性。核心验收：每一个不可逆步骤都必须同时具备「执行前确认」与「执行后恢复/撤销」路径；应用在页面加载完成时即处于可用状态（初始流程数据内联首屏），可静态打开（根路径 index.html 或 dist/），本地运行，不部署、无后端、无账号、单主屏。
boundaries:
  in_scope:
    - 单一主屏：一个完整高后果流程的引导式执行界面，加载即就绪
    - 流程数据内联于首屏（无网络依赖的本地静态单页应用）
    - 不可逆步骤的双保险：显式确认（confirm gate）与完成后的恢复路径（undo/recovery window）
    - 步骤完成状态、前置条件校验、走完全程的成功反馈
    - 根路径 index.html 可直接静态打开，本地可运行可构建
  out_of_scope:
    - 后端服务、账号体系、持久化存储
    - 多流程/多主屏、导航层级超过一个主屏
    - 外部服务部署或云同步
    - 多人协作与实时性
  scope_complete: true
open_questions: []
