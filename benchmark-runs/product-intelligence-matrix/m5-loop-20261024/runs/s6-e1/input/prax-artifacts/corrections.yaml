  - id: corr-sdir-v02-state-ownership
    scope:
      project: E:\codex-prj\ab-worktrees\pi-matrix-m5\s6-e1
      surfaces:
        - runbook-executor
    finding:
      type: artifact-persistence
      observed: screen.sdir.yaml 停留在 v0.1（无 state_ownership 字段）；v0.2 提交负载已声明
        selection→phase-rail、preview→phase-rail、mode→step-detail、inspector→session
        四项归属且 lint PASS，但因 validate gate 拒绝 generate_from_decisions 而无法落盘。实现中
        selection（当前步指针/左轨选中）与 preview（键盘聚焦高亮）均由 phase-rail 区域承载（app.js focusin
        追踪 + rail 高亮）。
    intended:
      statement: 会话 SDIR 的 state_ownership = [ {selection, phase-rail}, {preview,
        phase-rail}, {mode, step-detail}, {inspector, session} ]；selection 与
        preview 均有已声明归属者，state_ownership_declared 判据按此评定。
    evidence_refs:
      - screen.sdir.yaml
      - app.js
    regression:
      check_id: state_ownership_declared
      requirement: Selection and preview states both have declared owners
    supersedes: []
    promotion:
      candidate: false
    created_at: 2026-10-24T19:41:58.468Z
