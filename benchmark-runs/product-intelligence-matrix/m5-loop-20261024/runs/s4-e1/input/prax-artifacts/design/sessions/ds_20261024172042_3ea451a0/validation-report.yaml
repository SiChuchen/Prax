      artifact_refs:
        - artifacts/01-initial-first-screen.png
        - artifacts/03-irreversible-step-card.png
        - artifacts/06-after-irreversible-exec.png
        - artifacts/09-done-hero.png
    - check_id: hierarchy_review
      outcome: pass
      source: real-browser CDP screenshots
      notes: 详情区 dominant、清单与恢复路径 primary（不可逆红色横幅+恢复路径黄色子区，色/图标/文案三重编码）、顶栏与日志 supporting；spacious 单焦点，与 density_intent 一致。
      artifact_refs:
        - artifacts/01-initial-first-screen.png
        - artifacts/03-irreversible-step-card.png
        - artifacts/04-confirm-modal.png
        - artifacts/09-done-hero.png
    - check_id: destructive_recovery
      outcome: pass
      source: real-browser CDP full-journey run
      notes: 3 个不可逆步骤各具备输入式确认门（错误短语→错误态+按钮禁用，05）与执行前后常驻恢复路径（03/04）；恢复路径真实可走（ROLLBACK 确认→回退待重做→后续重锁→日志记录，08）；重做后走完全程（09：17/17、8/8 验证门、4 次不可逆执行含重做、1 次回滚）。pointer 状态机顺序强制，破坏性动作不可跳步。
      artifact_refs:
        - artifacts/03-irreversible-step-card.png
        - artifacts/04-confirm-modal.png
        - artifacts/05-confirm-error-state.png
        - artifacts/06-after-irreversible-exec.png
        - artifacts/07-recover-modal.png
        - artifacts/08-after-rollback.png
        - artifacts/09-done-hero.png
        - artifacts/run-journey.log
    - check_id: requirement_alignment
      outcome: pass
      source: code inspection + real-browser run
      notes: complete×consequential-flow：单一高后果生产发布 runbook；零失误走完全程（顺序强制+验证门+确认门，真实浏览器 17/17 走通）；不可逆步骤有恢复/确认路径（验收种子）；首屏即用（内联数据同步渲染，无加载态）；根路径 index.html 静态可开；无后端、无部署、本地运行。
      artifact_refs:
        - artifacts/01-initial-first-screen.png
        - artifacts/09-done-hero.png
        - artifacts/run-journey.log
        - index.html
        - data.js
