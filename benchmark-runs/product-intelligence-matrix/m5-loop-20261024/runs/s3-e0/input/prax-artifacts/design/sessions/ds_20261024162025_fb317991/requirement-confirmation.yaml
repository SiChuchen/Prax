version: "0.1"
user_quote:
  - 动词：complete；对象：高后果流程；成功标准：零失误走完全程
  - 判别：单一高后果流程，零失误走完全程、不可逆步骤有恢复/确认路径。
  - 验收种子：不可逆步骤有恢复/确认路径
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）
  - 应用在页面加载完成时即处于可用状态（初始数据随首屏就绪，不得以加载态作为可测状态）
restatement: "从零构建一个单页 Web 应用，引导用户『零失误』地走完一条单一的高后果流程（object_type: workflow）：流程呈高层级结构（阶段→步骤→检查项），按序推进不可跳步；每个不可逆步骤在执行前有显式确认路径（后果说明+二次确认），执行后有可用的恢复/回滚路径；出现验证不通过时进入异常分支引导恢复或安全中止，而非继续前行。初始流程数据随首屏内联就绪，静态打开即可用，单主屏，无后端/账号/持久化服务。"
boundaries:
  in_scope:
    - 单页应用（1 个主屏）呈现完整高后果流程向导
    - 阶段→步骤→检查项的高层级导航与进度
    - 不可逆步骤的后果预览、二次确认门与恢复/回滚路径
    - 验证失败时的异常分支（重试 / 恢复 / 安全中止）
    - 全程审计日志与完成/中止总结
    - 初始数据内联，静态打开即用，本地运行无外部服务
  out_of_scope:
    - 后端、账号体系、持久化服务
    - 多流程管理/流程编辑器
    - 部署到外部服务
    - 移动端适配
  scope_complete: true
open_questions: []
