version: "0.1"
user_quote:
  - 动词：explore；对象：多维数据；成功标准：维度切换不重置认知
  - 判别：维度是主要认知负担（从单概念到无界数据），切换维度不重置认知。
  - 过滤/投影状态有归属且可回退
  - 应用在页面加载完成时即处于可用状态（初始数据随首屏就绪，不得以加载态作为可测状态）
restatement: "Build a greenfield single-page web app for exploring a multi-dimensional dataset. The core cognitive act is switching which dimension (facet) the data is organized/projected by, and that switch must not reset the user's cognitive context: selection, filters, and projection state must be visible, attributed, and revertible. Data ships inline with first paint (no loading state). Static open via index.html, no backend, no deployment."
boundaries:
  in_scope:
    - Single-screen web app, static-open, dataset object with high dimensionality
    - Dimension switching (re-projection of the dataset by different facets) that preserves selection/filters/projection state
    - Filter/projection state is attributed (visible chips/pills with owner dimension) and revertible (undo/reset/history)
    - Inline seed data available at first paint; local-only, no external services
  out_of_scope:
    - Backend, accounts, persistence services
    - Deployment to external services
    - Multi-screen flows, mobile layouts
  scope_complete: true
open_questions: []
