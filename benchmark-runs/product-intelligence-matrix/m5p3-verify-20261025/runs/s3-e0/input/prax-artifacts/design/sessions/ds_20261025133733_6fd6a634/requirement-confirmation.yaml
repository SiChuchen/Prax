version: "0.1"
user_quote:
  - 动词：complete / 对象：高后果流程 / 成功标准：零失误走完全程
  - 判别：单一高后果流程，零失误走完全程、不可逆步骤有恢复/确认路径。
  - 验收种子：不可逆步骤有恢复/确认路径
  - 交付物必须能直接静态打开（根路径 index.html，或构建产物 dist/）
  - 应用在页面加载完成时即处于可用状态（初始数据随首屏就绪，不得以加载态作为可测状态）
restatement: "Build from scratch a single-page web app that guides a user through one high-consequence workflow to completion with zero mistakes. The workflow is a single (cardinality: one) hierarchical (high hierarchy) sequence of phases and steps. Every irreversible step must present an explicit confirmation gate before execution and a recovery/rollback path after execution. Medium volatility/uncertainty means steps carry runtime-verifiable values and conditional contingencies, not free-form guessing. Deliverable: static index.html (or dist/) with initial workflow data inlined, usable at first paint, no backend, no deployment, one main screen."
boundaries:
  in_scope:
    - "Single main screen: guided high-consequence workflow runner (workflow object, hierarchical phases > steps)"
    - Explicit confirmation gates on irreversible steps (typed-phrase / hold-to-confirm class)
    - Recovery/rollback path surfaced for every irreversible step, plus post-step undo window where defined
    - "Gate checks: preconditions, observed-value verification inputs, conditional contingency branches (medium volatility/uncertainty)"
    - "Zero-mistake aids: blocked progression on unmet gates, action audit log, progress and completion state"
    - "Static delivery: index.html at root, all initial data inlined, runnable locally via file or static server"
  out_of_scope:
    - Backend, accounts, persistence services, external deployment
    - Multiple screens/main screens beyond one
    - "Comparison features (comparison_need: none)"
    - Modifying the frozen acceptance criteria
  scope_complete: true
