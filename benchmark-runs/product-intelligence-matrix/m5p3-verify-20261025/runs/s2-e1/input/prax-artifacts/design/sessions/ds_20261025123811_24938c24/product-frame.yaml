version: "0.2"
jtbd:
  verb: explore
  target: 多维数据
  success: 维度切换不重置认知；过滤/投影状态有归属且可回退
primary_object:
  type: dataset
  label: 多维数据集
task_model:
  frequency: medium
  reversibility: reversible
  consequence: low
  expertise: mixed
user:
  primary_role: 数据分析/运营人员（用一张多维表做日常排查与盘点）
  expertise: intermediate
  familiarity: medium
goal:
  primary: 让用户沿任意维度切入并切换观察角度，全程保持对数据集的既有理解不丢失
tasks:
  primary: 在多维数据集上选择/切换维度（投影轴、着色、分组、过滤），连续探索不同切片而无需重建认知
  secondary:
    - 查看单条记录的多维细节
    - 回退某一步过滤/投影操作或一键清空回到全集
    - 读取当前视图的构成（处于哪些维度、哪些过滤生效、剩多少条）
product_objects:
  - id: dataset
    user_name: 数据集
    purpose: 承载全部记录与维度的唯一事实源，首屏内联就绪
  - id: dimension
    user_name: 维度
    purpose: 数据集的一个切面（分类/数值/时间），是用户的主要认知对象与切换目标
  - id: view_state
    user_name: 当前视图（投影/过滤状态）
    purpose: 当前生效的投影轴、着色维度、分组与过滤条件的集合，有归属（每条状态可见其来源维度与值）且可回退
  - id: step_history
    user_name: 操作轨迹
    purpose: 逐步记录用户施加的状态变更，支撑单步撤销与一键回全集
relationships:
  - source: dimension
    target: dataset
    type: facet_of
    direction: forward
    meaning: 每个维度是数据集的一个列切面
    importance: primary
    id: rel_dimension_dataset
  - source: view_state
    target: dimension
    type: references
    direction: forward
    meaning: 投影/过滤/分组状态引用具体维度，状态面板显示该引用（归属）
    importance: primary
    id: rel_view_state_dimension
  - source: step_history
    target: view_state
    type: snapshot_of
    direction: forward
    meaning: 每步操作保存视图状态快照，供回退
    importance: primary
    id: rel_step_history_view_state
mental_model_hypothesis:
  summary: 用户把数据集想成'一张可以换灯照的桌子'：数据本身不动，换的只是观察维度；认知锚点（关注的具体记录、已知的分布印象、过滤的语义）应跨维度切换保留；过滤是可累积、可追溯、可撤销的操作流
  confidence: medium
  evidence:
    - user_requirement
    - domain_convention
primary_success_definition: 用户在切换投影/着色/分组维度后：①关注记录与已读语义保持可见（不重置）；②每条生效的过滤/投影都能指出'来自哪个维度的什么条件'并可单步撤销或一键回全集
open_questions: []
