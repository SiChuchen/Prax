    - mc-owned-undo
    - mc-inline-data
must_preserve: []
regression_points: []
unresolved:
  - oq-1-dataset-domain
corrections: []
representation_portfolio:
  primary:
    type: chart
    reason: dimensional-space 的主导表示：任一维度可即时成为分布投影（分类→条形、数值→直方图+条带），同位同尺度切换承载'换灯不换桌'的心智模型
  supporting:
    - type: table
      reason: 稳定顺序的记录台账是被过滤仍可见的认知锚点，保证切换维度时行位置不跳
    - type: list
      reason: 维度清单按分类/数值/时间分组，是切换动作的发源地
  rejected:
    - option: cards
      reason: 高密度无界数据下扫描效率低，无法呈现分布（反模式 card-grid-for-dense-comparison）
    - option: graph
      reason: 关系性仅 medium，无网络拓扑语义
    - option: tree
      reason: 层级性 medium 但非主负担，树形切换会重置认知
    - option: map
      reason: spatiality=none，无地理/空间坐标语义
state_ownership:
  - state: selection
    owner: data
  - state: preview
    owner: session
acceptance:
  - 用户在切换投影/着色/分组维度后：①关注记录与已读语义保持可见（不重置）；②每条生效的过滤/投影都能指出'来自哪个维度的什么条件'并可单步撤销或一键回全集
validation:
