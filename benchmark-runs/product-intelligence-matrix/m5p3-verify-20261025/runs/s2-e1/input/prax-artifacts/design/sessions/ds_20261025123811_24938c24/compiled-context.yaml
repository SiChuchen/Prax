  primary: 在多维数据集上选择/切换维度（投影轴、着色、分组、过滤），连续探索不同切片而无需重建认知
product_relationships:
  - id: rel_dimension_dataset
    source: dimension
    target: dataset
    type: facet_of
    direction: forward
    meaning: 每个维度是数据集的一个列切面
    importance: primary
  - id: rel_view_state_dimension
    source: view_state
    target: dimension
    type: references
    direction: forward
    meaning: 投影/过滤/分组状态引用具体维度，状态面板显示该引用（归属）
    importance: primary
  - id: rel_step_history_view_state
    source: step_history
    target: view_state
    type: snapshot_of
    direction: forward
    meaning: 每步操作保存视图状态快照，供回退
    importance: primary
region_relationships:
  - id: region_rel_data_detail
    source: data
    target: detail
    type: selection_drives_contextual_detail
decisions:
  primary_structure: PAT-DATA-EXPLORER
