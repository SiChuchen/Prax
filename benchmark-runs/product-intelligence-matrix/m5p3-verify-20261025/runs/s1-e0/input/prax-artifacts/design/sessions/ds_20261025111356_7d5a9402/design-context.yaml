user:
  expertise: intermediate
  familiarity: medium
task:
  primary: 通过切换维度到投影通道来探索大型多维数据集，且切换过程不丢失认知上下文
  modes:
    - explore
    - filter
    - inspect
    - revert
  frequency: medium
domain:
  type: scientific-catalog exploration over a large multi-dimensional dataset
  entities:
    - dataset
    - record (planet)
    - dimension
    - projection channel mapping
    - filter
    - selection
    - state ledger entry
information:
  volume: high
  relationship_complexity: medium
  change_rate: medium
  comparison_need: low
platform:
  family: web
  form_factor: desktop
  input:
    - pointer
    - keyboard
  viewport: large
risk:
  destructive_actions: none
  error_cost: low
priorities:
  - 维度切换保留认知上下文：选择、过滤、视口在重投影后不丢失
  - 过滤/投影状态有归属且可回退（来源区域 + 一步撤销/回退）
  - 高密度同屏呈现多维度（通道 + 台账 + 图例）
  - 首屏即就绪：数据内联、无加载态、无网络依赖
density_intent: compact
confidence:
  overall: high
unknowns:
  - id: hierarchy-vs-flat-dimension-treatment
    impact: low
    affects:
      - design_decide
classification:
  version: "1"
  task_type: compare_filter_records
  domain_id: data_exploration
  interaction_mode: collection_with_contextual_detail
  product_type: unknown
  primary_object_type: dataset
  secondary_object_types:
    - projection
    - record
    - dimension
    - filter
    - state_entry
    - selection
  confidence: high
  evidence:
    - task_type=compare_filter_records ← token 'filter' in context.task and frame.tasks
    - domain_id=data_exploration ← token 'data' in context.domain
    - interaction_mode=collection_with_contextual_detail ← token 'filter' in context.task, frame.tasks, and context.priorities
    - primary_object_type=dataset ← most referenced product object in the Product Frame
  open_questions:
    - product_type could not be derived; record the intended audience and product kind
