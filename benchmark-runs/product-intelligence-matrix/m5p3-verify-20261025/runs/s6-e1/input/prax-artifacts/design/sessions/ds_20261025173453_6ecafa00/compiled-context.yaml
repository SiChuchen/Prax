unresolved:
  - 简报未指定具体行业场景——采用生产发布（release runbook）作为代表性高后果流程，判别语义与简报一致
  - industry_scenario_unspecified
corrections: []
representation_portfolio:
  primary:
    type: wizard
    reason: 单一高后果流程、零失误目标要求强顺序与强制门控：只有当前步骤可操作，不可逆提交被确认门拦截——这是向导的任务表示，但以常驻列表-详情布局实现以保留全流程概览
  supporting:
    - type: list
      reason: 左栏阶段→步骤有序导航器：全流程概览、状态与锁定语义、恢复点标记
    - type: form
      reason: 步骤详情区的核验清单（逐项勾选，全勾解锁主操作）
    - type: document
      reason: 步骤背景说明、风险提示与恢复预案的结构化文本
  rejected:
    - option: 全屏分步 wizard（每次只见一步）
      reason: 丢失全流程概览与恢复点可见性，恢复路径被藏进导航，违背验收种子对恢复路径常驻可得的要求
    - option: document 长文清单
      reason: 无门控与状态语义，无法拦截跳步与误提交
    - option: canvas/graph 流程图
      reason: 关系性低、空间性 none，图编排不承载门控与核验
    - option: table 步骤表格
      reason: 核验清单与确认门需要主从布局而非行列扫描
state_ownership:
  - state: selection
    owner: session
  - state: preview
    owner: checkpoint_panel
  - state: inspector
    owner: checkpoint_panel
  - state: mode
    owner: session
  - state: viewport
    owner: session
  - state: query
    owner: url
acceptance:
  - 不可逆步骤提交前必须通过确认门（勾选理解+输入口令），条件未满足时提交按钮禁用
  - 每个不可逆提交自动创建恢复点；恢复点在主屏常驻可见、可执行恢复，恢复本身需确认且写入执行记录
  - 首屏加载完成即处于就绪可交互状态：初始流程数据内联，无加载态作为可测状态
  - 键盘可完成主工作：步骤选择、核验勾选、打开确认门、提交、恢复均有键盘路径且焦点可见
  - 恢复后流程状态回退到该恢复点之前，且执行记录留痕
  - 全部不可逆步骤提交并完成最终步骤后进入完成态摘要，可重启演练重置流程
