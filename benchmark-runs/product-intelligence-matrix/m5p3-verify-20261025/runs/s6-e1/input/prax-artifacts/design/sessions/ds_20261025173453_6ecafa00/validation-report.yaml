        - evidence/08-completed.png
        - evidence/run.log
    - check_id: destructive_recovery
      outcome: pass
      source: real-browser destructive-flow walkthrough (CDP) + prax-measure receipt bf4dc102
      notes: 高风险错误成本与 destructive_actions=high 匹配（附 Prax 对当前树的自测回执 17:45:08：7/7 全 PASS）。(1) 不可逆提交前置三重门——核验全勾才解锁主操作、模态确认门明示后果、勾选理解+输入步骤口令（口令错误提交保持禁用，见 03）；(2) 提交成功自动创建提交前快照恢复点（04：RP-1）；(3) 恢复路径常驻右栏、恢复需确认且写入执行记录，恢复后流程真实回退（06：S4 回到当前步骤）；(4) 被更新提交取代的恢复点禁用恢复；(5) 重置演练需输入 RESET 口令（10）。零失误全程走查全 PASS。
