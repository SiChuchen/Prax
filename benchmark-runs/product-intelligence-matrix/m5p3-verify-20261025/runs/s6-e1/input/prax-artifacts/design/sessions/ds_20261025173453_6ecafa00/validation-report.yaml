      notes: 交付与确认的 restatement/scope/success 逐条对齐：(1) 用户任务 complete×高后果流程——生产发布 runbook 走完全程，成功标准『零失误走完全程』在完成态明确呈现（08：核验21/21·确认门3/3·恢复点4·流程已完成）；(2) 验收种子『不可逆步骤有恢复/确认路径』——3 个不可逆步骤各有确认门+自动恢复点+可执行恢复（02/04/05/06）；(3) 交付约束——根路径 index.html 静态可开、零依赖无构建、首屏内联数据加载即用、本地运行不部署、单页单主屏；(4) 规模上限——单页单屏，无后端/账号/持久化。
