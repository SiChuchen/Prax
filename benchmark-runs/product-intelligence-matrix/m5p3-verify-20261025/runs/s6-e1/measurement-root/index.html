<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发布关口 · Release Gate — 生产发布流程完成台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="progress_header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">▣</span>
      <div class="brand-text">
        <strong>发布关口</strong>
        <span class="brand-sub" id="wf-title"></span>
      </div>
    </div>
    <div class="badges" id="badges" aria-label="整体进度与完整性"></div>
    <button type="button" class="btn btn-ghost" id="btn-reset" data-action="open-reset">重启演练</button>
  </header>

  <div class="shell">
    <nav class="nav" id="step_navigator" aria-label="阶段与步骤导航">
      <div class="nav-head">
        <h2>流程步骤</h2>
        <span class="nav-hint" id="nav-progress"></span>
      </div>
      <div id="nav-list"></div>
    </nav>

    <main class="detail" id="step_detail" aria-label="当前步骤详情"></main>

    <aside class="side" aria-label="恢复点与执行记录">
      <section class="side-panel" id="checkpoint_panel" aria-label="恢复点台账">
        <div class="side-head">
          <h2>恢复点</h2>
          <span class="side-note">不可逆提交自动创建 · 恢复路径</span>
        </div>
        <div id="rp-list"></div>
      </section>
      <section class="side-panel side-panel-grow" id="ledger_panel" aria-label="执行记录">
        <div class="side-head">
          <h2>执行记录</h2>
          <span class="side-note">全部动作留痕</span>
        </div>
        <ol class="ledger" id="ledger-list"></ol>
      </section>
    </aside>
  </div>

  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 初始流程数据随脚本内联，DOMContentLoaded 前完成首屏渲染：页面加载完成即可用，无加载态 -->
  <script src="app.js"></script>
</body>
</html>
