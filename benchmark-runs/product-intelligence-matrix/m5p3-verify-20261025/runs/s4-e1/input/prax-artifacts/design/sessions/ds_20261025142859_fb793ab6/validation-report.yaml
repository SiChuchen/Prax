      evidence_required: true
    - id: hierarchy_review
      label: Hierarchy review
      kind: assistive
      profile: semantic_integrity
      facet: visual_hierarchy
      requirement: Visual prominence follows SDIR importance rather than implementation convenience.
      evidence_required: true
