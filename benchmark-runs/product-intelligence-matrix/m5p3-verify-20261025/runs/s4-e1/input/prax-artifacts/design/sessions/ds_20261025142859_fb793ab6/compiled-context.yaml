representation_portfolio:
  primary:
    type: wizard
    reason: 用户任务是“按序走完一个高后果流程”，向导式顺序推进+完成门与状态机直接对应零失误走完全程；每步只暴露当前动作，防跳步防遗漏
  supporting:
    - type: list
      reason: 左侧阶段→步骤轨：有序层级导航，selection 常驻可见（hierarchy=high，List Detail 契约）
    - type: form
      reason: 前置自查清单与分支判定以表单交互承载，未全勾禁用完成
    - type: document
      reason: 办理要点/恢复手册以文档式排版阅读（不可逆步骤的恢复路径需成段可查）
  rejected:
    - option: timeline
      reason: temporality=low，时间轴会夸大时间维
    - option: table
      reason: 无比较需求，表格制造伪密度
    - option: canvas/map
      reason: spatiality=none
    - option: document 长文滚动
      reason: 无法按序锁定与逐步确认
state_ownership:
  - state: selection
    owner: 当前步骤的可执行动作与完成门（前置自查未全勾不可完成）
  - state: preview
    owner: session
acceptance:
  - 用户从“解散决议”走到“注销证明归档”，全程零失误：未跳步、未漏办，全部不可逆步骤均经确认仪式后执行，且任一时刻都能找到当前步骤的恢复/补救路径。
