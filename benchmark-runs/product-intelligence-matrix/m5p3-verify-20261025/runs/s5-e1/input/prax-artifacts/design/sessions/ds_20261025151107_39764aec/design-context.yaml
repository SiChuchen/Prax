user:
  expertise: mixed
  familiarity: medium
task:
  primary: 切换投影维度/度量/聚合探索数据集，同时保持过滤器、选择与排序等认知状态
  modes:
    - explore
    - filter
    - project
    - inspect
    - revert
  frequency: medium
domain:
  type: 即席数据分析 / OLAP 式多维探索
  entities:
    - dataset
    - record
    - dimension
    - measure
    - projection
    - probe (filter)
    - selection
    - state history
information:
  volume: high
  relationship_complexity: medium
  change_rate: medium
  comparison_need: low
platform:
  family: web
  form_factor: desktop
  input:
    - pointer
    - keyboard
  viewport: large
risk:
  destructive_actions: none
  error_cost: low
priorities:
  - 维度切换不重置认知（过滤器/选择/排序跨投影保持）
  - 过滤/投影状态有归属（来源可见）
  - 状态可回退（单项移除 / undo-redo / 历史回跳）
  - 首屏即用：初始数据内联，无加载态
  - 高密度单屏呈现，信息无折叠丢失
density_intent: compact
confidence:
  overall: high
unknowns: []
classification:
  version: "1"
  task_type: compare_filter_records
  domain_id: observability_analytics
  interaction_mode: collection_with_contextual_detail
  product_type: unknown
  primary_object_type: projection
  secondary_object_types:
    - record
    - dataset
    - probe
    - state_history
  confidence: high
  evidence:
    - task_type=compare_filter_records ← token 'filter' in context.task and frame.tasks
    - domain_id=observability_analytics ← token '分析' in context.domain
    - interaction_mode=collection_with_contextual_detail ← token 'filter' in context.task, frame.tasks, and context.priorities
    - primary_object_type=projection ← most referenced product object in the Product Frame
  open_questions:
    - product_type could not be derived; record the intended audience and product kind
