  items:
    - check_id: delta_conformance
      outcome: pass
      source: app/architecture/* implementation + tests/canvas-engine.test.mjs (18/18 pass)
      notes: canvas-stage opens at Architecture density with a readable-zoom floor (fitViewContract minZoom 0.5 inside the Architecture band) and a dominant-Region opening frame; top-level Regions compose as a near-square grid (layout.ts composeTopLevelRegions, aspect 0.92-1.83 across fixtures); Region roll-up summaries render at Landscape/Architecture (region-node.tsx region-summary with counts and key object names); Trace renders an ordered corridor (numbered step badges, entry/exit markers, per-transition payload labels, corridor bar with trigger -> outcome) over the stable map without re-layout; inspector-panel is a docked 336px column inside the stage with camera translation compensation of half the dock width on open/close.
    - check_id: untouched_surface_regression
      outcome: pass
      source: npm test (build + 18/18 tests) incl. fixtures budgets, revision timeline, pending overlay and read-only boundary tests
      notes: "Surfaces outside the declared change targets behave as before: app.architecture.focus (two-hop context emphasis retained, now with an immediate fit that includes context), app.architecture-fixtures (same workbench, all four fixtures validate), Semantic Graph adapter, maintenance contract and Registry boundaries untouched; fixture budgets, ELK geometry audits, emphasis invariants and incremental stability tests keep passing; Human Web stays read-only (drag still writes only the local layout cache, key bumped to v2 with a layout-version component)."
    - check_id: pattern_consistency
      outcome: pass
      source: app/architecture/interaction.ts, layout.ts, projection.ts, region-node.tsx, architecture-canvas.tsx
      notes: "Established patterns retained: deriveCanvasView read model before projection; emphasis vocabulary (primary/related/context/normal/muted/suppressed) instead of opacity hacks; ELK owns structure with deterministic post-pass and synthetic corridor routes replacing the SmartEdge dependency that failed at scale in real browser QA; line-pattern relationship grammar without rainbow colors; progressive disclosure preserved (architecture withholds non-key Objects behind Region summaries, small maps under 24 objects stay complete, component/operational restore everything)."
    - check_id: authority_consistency
      outcome: pass
      source: PAT-CANVAS-WORKSPACE + PAT-LIST-DETAIL-INSPECTOR decisions; P-19 Preserve Context, P-22 Signal over Chrome
      notes: "Canvas stays the dominant workspace; Inspector docks as a subordinate contextual panel and never replaces the map; Trace is a lens over the stable map. Quiet structural visual language: no glow, no marketing chrome, non-scaling-stroke keeps line weights screen-space constant, labels compensate toward the 13px screen floor. No design authorities beyond the built-in pack were declared."
    - check_id: requirement_alignment
      outcome: pass
      source: run-evidence/screenshots/01..05 + real browser DOM measurements (Playwright) on http://localhost:5199/architecture-fixtures
      notes: "Acceptance verified in a real local browser on the Complex 64/124 fixture: default Browse opens at Architecture density (zoom clamped to the 0.5 floor) with Region names ~13px and object labels at the 13px screen-space floor after compensation, dominant-Region frame with 4 visible Region summaries (01-browse-complex-default.png, 05-browse-small-default.png shows a 15-object map fully visible at 0.78); following one relationship keeps global context (edge active, both endpoints primary, Inspector endpoints, 04-relationship-lens-complex.png); Trace shows the ordered corridor entry -> steps -> outcome with numbered badges and payload labels at 0.3 overview zoom (03-trace-corridor-complex.png); docking the Inspector narrows the map 1543->1208px while the camera translates exactly half the dock width (measured 10.25 -> -157.75) and the map never collapses to a thumbnail (02-inspector-docked-complex.png)."
