overall_impression:
  strongest: impl-3
  weakest: impl-6
notes: >-
  评审方法说明：截图均为真实浏览器截图并逐张查看（本环境经图像分析通道获取内容描述，非像素级直读），
  diff 逐份通读；所有截图共同呈安静深色专业工具风格，无彩虹配色、无营销装饰、无永久发光，符合固定约束。

  关键观察：
  (1) impl-2 的 git-diff.patch 不完整——changed-files.txt 列出的 app/architecture/readability.ts 与
  tests/canvas-readability.test.mjs 两个新文件无对应 hunk，且 interaction.ts 显示为二进制差异不可读；
  其相机/标签/边预算核心逻辑仅能凭 docs 描述与导入引用间接核验（已在其 R5/R7 体现）。
  (2) impl-6 的 landscape-region-summaries.png 捕获到 UNHANDLED SCRIPT ERROR 错误弹窗，且其证据集最少
  （无 complex/small 默认视图截图），R5 判 FAIL 的直接依据即该截图。
  (3) 密度哲学分两派：impl-1/2/3 以 Region 摘要收编非关键对象，impl-4/6 保留全对象、以缩放下限保证可读，
  impl-5 采用 0.8 高缩放下限+允许地图溢出+主 Region 锚定首屏；三派均满足"屏幕空间可读"契约，未据以扣分。
  (4) 跨 Region 关系处理分两派：impl-1/3 保留并重算 ELK 风格正交路由，impl-2/4/5/6 弃路由交给 SmartEdge
  渲染器避障；后者均削弱了 diff 内可验证的正交/避障测试断言，已在各自 R7 体现。
  (5) 视觉分析对个别截图的布局判读存在噪声（如 impl-1 复杂图默认视图被判为单行横条，与其自身
  "compose two-dimensionally" 测试断言矛盾），评分以 diff+测试为主证据、截图为佐证。
  (6) impl-2 修改了 fixtures.ts（对象按 Region 连续分块替代轮询条带）并在 docs 中说明理由且保留困难用例；
  此为基准数据分布调整而非数据形状变更，特此披露。
