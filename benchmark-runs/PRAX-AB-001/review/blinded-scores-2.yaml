overall_impression:
  strongest: impl-3  # 唯一同时做到：默认视图真二维且密度专业（截图 01/02）、块间 gutter 桥接正交路由、专用 CorridorEdge 有序走廊、按模式重算的停靠相机，且关键行为全部有测试（含 trace 透镜布局稳定）
  weakest: impl-6   # 自有证据截图捕获未处理运行时崩溃（onKeyDown TypeError），landscape 摘要契约项因此无证据；默认视图窗口内 Region 结构不可见、全量边渲染造成线缆噪声
notes: >-
  评审严格基于各包 review-patch.diff 与 screenshots/（均已逐张查看；PNG 实际分辨率 1600×900 至 2560×1257，
  查看时的缩小不影响可读性结论）。(1) 文字重叠（Region 标题 × 摘要行、Inspector 字段标签）在 impl-1/2/3/4/5
  的截图中不同程度存在，根因多为 label-scale transform 放大后溢出原布局盒，属共性缺陷而非单一包问题。(2) 六包
  均未在 diff 中显式处理 empty 状态，故 R5 最高只给 PASS_WITH_REVIEW。(3) 未防御的 `target?.matches` 键盘
  模式在 impl-1/4/6 的 diff 中同样存在（未修），但只有 impl-6 的证据截图实际触发了崩溃——按证据纪律仅对
  impl-6 记 FAIL。(4) "默认窗口 vs 全图"是六包的根本分歧：impl-2/3/5/6 选择缩放下限保可读、允许地图溢出视口
  （截图呈现为局部窗口），impl-4 的 medium/complex 默认接近全图；各包对契约 4（内容占视口大部分）的自证测试
  口径不一（impl-3 用行列覆盖、impl-5 用 max 维度 ≥0.7），横向可比性有限。(5) impl-3 截图分辨率最高且其
  landscape 摘要、走廊、密度在截图层面最接近需求原话的诉求；impl-2 的文档自证（含实测与被拒备选）为六包最佳，
  若 R6 权重更高其总排名会上移。
