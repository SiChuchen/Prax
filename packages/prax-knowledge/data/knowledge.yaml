version: "0.2"
entries:
  - id: P-01
    type: principle
    name: Perceptual Grouping
    summary: Group related product objects so structure is visible before detail is read.
    category: perception
    scope:
      platform: &a1
        - web_desktop
      phase:
        - routing
        - decision
        - validation
    triggers:
      - grouping
      - architecture
      - canvas
      - relationships
      - dense_information
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - N027
        - A037
        - A018
      authority_category: established_design_research
      certainty: high
      recommendation_strength: strong
    validation:
      mode: assistive
      checks:
        - related objects form readable visual groups
    statement: Encode meaningful grouping with proximity, containment, alignment, and continuity.
    applies_when:
      - objects have meaningful relationships
      - a dense workspace must be scanned
    does_not_apply_when:
      - grouping would imply a false relationship
    rationale: People infer structure from perceptual organization before reading labels.
    forces:
      - scan speed
      - truthful relationships
      - density
    tradeoffs:
      - strong containers can add chrome
    examples:
      - cluster architecture nodes by bounded context
    conflicts:
      - P-22
    asset_class: principle
    stability: A
    trigger_conditions:
      platform: *a1
      phase:
        - routing
        - decision
        - validation
    evidence:
      authority_initial: A
      review_by: 2026-12-31
      source_version: N027
  - id: P-03
    type: principle
    name: Visual Hierarchy
    summary: Make importance and reading order evident without relying on decoration.
    category: perception
    scope:
      platform: &a2
        - web_desktop
      phase:
        - decision
        - validation
    triggers:
      - hierarchy
      - importance
      - attention
      - architecture
      - toolbar
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - A038
        - N049
        - A054
      authority_category: established_design_research
      certainty: high
      recommendation_strength: strong
    validation:
      mode: assistive
      checks:
        - primary content dominates supporting chrome
    statement: Use a small number of consistent prominence levels tied to product importance.
    applies_when:
      - multiple regions compete for attention
    does_not_apply_when:
      - all items genuinely have equal priority
    rationale: Hierarchy reduces search cost and makes the intended task path legible.
    forces:
      - attention
      - density
      - consistency
    tradeoffs:
      - over-emphasis can suppress useful context
    examples:
      - canvas dominates navigation and inspector
    asset_class: principle
    stability: A
    trigger_conditions:
      platform: *a2
      phase:
        - decision
        - validation
    evidence:
      authority_initial: A
      review_by: 2026-12-31
      source_version: A038
  - id: P-10
    type: principle
    name: Match the Product Mental Model
    summary: Organize the interface around user-recognized objects and tasks, not backend records.
    category: product_model
    scope:
      phase:
        - product_framing
        - decision
        - validation
    triggers:
      - mental_model
      - product_objects
      - backend_leak
      - architecture
      - settings
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - A050
        - A053
        - C029
      authority_category: interaction_design
      certainty: high
      recommendation_strength: strong
    validation:
      mode: assistive
      checks:
        - labels and navigation use user-facing concepts
    statement: Preserve the user's conceptual model even when technical capability boundaries differ.
    applies_when:
      - backend nouns could shape navigation
      - product objects are being named
    does_not_apply_when:
      - the technical object is itself the user's work object
    rationale: A system image built from implementation details transfers avoidable complexity to users.
    forces:
      - technical constraints
      - user language
      - learnability
    tradeoffs:
      - may require composition or a backend-for-frontend
    examples:
      - architecture node rather than database row
    asset_class: principle
    stability: A
    trigger_conditions:
      phase:
        - framing
        - decision
        - validation
    evidence:
      authority_initial: B
      review_by: 2026-12-31
      source_version: A050
  - id: P-19
    type: principle
    name: Preserve Context
    summary: Let users inspect detail without losing their place in the larger system.
    category: interaction
    scope:
      task_type:
        - inspect
        - trace
        - compare
      platform: &a3
        - web_desktop
      phase:
        - decision
        - validation
    triggers:
      - context
      - inspect
      - trace
      - selection
      - architecture
      - canvas
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - N011
        - B039
      authority_category: interaction_design
      certainty: high
      recommendation_strength: strong
    validation:
      mode: empirical
      checks:
        - detail inspection preserves overview and selection
    statement: Prefer contextual detail and reversible focus over navigation that destroys orientation.
    applies_when:
      - users traverse relationships
      - users compare overview and detail
    does_not_apply_when:
      - detail is a separate long-running workflow
    rationale: Reconstructing context consumes working memory and raises navigation cost.
    forces:
      - screen area
      - depth of detail
      - orientation
    tradeoffs:
      - persistent context consumes space
    examples:
      - selection-driven inspector beside a canvas
    asset_class: principle
    stability: A
    trigger_conditions:
      task_type:
        - review
        - locate
        - compare
      platform: *a3
      phase:
        - decision
        - validation
    evidence:
      authority_initial: B
      review_by: 2026-12-31
      source_version: N011
  - id: P-22
    type: principle
    name: Signal over Chrome
    summary: Keep controls and decoration quieter than the information users came to understand.
    category: information_design
    scope:
      density:
        - compact
        - regular
      platform: &a4
        - web_desktop
      phase:
        - decision
        - validation
    triggers:
      - signal_to_noise
      - density
      - chrome
      - toolbar
      - architecture
      - data
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - N011
        - A020
        - B026
        - B027
        - E025
      authority_category: information_design
      certainty: high
      recommendation_strength: strong
    validation:
      mode: assistive
      checks:
        - supporting chrome does not dominate content
    statement: Spend visual contrast on task-relevant structure, state, and exceptions.
    applies_when:
      - professional tools contain dense information
    does_not_apply_when:
      - a safety-critical control needs persistent emphasis
    rationale: Unstructured visual noise hides relationships and weakens hierarchy.
    forces:
      - discoverability
      - density
      - brand expression
    tradeoffs:
      - quiet controls may require stronger grouping or labels
    examples:
      - subdued canvas toolbar
    asset_class: principle
    stability: A
    trigger_conditions:
      platform: *a4
      density:
        - high
        - medium
      phase:
        - decision
        - validation
    evidence:
      authority_initial: C
      review_by: 2026-12-31
      source_version: N011
  - id: P-26
    type: principle
    name: Visibility of System Status
    summary: Expose meaningful progress, readiness, selection, and failure states.
    category: feedback
    scope:
      phase:
        - decision
        - sdir
        - validation
    triggers:
      - status
      - loading
      - empty
      - ready
      - error
      - selected
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - N005
        - N052
        - N004
      authority_category: usability_heuristics
      certainty: high
      recommendation_strength: strong
    validation:
      mode: deterministic
      checks:
        - required states are represented
    statement: Every meaningful operation and data surface must communicate its current state.
    applies_when:
      - work is asynchronous
      - data can be absent or fail
    does_not_apply_when:
      - state changes are instantaneous and self-evident
    rationale: Feedback closes the action loop and prevents uncertainty from becoming repeated action.
    forces:
      - latency
      - interruption
      - error recovery
    tradeoffs:
      - status messaging can become noisy
    asset_class: principle
    stability: A
    trigger_conditions:
      phase:
        - decision
        - sdir
        - validation
    evidence:
      authority_initial: C
      review_by: 2026-12-31
      source_version: N005
  - id: P-28
    type: principle
    name: Recoverable Action
    summary: Prevent costly mistakes and make ordinary actions reversible where possible.
    category: safety
    scope:
      phase:
        - decision
        - validation
    triggers:
      - destructive
      - error_cost
      - undo
      - recovery
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - N005
        - N001
      authority_category: usability_heuristics
      certainty: high
      recommendation_strength: strong
    validation:
      mode: deterministic
      checks:
        - high-cost actions have prevention or recovery
    statement: Match confirmation, undo, and recovery strength to the cost of error.
    applies_when:
      - actions mutate or delete valuable state
    does_not_apply_when:
      - read-only inspection
    rationale: Recovery is more robust than relying on perfect attention.
    forces:
      - speed
      - safety
      - reversibility
    tradeoffs:
      - confirmation adds friction
    asset_class: principle
    stability: A
    trigger_conditions:
      phase:
        - decision
        - validation
    evidence:
      authority_initial: C
      review_by: 2026-12-31
      source_version: N005
  - id: H-01
    type: heuristic
    name: Task-first Entry
    summary: The first view should make the primary user task obvious.
    category: task_clarity
    scope:
      phase:
