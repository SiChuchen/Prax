      recommendation_strength: strong
    validation:
      mode: assistive
      checks:
        - primary task is apparent from the initial view
    statement: Allocate the initial view around the primary task and its necessary context.
    applies_when:
      - a screen has one dominant purpose
    rationale: Clear entry reduces orientation and choice cost.
    asset_class: heuristic
    stability: A
    trigger_conditions:
