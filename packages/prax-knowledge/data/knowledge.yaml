  - id: H-07
    type: heuristic
    name: State Completeness
    summary: Define loading, empty, ready, selected, and error behavior before implementation.
    category: feedback
    scope:
      phase:
        - sdir
        - validation
    triggers:
      - states
      - loading
      - empty
      - ready
      - selected
      - error
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - N005
        - N052
      authority_category: synthesized_heuristic
      certainty: high
      recommendation_strength: strong
    validation:
      mode: deterministic
      checks:
        - required state set is complete
    statement: Treat non-happy states as first-class design intent.
    applies_when:
      - content is loaded or selected
    rationale: Missing states force implementation-time invention and inconsistent recovery.
    asset_class: heuristic
    stability: A
    trigger_conditions:
      phase:
        - sdir
        - validation
    evidence:
      authority_initial: C
      review_by: 2026-12-31
      source_version: N005
  - id: H-13
    type: heuristic
    name: Structured Density
    summary: Professional tools may be dense when groups, hierarchy, and interaction remain legible.
    category: density
    scope:
      density:
        - compact
        - regular
      platform: &a5
        - web_desktop
      phase:
        - decision
        - validation
    triggers:
      - density
      - professional_tool
      - data
      - architecture
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - B026
        - B027
        - A038
      authority_category: synthesized_heuristic
      certainty: high
      recommendation_strength: strong
    validation:
      mode: assistive
      checks:
        - density is structured rather than merely compressed
    statement: Increase information per view only while grouping, target clarity, and state remain readable.
    applies_when:
      - expert users compare many related objects
    does_not_apply_when:
      - novices need guided sequential work
    rationale: Density supports expert scan and comparison, but only if structure carries the load.
    tradeoffs:
      - higher learning threshold
    asset_class: heuristic
    stability: A
    trigger_conditions:
      platform: *a5
      density:
        - high
        - medium
      phase:
        - decision
        - validation
    evidence:
      authority_initial: C
      review_by: 2026-12-31
      source_version: B026
  - id: H-19
