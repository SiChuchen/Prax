        - N011
        - B039
      authority_category: established_pattern_family
      certainty: medium
      recommendation_strength: moderate
    validation:
      mode: empirical
      checks:
        - overview and detail support the primary task
    statement: Provide task-relevant overview and narrowing before expensive detail.
    applies_when:
      - the information space exceeds a single readable view
    known_exceptions:
      - the original mantra is a useful family resemblance
      - not a universal sequence
    rationale: Layered exploration balances global orientation with local precision.
    research_notes:
