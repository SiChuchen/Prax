        - A050
        - A053
      authority_category: synthesized_heuristic
      certainty: high
      recommendation_strength: strong
    validation:
      mode: assistive
      checks:
        - labels match the product frame
    statement: One user-facing concept should keep one name across the experience.
    applies_when:
      - an object appears in multiple regions
    rationale: Stable language reinforces a coherent system image.
    asset_class: heuristic
    stability: A
