  - id: H-22
    type: heuristic
    name: Overview, Filter, Detail
    summary: Start with a meaningful overview, narrow deliberately, then expose detail on demand.
    category: information_exploration
    scope:
      task_type:
        - explore
        - inspect
        - trace
        - compare
      domain:
        - architecture
        - data
      phase:
        - decision
        - validation
    triggers:
