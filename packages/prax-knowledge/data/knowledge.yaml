  - id: PAT-APPLICATION-SHELL
    type: pattern
    name: Application Shell
    summary: Stable global navigation and utilities around a changing work region.
    category: structure
    scope:
      platform: &a7
        - web_desktop
      phase:
        - decision
    triggers:
      - navigation
      - multi_area
      - application
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - A019
        - N019
      authority_category: pattern_synthesis
      certainty: high
      recommendation_strength: moderate
    validation:
      mode: assistive
      checks:
        - global shell remains stable across work areas
    statement: Use a stable shell when users move among several durable product areas.
    applies_when:
      - multiple durable work areas share identity and utilities
    does_not_apply_when:
      - one focused task dominates the entire product
    rationale: Stable global structure supports orientation across workflows.
    pattern_contract:
      problem: Users need to move among durable product areas without reorienting
      context: Multi-area desktop web applications
      forces:
        - global orientation
        - local focus
      solution: Keep global navigation and utilities stable around a replaceable work region
      tradeoffs:
        - persistent chrome consumes space
      consequences:
        - strong orientation
        - risk of over-navigation
      applies_when:
        - several durable areas exist
      does_not_apply_when:
        - the product is a single workspace
      related_patterns:
        composed_of: []
        complements:
          - PAT-WORKSPACE
        alternatives:
          - pattern: PAT-WORKSPACE
            when: one workspace dominates
      anti_patterns:
        - backend-table-per-navigation-item
    asset_class: pattern
    stability: B
    trigger_conditions:
      platform: *a7
      phase:
        - decision
    evidence:
      authority_initial: C
      review_by: 2026-12-31
      source_version: A019
  - id: PAT-WORKSPACE
    type: pattern
    name: Workspace
    summary: A persistent surface for iterative, object-centered work.
    category: structure
    scope:
      platform: &a8
        - web_desktop
      density:
        - compact
        - regular
      phase:
        - decision
    triggers:
      - workspace
      - iterative_work
      - professional_tool
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - N019
        - A021
      authority_category: pattern_synthesis
      certainty: high
      recommendation_strength: strong
    validation:
      mode: empirical
      checks:
        - primary work remains in a stable surface
    statement: Use a persistent workspace when users repeatedly manipulate or inspect related objects.
    applies_when:
      - work is iterative and context-rich
    does_not_apply_when:
      - the task is short and linear
    rationale: A stable surface preserves context across repeated actions.
    pattern_contract:
      problem: Repeated actions lose context across page transitions
      context: Expert desktop tools
      forces:
        - context
        - density
        - repeated action
      solution: Keep the primary object space persistent and place supporting actions around it
      tradeoffs:
        - higher initial complexity
      consequences:
        - fast iteration
        - need for strong hierarchy
      applies_when:
        - tasks are iterative
      does_not_apply_when:
        - tasks are linear
      related_patterns:
        composed_of: []
        complements:
          - PAT-LIST-DETAIL-INSPECTOR
        alternatives:
          - pattern: PAT-APPLICATION-SHELL
            when: global navigation dominates
      anti_patterns:
        - dashboard-as-workspace
    asset_class: pattern
    stability: B
    trigger_conditions:
      platform: *a8
      density:
        - high
        - medium
      phase:
        - decision
    evidence:
      authority_initial: C
      review_by: 2026-12-31
      source_version: N019
  - id: PAT-CANVAS-WORKSPACE
    type: pattern
    name: Canvas Workspace
    summary: A spatial workspace for understanding and manipulating relationships.
    category: structure
    scope:
      task_type:
        - inspect
        - trace
        - explore
      domain:
        - architecture
      platform: &a9
        - web_desktop
      density:
        - compact
        - regular
      phase:
        - decision
    triggers:
      - architecture
      - canvas
      - graph
      - nodes
      - relationships
      - trace
    lifecycle:
      status: reviewed
    provenance:
      source_refs:
        - N019
        - E023
        - A021
        - PRAX-GOLDEN-001
      authority_category: project_pattern_synthesis
      certainty: medium
      recommendation_strength: strong
    validation:
      mode: empirical
      checks:
        - users can locate and follow a relationship without losing global context
    statement: Make the relationship canvas dominant; keep navigation, tools, and inspection subordinate and contextual.
    applies_when:
      - spatial relationships are central to the task
      - overview and trace must coexist
    does_not_apply_when:
      - items are primarily sequential or tabular
    rationale: Spatial continuity and contextual inspection support system understanding better than page-by-page traversal.
    forces:
      - global context
      - local detail
      - density
      - pan-and-zoom cost
    tradeoffs:
      - accessibility and small-screen behavior require alternatives
    examples:
      - software architecture explorer
    counterexamples:
      - provider settings form
    related:
      - H-19
      - H-21
      - H-22
      - P-01
      - P-19
    pattern_contract:
      problem: Users must understand a complex relationship network while inspecting individual entities
      context: Desktop architecture analysis with expert users
      forces:
        - global context
        - local detail
        - traceability
        - interaction cost
      solution: Use a dominant spatial canvas with selection-driven contextual detail and quiet supporting chrome
      tradeoffs:
        - pan and zoom can disorient; keyboard and list alternatives are needed
      consequences:
        - strong relationship comprehension
        - more complex interaction validation
      applies_when:
        - relationships are first-class product objects
        - preserving context is a success criterion
      does_not_apply_when:
        - the task is configuration
        - the information is naturally tabular
      related_patterns:
        composed_of:
          - PAT-WORKSPACE
        complements:
          - PAT-LIST-DETAIL-INSPECTOR
        alternatives:
          - pattern: PAT-DATA-EXPLORER
            when: comparison is primarily row-based
      anti_patterns:
        - decorative-node-map
        - full-page-selection-navigation
    asset_class: pattern
    stability: B
    trigger_conditions:
      task_type:
        - review
        - locate
        - explore
      platform: *a9
      density:
        - high
        - medium
      phase:
        - decision
    evidence:
      authority_initial: C
      review_by: 2026-12-31
      source_version: N019
  - id: PAT-LIST-DETAIL
    type: pattern
    name: List Detail
    summary: Select from a collection and inspect one object in an adjacent detail region.
    category: structure
    scope:
      task_type:
        - browse
        - inspect
      platform: &a10
        - web_desktop
      phase:
        - decision
    triggers:
      - list
      - collection
      - detail
      - selection
    lifecycle:
      status: stable
    provenance:
      source_refs:
        - A019
        - N019
      authority_category: pattern_synthesis
      certainty: high
      recommendation_strength: moderate
    validation:
      mode: empirical
      checks:
        - selection and detail remain synchronized
    statement: Use list-detail when collection scanning precedes focused inspection.
    applies_when:
      - items are naturally ordered or filtered
    does_not_apply_when:
      - relationships among items are the primary object
    rationale: Adjacent detail reduces navigation while preserving collection context.
    pattern_contract:
      problem: Users repeatedly move between a collection and item detail
      context: Desktop collection workflows
      forces:
        - scan speed
        - detail space
      solution: Keep selection list and current detail visible together
      tradeoffs:
        - limited width for both regions
      consequences:
        - fast inspection
        - clear selection dependency
      applies_when:
        - collection order matters
      does_not_apply_when:
        - spatial relationships dominate
      related_patterns:
